/* Fleet ERP - styles
   Built for phones used outdoors: high contrast, big tap targets, no dark
   theme. The one loud element is the number plate; everything else is quiet. */

:root {
  --ground: #e9ecef;
  --surface: #ffffff;
  --ink: #1e2a33;
  --ink-soft: #52606b;
  --line: #cbd3da;
  --plate: #f5c400;
  --plate-ink: #14191f;
  --bad: #a8221a;
  --bad-bg: #fbe6e3;
  --warn: #6b4500;
  --warn-bg: #fdf0c4;
  --good: #176b3f;
  --good-bg: #e0f1e7;
  --focus: #0b57d0;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Oriya", "Noto Sans Devanagari", sans-serif;
  --nav-h: 64px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font: 16px/1.5 var(--font);
  color: var(--ink);
  background: var(--ground);
}
h1, h2, h3 { line-height: 1.2; margin: 0; font-weight: 750; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.shell { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
  background: var(--ink); color: #fff;
}
.brand { font-weight: 800; font-size: 1.05rem; letter-spacing: .01em; display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 0; }
.brand .logo { height: 30px; width: auto; flex: none; }
.brand span.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.login-logo { display: block; margin: 0 auto 6px; }
.login-logo .logo { width: 170px; height: auto; background: #1e2a33; border-radius: 12px; padding: 10px 12px; }
.spinner .logo { width: 120px; height: auto; display: block; margin: 0 auto 8px; background: #1e2a33; border-radius: 12px; padding: 8px 10px; }
.logo-run .wheel { animation: logo-spin .7s linear infinite; }
.logo-run .logo-road { animation: logo-road .5s linear infinite; }
.logo-run .logo-speed { animation: logo-speed .5s linear infinite; }
@keyframes logo-spin { to { transform: rotate(360deg); } }
@keyframes logo-road { to { stroke-dashoffset: 40; } }
@keyframes logo-speed { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(-10px); opacity: 0; } }
.logo .wheel { transform-box: fill-box; transform-origin: center; }
.logo-run .logo-body { animation: logo-bump .35s ease-in-out infinite alternate; }
@keyframes logo-bump { from { transform: translateY(0); } to { transform: translateY(-1.2px); } }
@media (prefers-reduced-motion: reduce) { .logo-run .wheel, .logo-run .logo-road, .logo-run .logo-speed, .logo-run .logo-body { animation: none; } }
.who { display: flex; align-items: center; gap: 10px; font-size: .9rem; min-width: 0; flex: 0 1 auto; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
@media (max-width: 560px) { .brand .name { display: none; } .brand .logo { height: 26px; } .who span { max-width: 38vw; } }
.topbar .btn { min-height: 36px; padding: 4px 12px; background: transparent; color: #fff; border-color: #6c7a86; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface); border-top: 1px solid var(--line);
}
.nav a {
  flex: 1 0 auto; min-width: 74px; padding: 0 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  text-decoration: none; font-size: .78rem; font-weight: 600; color: var(--ink-soft);
  border-top: 4px solid transparent;
}
.nav a svg { width: 24px; height: 24px; }
.nav a[aria-current="page"] { color: var(--ink); border-top-color: var(--plate); }

.main { padding: 20px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom)); max-width: 980px; width: 100%; margin: 0 auto; }
.main:focus { outline: none; }

@media (min-width: 900px) {
  .shell { grid-template-columns: 220px 1fr; grid-template-rows: auto 1fr; }
  .topbar { grid-column: 1 / -1; }
  .nav {
    position: static; grid-row: 2; grid-column: 1; height: auto; padding: 16px 12px;
    display: flex; flex-direction: column; gap: 4px; border-top: 0; border-right: 1px solid var(--line);
    align-self: stretch; overflow: visible;
  }
  .nav a { flex: 0 0 auto; min-width: 0; flex-direction: row; justify-content: flex-start; gap: 12px; font-size: 1rem; padding: 10px 12px; border-top: 0; border-left: 4px solid transparent; border-radius: 6px; }
  .nav a[aria-current="page"] { background: var(--ground); border-left-color: var(--plate); }
  .main { grid-row: 2; grid-column: 2; padding-bottom: 48px; margin: 0; }
  .who span { max-width: 300px; }
}

/* ---------- page furniture ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.page-head .sub { color: var(--ink-soft); margin-top: 4px; }
.stack { display: grid; gap: 16px; }
.stack-sm { display: grid; gap: 8px; }
.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.muted { color: var(--ink-soft); }
.back { display: inline-block; margin-bottom: 12px; color: var(--ink-soft); text-decoration: none; font-weight: 600; }
.back:hover { text-decoration: underline; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.panel > h2 { margin-bottom: 12px; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 28px 16px; text-align: center; color: var(--ink-soft); }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; font-size: 1.05rem; }

.banner { background: var(--warn-bg); color: var(--warn); padding: 8px 16px; font-weight: 600; text-align: center; }
.main > .banner { margin-bottom: 16px; border-radius: 8px; }

/* ---------- plate: the one loud thing ---------- */
.plate {
  display: inline-block; white-space: nowrap;
  background: var(--plate); color: var(--plate-ink);
  font-weight: 800; letter-spacing: .08em; font-variant-numeric: tabular-nums;
  padding: .16em .55em; border-radius: 6px;
  border: 2px solid var(--plate-ink);
  box-shadow: inset 0 0 0 2px var(--plate), inset 0 0 0 3px rgba(20, 25, 31, .5);
}
.plate.big { font-size: 1.9rem; padding: .12em .5em; }

/* ---------- buttons and form controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 16px; border-radius: 8px;
  border: 2px solid var(--ink); background: var(--surface); color: var(--ink);
  font-weight: 700; cursor: pointer; text-decoration: none;
}
.btn:hover { background: #f3f5f7; }

const __m_hrlogic = (() => {
// Shared by both backends and the screens: HR and payroll. Staff, daily attendance, advances and the
// monthly salary sheet. A salary sheet is worked out from attendance, trips and advances, never typed.

const HR_WRITERS = ['admin', 'owner', 'accountant'];
const TITLES = ['Driver', 'Helper', 'Mechanic', 'Store keeper', 'Office', 'Supervisor', 'Other'];

const ATT_STATUS = [
  { value: 'present', label: 'Present' }, { value: 'half_day', label: 'Half day' }, { value: 'leave', label: 'Paid leave' },
  { value: 'off', label: 'Weekly off' }, { value: 'absent', label: 'Absent' },
];

// Statutory rates, as commonly applied. Check them with your accountant; they are per-person switches, off by default.
const PF_RATE = 0.12, PF_CEILING = 15000, ESI_RATE = 0.0075, ESI_LIMIT = 21000;

const DATE = /^\d{4}-\d{2}-\d{2}$/;
const text = (v, max) => { const t = String(v ?? '').trim(); return t ? t.slice(0, max) : null; };
const need = (v, what) => { const t = text(v, 200); if (!t) throw storeError(`Enter ${what}.`); return t; };

  if (v === null || v === undefined || v === '') { if (req) throw storeError(`Enter ${what}.`); return 0; }
  const n = Number(v);
  if (!(n >= min && n <= max) || (req && n <= 0)) throw storeError(`Enter ${what}.`);
  return round2(n);
};

function cleanStaff(v) {
  if (!TITLES.includes(v.title)) throw storeError('Choose the job.');
  if (!PAY_TYPES.some((p) => p.value === v.pay_type)) throw storeError('Choose monthly salary or daily wage.');

  if (left && left < join) throw storeError('The leaving date is before the joining date.');

    name: need(v.name, 'the name').slice(0, 60), title: v.title, phone: text(v.phone, 15), join_date: join, left_date: left, pay_type: v.pay_type,
    basic: amount(v.basic, v.pay_type === 'daily' ? 'the daily wage' : 'the monthly salary', { req: true }), allowance: amount(v.allowance, 'the allowance'),
    trip_pay: amount(v.trip_pay, 'the pay per trip'), bata: amount(v.bata, 'the bata per day'),
    pf: v.pf === true || v.pf === 'true', esi: v.esi === true || v.esi === 'true', pf_no: text(v.pf_no, 30), esi_no: text(v.esi_no, 30),

function cleanAdvance(v) {

const dayNumOf = (iso) => Number(String(iso).replaceAll('-', ''));
const daysInMonth = (month) => { const [y, m] = month.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
const monthEnd = (month) => `${month}-${String(daysInMonth(month)).padStart(2, '0')}`;
const monthLabel = (month) => new Date(month + '-01T00:00:00Z').toLocaleDateString('en-IN', { month: 'long', year: 'numeric', timeZone: 'UTC' });

// The days a person was on the books in a month: from the joining date to the leaving date.
function daysOnBooks(staff, month) {
  const first = `${month}-01`, last = monthEnd(month);
  const from = staff.join_date > first ? staff.join_date : first;
  const to = staff.left_date && staff.left_date < last ? staff.left_date : last;
  if (to < from) return [];
  const out = [];
  for (let d = Number(from.slice(8)); d <= Number(to.slice(8)); d++) out.push(`${month}-${String(d).padStart(2, '0')}`);
  return out;
}

// Counts of each kind of day for one person in one month. Days on the books with no mark are "unmarked".
function attendanceCounts(staff, month, rows) {
  const mine = new Map(rows.filter((r) => r.staff_id === staff.id).map((r) => [r.att_date, r.status]));
  const c = { present: 0, half_day: 0, leave: 0, off: 0, absent: 0, unmarked: 0, onBooks: 0 };

    c.onBooks += 1;
    const s = mine.get(d);
    if (s) c[s] += 1; else c.unmarked += 1;
  }
  return c;
}

// Advances: what is still to recover, from the paid salary sheets.
function advanceBalances(advances, payslips) {
  const got = new Map();
  for (const p of payslips) if (p.status === 'paid') for (const r of p.recoveries || []) got.set(r.advance_id, round2((got.get(r.advance_id) || 0) + r.amount));
  return new Map(advances.map((a) => { const recovered = got.get(a.id) || 0; return [a.id, { recovered, balance: round2(a.amount - recovered) }]; }));
}

// One person's salary for a month. trips = completed trips the person drove in the month.
function computePayslip(staff, month, counts, trips, openAdvances, otherDeduction = 0) {
  const days = daysInMonth(month);
  const worked = counts.present + counts.half_day * 0.5;
  const paidDays = worked + counts.leave + counts.off;
  const monthly = staff.pay_type === 'monthly';
  const basic_earned = monthly ? round2(staff.basic * Math.min(paidDays, days) / days) : round2(staff.basic * worked);
  const allowance_earned = monthly ? round2(staff.allowance * Math.min(paidDays, days) / days) : 0;
  const trip_amount = round2(trips * staff.trip_pay);
  const bata_amount = round2(worked * staff.bata);
  const gross = round2(basic_earned + allowance_earned + trip_amount + bata_amount);
  const pf = staff.pf ? round2(PF_RATE * Math.min(basic_earned, PF_CEILING)) : 0;
  const esi = staff.esi && gross <= ESI_LIMIT ? Math.ceil(gross * ESI_RATE) : 0;
  let room = round2(gross - pf - esi - otherDeduction);
  const recoveries = [];
  for (const a of openAdvances) {
    if (room <= 0) break;
    const take = Math.min(a.instalment, a.balance, room);
    if (take > 0) { recoveries.push({ advance_id: a.id, amount: round2(take) }); room = round2(room - take); }
  }
  const advance_recovery = round2(recoveries.reduce((s, r) => s + r.amount, 0));
  const net = round2(gross - pf - esi - advance_recovery - otherDeduction);
  return {
    days_in_month: days, present: counts.present, half: counts.half_day, leave: counts.leave, off: counts.off, absent: counts.absent, unmarked: counts.unmarked,
    paid_days: monthly ? paidDays : worked, trips, basic_earned, allowance_earned, trip_amount, bata_amount, gross, pf, esi, advance_recovery, recoveries, other_deduction: otherDeduction, net,
  };
}

})();

// ---- machines.js ----
const __m_machines = (() => {
// Earth movers and personal vehicles. Both keep a register of machines and a log of meter readings
// (odometer in km for a vehicle, hour meter for an earth mover). One service serves both pages.
const { storeError } = __m_storelogic;
const MACHINE_KINDS = {
  earth: {
    col: 'earth_movers', readCol: 'earth_mover_readings', roles: ['admin', 'owner', 'manager'], defaultUnit: 'hours',
    title: 'Earth movers', one: 'earth mover', path: '/earthmovers',
    types: ['JCB', 'Excavator', 'Loader', 'Dozer', 'Roller', 'Crane', 'Other'],
  },
  personal: {
    col: 'personal_vehicles', readCol: 'personal_vehicle_readings', roles: ['admin', 'owner'], defaultUnit: 'km',
    title: 'Personal vehicles', one: 'vehicle', path: '/personal',
    types: ['Car', 'SUV', 'Bike', 'Scooter', 'Other'],
  },
};
const MACHINE_STATUS = [{ value: 'active', label: 'In use' }, { value: 'inactive', label: 'Not in use' }, { value: 'sold', label: 'Sold' }];
const UNITS = [{ value: 'km', label: 'Odometer (km)' }, { value: 'hours', label: 'Hour meter (hours)' }];

const live = (rows) => rows.filter((r) => !r.deleted_at);
const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
const denied = () => Object.assign(storeError('You do not have permission to do this.'), { code: 'permission-denied' });
const txt = (v, n) => { const s = String(v ?? '').replace(/\s+/g, ' ').trim().slice(0, n); return s || null; };
const byDate = (a, b) => (a.reading_date < b.reading_date ? -1 : a.reading_date > b.reading_date ? 1 : a.reading - b.reading);

// The readings of one machine, oldest first, each with how much it moved since the one before.
function withDeltas(readings) {
  const sorted = [...readings].sort(byDate);
  return sorted.map((r, i) => ({ ...r, since_last: i ? Math.round((r.reading - sorted[i - 1].reading) * 10) / 10 : null }));
}

function cleanMachine(kind, v) {
  const k = MACHINE_KINDS[kind];
  const reg_no = String(v.reg_no ?? '').toUpperCase().replace(/\s+/g, ' ').trim();
  if (reg_no.length < 2 || reg_no.length > 30) throw storeError('Enter the registration number or machine number.');
  const mtype = k.types.includes(v.mtype) ? v.mtype : null;
  if (!mtype) throw storeError('Choose the type.');
  const make_model = txt(v.make_model, 60);
  if (!make_model) throw storeError('Enter the make and model.');
  if (!['km', 'hours'].includes(v.unit)) throw storeError('Choose how the meter counts: km or hours.');
  if (!MACHINE_STATUS.some((s) => s.value === v.status)) throw storeError('Choose the status.');
  return { reg_no, mtype, make_model, unit: v.unit, used_by: txt(v.used_by, 60), status: v.status, notes: txt(v.notes, 500) };
}

function createMachines(a) {
  const m = {};
  const cfg = (kind) => {
    const k = MACHINE_KINDS[kind];
    if (!k) throw storeError('Unknown list.');
    if (!k.roles.includes(a.role())) throw denied();
    return k;
  };
  const readingsOf = async (k, id) => withDeltas(live(await a.list(k.readCol)).filter((r) => r.machine_id === id));

  m.listMachines = async (kind) => {
    const k = cfg(kind);
    const [machines, readings] = await Promise.all([a.list(k.col), a.list(k.readCol)]);
    const latest = new Map();
    for (const r of live(readings).sort(byDate)) latest.set(r.machine_id, r);
    return live(machines).map((x) => {
      const l = latest.get(x.id);
      return { ...x, last_reading: l ? l.reading : null, last_reading_on: l ? l.reading_date : null };
    }).sort((p, q) => p.reg_no.localeCompare(q.reg_no));
  };

  m.getMachine = async (kind, id) => {
    const k = cfg(kind);
    const row = await a.get(k.col, id);
    if (!row || row.deleted_at) return null;
    return { ...row, readings: await readingsOf(k, id) };
  };

  m.saveMachine = async (kind, values, id) => {
    const k = cfg(kind);
    const row = cleanMachine(kind, values);
    const others = live(await a.list(k.col)).filter((x) => x.id !== id);
    if (others.some((x) => x.reg_no === row.reg_no)) throw storeError('This number is already in the list.');
    if (id) {
      const before = await a.get(k.col, id);
      if (!before || before.deleted_at) throw storeError('Not found.');
      return a.update(k.col, id, row, before);
    }
    const first = Number(values.reading);
    if (values.reading === '' || values.reading == null || !Number.isFinite(first) || first < 0 || first > 10000000) throw storeError('Enter the current meter reading.');
    const made = await a.insert(k.col, row);
    await a.insert(k.readCol, { machine_id: made.id, machine_name: row.reg_no, reading_date: a.today(), reading: first, note: 'Opening reading' });
    return made;
  };

  m.removeMachine = async (kind, id) => {
    const k = cfg(kind);
    const before = await a.get(k.col, id);
    if (!before || before.deleted_at) throw storeError('Not found.');
    return a.softDelete(k.col, id, before);
  };

  m.listReadings = async (kind, machineId) => { const k = cfg(kind); return readingsOf(k, machineId); };

  m.saveReading = async (kind, values) => {
    const k = cfg(kind);
    const machine = await a.get(k.col, values.machine_id);
    if (!machine || machine.deleted_at) throw storeError('Not found.');
    const reading_date = values.reading_date;
    if (!isDate(reading_date) || reading_date > a.today()) throw storeError('Choose the date of the reading (not in the future).');
    const reading = Number(values.reading);
    if (values.reading === '' || values.reading == null || !Number.isFinite(reading) || reading < 0 || reading > 10000000) throw storeError('Enter the meter reading.');
    const unit = machine.unit === 'hours' ? 'hours' : 'km';
    const all = await readingsOf(k, machine.id);
    const before = all.filter((r) => r.reading_date <= reading_date).pop();
    if (before && reading < before.reading) throw storeError(`The reading cannot be lower than ${before.reading} ${unit} on ${before.reading_date}.`);
    const after = all.find((r) => r.reading_date > reading_date);
    if (after && reading > after.reading) throw storeError(`The reading cannot be higher than ${after.reading} ${unit} on ${after.reading_date}.`);
    return a.insert(k.readCol, { machine_id: machine.id, machine_name: machine.reg_no, reading_date, reading, note: txt(values.note, 200) });
  };

  // Only the newest reading can be taken back, so the log never has a hole in the middle.
  m.removeReading = async (kind, id) => {
    const k = cfg(kind);
    const row = await a.get(k.readCol, id);
    if (!row || row.deleted_at) throw storeError('Not found.');
    const all = await readingsOf(k, row.machine_id);
    if (all.length < 2) throw storeError('A machine needs at least one reading.');
    if (all[all.length - 1].id !== id) throw storeError('Only the newest reading can be removed.');
    return a.softDelete(k.readCol, id, row);
  };
  return m;
}

return { MACHINE_KINDS, MACHINE_STATUS, UNITS, withDeltas, cleanMachine, createMachines };
})();

const __m_tyrelogic = (() => {
// Shared by the real and demo backends and the screens: what a tyre, tube or flap record holds,
// the checks on it, and the figures worked out from it (age, km run, cost per km).

const KINDS = [
  { value: 'TYRE', label: 'Tyre' }, { value: 'TUBE', label: 'Tube' }, { value: 'FLAP', label: 'Flap' },
];
const KIND_LABEL = Object.fromEntries(KINDS.map((k) => [k.value, k.label]));

const POSITIONS = [
  'Front left', 'Front right',
  'Rear 1 left outer', 'Rear 1 left inner', 'Rear 1 right inner', 'Rear 1 right outer',
  'Rear 2 left outer', 'Rear 2 left inner', 'Rear 2 right inner', 'Rear 2 right outer',
  'Rear 3 left outer', 'Rear 3 left inner', 'Rear 3 right inner', 'Rear 3 right outer',
  'Stepney',
];

const STATUS_LABEL = { in_stock: 'In stock', fitted: 'On a truck', scrapped: 'Scrapped' };
const EVENT_LABEL = { BOUGHT: 'Bought', FIT: 'Fitted', REMOVE: 'Removed', PUNCTURE: 'Puncture repaired', RESOLE: 'Resoled', SCRAP: 'Scrapped' };
const TYRE_WRITERS = ['admin', 'owner', 'manager', 'store_keeper', 'mechanic'];

const tyreError = (message) => Object.assign(new Error(message), { code: 'app/error' });

const DATE = /^\d{4}-\d{2}-\d{2}$/;
const text = (v, max) => { const t = String(v ?? '').trim(); return t ? t.slice(0, max) : null; };
const numOrNull = (v, what) => {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  if (!(n >= 0)) throw tyreError(`${what} is not valid.`);
  return n;
};

function needDate(v, what = 'Date') {
  if (!DATE.test(v || '')) throw tyreError(`Choose the ${what.toLowerCase()}.`);
  return v;
}

// Checks the descriptive fields typed on the "add" or "edit" form.
const PAY_MODES = [{ value: 'cash', label: 'Cash' }, { value: 'credit', label: 'Credit' }];

function cleanTyre(values) {
  if (!KINDS.some((k) => k.value === values.kind)) throw tyreError('Choose tyre, tube or flap.');
  const serial_no = String(values.serial_no ?? '').trim().toUpperCase().replace(/\s+/g, '');
  if (!serial_no || serial_no.length > 30) throw tyreError('Enter the serial number (up to 30 letters and digits).');
  const cost = numOrNull(values.cost, 'The cost');
  if (cost !== null && cost > 10000000) throw tyreError('The cost is too high.');
  const pay_mode = values.pay_mode || null;
  if (pay_mode !== null && !PAY_MODES.some((p) => p.value === pay_mode)) throw tyreError('Choose cash or credit.');
  const purchase_date = values.purchase_date || null;
  if (purchase_date !== null) needDate(purchase_date, 'Purchase date');
  return {
    kind: values.kind, serial_no, brand: text(values.brand, 40), size: text(values.size, 20),
    purchase_date, vendor: text(values.vendor, 80), pay_mode, cost, notes: text(values.notes, 500),
  };
}

const newState = () => ({
  status: 'in_stock', truck_id: null, truck_no: null, position: null, fitted_on: null, fit_km: null,
  km_run: 0, punctures: 0, resole_count: 0, repair_cost: 0, scrapped_on: null, scrap_reason: null,
});

function cleanFit(v) {
  if (!v.truck_id) throw tyreError('Choose the truck.');
  if (!POSITIONS.includes(v.position)) throw tyreError('Choose the wheel position.');
  return { truck_id: v.truck_id, position: v.position, date: needDate(v.date), odometer_km: numOrNull(v.odometer_km, 'The odometer reading') };
}
function cleanMove(v) {
  return { date: needDate(v.date), odometer_km: numOrNull(v.odometer_km, 'The odometer reading'), note: text(v.note, 200) };
}
function cleanRepair(v) {
  return { date: needDate(v.date), cost: numOrNull(v.cost, 'The cost') ?? 0, vendor: text(v.vendor, 80), note: text(v.note, 200) };
}
function cleanScrap(v) {
  return { ...cleanMove(v), reason: text(v.reason, 200) };
}

// Kilometres run on the truck since fitting, when both readings were taken.
function kmSinceFit(tyre, odometer) {
  if (odometer == null || tyre.fit_km == null) return 0;
  const km = Number(odometer) - Number(tyre.fit_km);
  return km > 0 ? km : 0;
}

// Why a fit, removal or repair cannot be done now. Returns null when it can.
function problemWith(tyre, action) {
  if (!tyre || tyre.deleted_at) return 'Not found.';
  if (tyre.status === 'scrapped') return 'This one is scrapped.';
  if (action === 'fit' && tyre.status !== 'in_stock') return 'It is already on a truck. Remove it first.';
  if (action === 'unfit' && tyre.status !== 'fitted') return 'It is not on a truck.';
  if (action === 'resole' && tyre.status !== 'in_stock') return 'Take it off the truck before resoling.';
  if (action === 'resole' && tyre.kind !== 'TYRE') return 'Only tyres are resoled.';
  if (action === 'puncture' && tyre.kind === 'FLAP') return 'A flap cannot be punctured. Use scrap if it is torn.';
  return null;
}

// Age in days since it was fitted, else since purchase; cost of the item plus repairs; cost per km once it has run.
function tyreFigures(tyre, today) {
  const since = tyre.fitted_on || tyre.purchase_date || null;
  const ageDays = since ? Math.max(0, Math.round((Date.parse(today) - Date.parse(since)) / 86400000)) : null;
  const total = (tyre.cost || 0) + (tyre.repair_cost || 0);
  const perKm = tyre.km_run > 0 && total > 0 ? total / tyre.km_run : null;
  return { ageDays, total, perKm };
}

// Tyres on one truck, keyed by position and kind.
function onTruck(tyres, truckId) {
  return tyres.filter((t) => t.status === 'fitted' && t.truck_id === truckId);
}

return { KINDS, KIND_LABEL, POSITIONS, STATUS_LABEL, EVENT_LABEL, TYRE_WRITERS, tyreError, needDate, PAY_MODES, cleanTyre, newState, cleanFit, cleanMove, cleanRepair, cleanScrap, kmSinceFit, problemWith, tyreFigures, onTruck };
})();

const __m_docstatus = (() => {
// Vehicle document types and the expiry status of each document.
// Pure functions, no browser or database needed, so they are easy to test.
//
// Each truck record keeps `docs_latest`: for every document type, the entry with
// the latest expiry ({ document_id, doc_no, expires_on }). The dashboard reads only
// the trucks, never the whole document history, which keeps it fast and cheap.

const { daysBetween } = __m_ui;
const DOC_TYPES = [
  { code: 'RC', name: 'Registration Certificate (RC)', required: true, applies_to: 'all', reminder_days: 60, sort_order: 10 },
  { code: 'INSURANCE', name: 'Insurance', required: true, applies_to: 'all', reminder_days: 30, sort_order: 20 },
  { code: 'FITNESS', name: 'Fitness Certificate', required: true, applies_to: 'all', reminder_days: 30, sort_order: 30 },
  { code: 'ROAD_TAX', name: 'Road Tax', required: true, applies_to: 'all', reminder_days: 30, sort_order: 40 },
  { code: 'PERMIT', name: 'Permit', required: true, applies_to: 'all', reminder_days: 30, sort_order: 50 },
  { code: 'PUC', name: 'Pollution (PUC)', required: true, applies_to: 'all', reminder_days: 15, sort_order: 60 },
  { code: 'NATIONAL_PERMIT', name: 'National Permit', required: true, applies_to: 'national', reminder_days: 30, sort_order: 70 },
];

// The entry with the latest expiry wins. An entry without an expiry date comes last.
// Among equal expiry dates the newest entry wins (a not-yet-saved entry has no created_at, so it counts as newest).
function latestEntry(rows) {
  const sorted = [...rows].sort((a, b) =>
    (b.expires_on || '').localeCompare(a.expires_on || '')
    || String(b.created_at || '~').localeCompare(String(a.created_at || '~')));
  const top = sorted[0];
  return top ? { document_id: top.id, doc_no: top.doc_no ?? null, expires_on: top.expires_on ?? null, has_file: top.has_file === true } : null;
}

// One row per (truck, document that is required or recorded), same shape the screens always used.
// status: missing | expired | due_soon | ok | no_expiry
function statusRows(trucks, today) {
  const out = [];
  for (const t of trucks) {
    if (t.deleted_at || t.status === 'sold') continue;
    const latest = t.docs_latest || {};
    for (const ty of DOC_TYPES) {
      const l = latest[ty.code] || null;
      const needed = ty.required && (ty.applies_to === 'all' || ty.applies_to === t.vehicle_class);
      if (!needed && !l) continue;
      const days = l && l.expires_on ? daysBetween(today, l.expires_on) : null;
      let status = 'ok';
      if (!l) status = 'missing';
      else if (days === null) status = 'no_expiry';
      else if (days < 0) status = 'expired';
      else if (days <= ty.reminder_days) status = 'due_soon';
      out.push({
        truck_id: t.id, truck_no: t.truck_no, doc_type: ty.code, doc_name: ty.name, sort_order: ty.sort_order,
        document_id: l ? l.document_id : null, has_file: !!(l && l.has_file), doc_no: l ? l.doc_no : null, expires_on: l ? l.expires_on : null,
        days_left: days, status,
      });
    }
  }
  return out;
}

return { DOC_TYPES, latestEntry, statusRows };
})();

    return snap.docs.map(rowOf);
  }

  const newStamps = () => ({ created_at: serverTimestamp(), created_by: uid(), updated_at: serverTimestamp(), updated_by: uid(), deleted_at: null });
  const editStamps = () => ({ updated_at: serverTimestamp(), updated_by: uid() });
  const deleteStamps = () => ({ deleted_at: serverTimestamp(), ...editStamps() });

  function strip(o) {
    if (!o) return null;
    const out = {};
    for (const [k, v] of Object.entries(o)) if (!STAMP_KEYS.has(k) && k !== 'id') out[k] = v === undefined ? null : v;
    return out;
  }
  function audit(batch, path, action, before, after) {
    batch.set(doc(coll('audit_log')), {
      at: serverTimestamp(), by: uid(), by_name: me ? me.full_name : null, path, action, before: strip(before), after: strip(after),
    });
  }

  // Sends a batch. If there is no signal it stays queued on the phone and uploads later.
  async function commit(batch, { noWait } = {}) {
    const done = batch.commit();
    if (noWait) { done.catch((e) => errorListeners.forEach((f) => f(e))); return { queued: true }; }
    const outcome = await Promise.race([done.then(() => 'sent'), wait(QUEUE_AFTER_MS).then(() => 'queued')]);
    if (outcome === 'queued') {
      done.catch((e) => errorListeners.forEach((f) => f(e)));
      queuedListeners.forEach((f) => f());
      return { queued: true };
    }
    return { queued: false };
  }

  // When the database refuses a write, say who it thinks is signed in. That tells the admin at once whether
  // the account, the role or the published rules is the problem.
  async function whoAmI() {
    try {
      if (!auth.currentUser) return 'signed out';
      const snap = await getDoc(doc(db, 'profiles', auth.currentUser.uid));
      if (!snap.exists()) return 'no profile found for this login';
      const p = snap.data();
      return `the database sees you as role "${p.role}", ${p.active === true ? 'active' : 'NOT active'}${p.deleted_at ? ', removed' : ''}`;
    } catch (e) { return 'your profile could not be read (' + (e.code || e.message) + ')'; }
  }
  const guard = (fn) => async (...args) => {
    try { return await fn(...args); } catch (e) {
      if (e && e.code === 'permission-denied' && /insufficient permissions/i.test(e.message || '')) e.detail = await whoAmI();
      return { data: null, error: e };
    }
  };

  // ---------------------------------------------------------------- trucks
  async function allTrucks() { return (await rowsWhere('trucks', ['deleted_at', '==', null])).sort((a, b) => a.truck_no.localeCompare(b.truck_no)); }

  async function saveTruckImpl(values, id) {
    const truck_no = String(values.truck_no || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
    if (!/^[A-Z0-9]{6,12}$/.test(truck_no)) throw fail('violates check constraint "trucks_truck_no_check"');
    const same = live(await rowsWhere('trucks', ['truck_no', '==', truck_no])).filter((r) => r.id !== id);
    if (same.length) throw fail('duplicate key value violates unique constraint "trucks_truck_no_uq"');

    const fields = { ...pick(values, TRUCK_FIELDS), truck_no };
    const batch = writeBatch(db);
    if (id) {
      const ref = doc(db, 'trucks', id);
      const snap = await getDoc(ref);
      if (!snap.exists() || snap.data().deleted_at) throw fail('Truck not found.');
      const before = rowOf(snap);
      batch.update(ref, { ...fields, ...editStamps() });
      audit(batch, `trucks/${id}`, 'UPDATE', before, { ...before, ...fields });
      const res = await commit(batch);
      return { data: { ...before, ...fields }, error: null, queued: res.queued };
    }
    const ref = doc(coll('trucks'));
    batch.set(ref, { ...fields, docs_latest: {}, ...newStamps() });
    audit(batch, `trucks/${ref.id}`, 'INSERT', null, fields);
    const res = await commit(batch);
    return { data: { id: ref.id, ...fields, docs_latest: {}, deleted_at: null }, error: null, queued: res.queued };
  }

  async function removeTruckImpl(id) {
    const ref = doc(db, 'trucks', id);
    const snap = await getDoc(ref);
    if (!snap.exists()) throw fail('Truck not found.');
    const batch = writeBatch(db);
    batch.update(ref, deleteStamps());
    audit(batch, `trucks/${id}`, 'SOFT_DELETE', rowOf(snap), null);
    const res = await commit(batch);
    return { data: [{ id }], error: null, queued: res.queued };
  }

  // ---------------------------------------------------------------- driver assignment
  // One driver drives one truck at a time. Assigning a driver who is on another truck moves him
  // (the other truck is cleared in the same batch). Rules cannot check this; the app does.
  // The history of who drove which truck is in the audit log (each change is an UPDATE entry).
  const NO_DRIVER = { driver_id: null, driver_name: null, driver_since: null };

  // History: one row per stretch of a driver on a truck (truck_drivers: from_date, to_date; to_date is null while it lasts).
  // Closes the open stretch of a truck. If the truck had a driver from before history existed, the stretch is added already closed.
  async function closeStretch(batch, t, today) {
    const open = live(await rowsWhere('truck_drivers', ['truck_id', '==', t.id], ['to_date', '==', null]));
    for (const o of open) batch.update(doc(db, 'truck_drivers', o.id), { to_date: today, ...editStamps() });
    if (!open.length && t.driver_id) {
      batch.set(doc(coll('truck_drivers')), {
        truck_id: t.id, truck_no: t.truck_no, driver_id: t.driver_id, driver_name: t.driver_name || '',
        from_date: t.driver_since || today, to_date: today, ...newStamps(),
      });
    }
  }

  async function assignDriverImpl(truckId, driverId) {
    const today = todayIST();
    const tref = doc(db, 'trucks', truckId);
    const tsnap = await getDoc(tref);
    if (!tsnap.exists() || tsnap.data().deleted_at) throw fail('Truck not found.');
    const truck = rowOf(tsnap);
    if ((truck.driver_id || null) === (driverId || null)) return { data: truck, error: null, queued: false };
    const batch = writeBatch(db);
    let next = NO_DRIVER;
    let movedFrom = null;
    if (driverId) {
      const dsnap = await getDoc(doc(db, 'drivers', driverId));
      if (!dsnap.exists() || dsnap.data().deleted_at) throw fail('Driver not found.');
      const driver = rowOf(dsnap);
      if (driver.status !== 'active') throw fail('Only a working driver can be assigned to a truck.');
      const others = live(await rowsWhere('trucks', ['driver_id', '==', driverId])).filter((r) => r.id !== truckId);
      for (const o of others) {
        batch.update(doc(db, 'trucks', o.id), { ...NO_DRIVER, ...editStamps() });
        audit(batch, `trucks/${o.id}`, 'UPDATE', o, { ...o, ...NO_DRIVER });
        await closeStretch(batch, o, today);
        movedFrom = o.truck_no;
      }
      next = { driver_id: driverId, driver_name: driver.full_name, driver_since: today };
      batch.set(doc(coll('truck_drivers')), {
        truck_id: truckId, truck_no: truck.truck_no, driver_id: driverId, driver_name: driver.full_name,
        from_date: today, to_date: null, ...newStamps(),
      });
    }
    if (truck.driver_id) await closeStretch(batch, truck, today);
    batch.update(tref, { ...next, ...editStamps() });
    audit(batch, `trucks/${truckId}`, 'UPDATE', truck, { ...truck, ...next });
    const res = await commit(batch);
    return { data: { ...truck, ...next }, movedFrom, error: null, queued: res.queued };
  }

  const byRecent = (a, b) => (b.from_date || '').localeCompare(a.from_date || '')
    || (a.to_date === null ? -1 : 0) - (b.to_date === null ? -1 : 0) || (b.to_date || '').localeCompare(a.to_date || '');

  // Who drove this truck, newest first.
  async function truckHistoryImpl(truckId) {
    const rows = live(await rowsWhere('truck_drivers', ['truck_id', '==', truckId]));
    const snap = await getDoc(doc(db, 'trucks', truckId));
    const t = snap.exists() ? rowOf(snap) : null;
    if (t && !t.deleted_at && t.driver_id && !rows.some((r) => r.to_date === null)) {
      rows.push({ id: 'current', truck_id: t.id, truck_no: t.truck_no, driver_id: t.driver_id, driver_name: t.driver_name, from_date: t.driver_since, to_date: null });
    }
    return { data: rows.sort(byRecent), error: null };
  }

  // Which trucks this driver drove, newest first.
  async function driverHistoryImpl(driverId) {
    const rows = live(await rowsWhere('truck_drivers', ['driver_id', '==', driverId]));
    for (const t of live(await rowsWhere('trucks', ['driver_id', '==', driverId]))) {
      if (!rows.some((r) => r.truck_id === t.id && r.to_date === null)) {
        rows.push({ id: 'current-' + t.id, truck_id: t.id, truck_no: t.truck_no, driver_id: driverId, driver_name: t.driver_name, from_date: t.driver_since, to_date: null });
      }
    }
    return { data: rows.sort(byRecent), error: null };
  }

  // Which truck each driver was on at a given date: { driverId: { truck_id, truck_no } }.
  async function driverTrucksOnImpl(date) {
    const rows = live(await rowsWhere('truck_drivers')).sort(byRecent).reverse();   // oldest first, so the newest wins
    const out = {};
    for (const r of rows) {
      if (r.from_date <= date && (r.to_date === null || r.to_date >= date)) out[r.driver_id] = { truck_id: r.truck_id, truck_no: r.truck_no };
    }
    // trucks given a driver before history existed
    for (const t of await allTrucks()) {
      if (t.driver_id && !rows.some((r) => r.truck_id === t.id && r.to_date === null) && (!t.driver_since || t.driver_since <= date)) {
        out[t.driver_id] = { truck_id: t.id, truck_no: t.truck_no };
      }
    }
    return { data: out, error: null };
  }

  // ---------------------------------------------------------------- fuel (diesel, urea, lube)
  const FUEL_TYPES = ['DIESEL', 'UREA', 'LUBE'];
  const txt = (v, max) => { const t = String(v ?? '').trim(); return t ? t.slice(0, max) : null; };

  async function listFuelImpl(from, to) {
    const rows = live(await rowsWhere('fuel_entries', ['entry_date', '>=', from], ['entry_date', '<=', to]));
    return { data: rows.sort((a, b) => b.entry_date.localeCompare(a.entry_date) || String(b.created_at).localeCompare(String(a.created_at))), error: null };
  }

  async function saveFuelImpl(values, id) {
    if (!FUEL_TYPES.includes(values.fuel_type)) throw fail('Choose diesel, urea or lube.');
    const quantity = Number(values.quantity);
    if (!(quantity > 0 && quantity <= 5000)) throw fail('Enter the litres: more than 0 and up to 5000.');
    const rate = Number(values.rate ?? 0);
    if (!(rate >= 0 && rate <= 100000)) throw fail('Enter the rate per litre.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(values.entry_date || '')) throw fail('Choose a date.');
    const odometer_km = values.odometer_km === null || values.odometer_km === undefined || values.odometer_km === '' ? null : Number(values.odometer_km);
    if (odometer_km !== null && !(odometer_km >= 0)) throw fail('The odometer reading is not valid.');

    const tsnap = await getDoc(doc(db, 'trucks', values.truck_id));
    if (!tsnap.exists() || tsnap.data().deleted_at) throw fail('Truck not found.');
    const truck = rowOf(tsnap);
    // The driver: the one chosen, else the one on the truck now.
    let driver_id = values.driver_id || truck.driver_id || null;
    let driver_name = null;
    if (driver_id && driver_id === truck.driver_id) driver_name = truck.driver_name || null;
    else if (driver_id) {
      const dsnap = await getDoc(doc(db, 'drivers', driver_id));
      if (!dsnap.exists() || dsnap.data().deleted_at) throw fail('Driver not found.');
      driver_name = dsnap.data().full_name;
    }
    // Optional link to a trip of the same truck. When editing, the existing link is kept unless a new value is given.
    let before = null;
    if (id) { const bs = await getDoc(doc(db, 'fuel_entries', id)); before = bs.exists() ? rowOf(bs) : null; }
    const trip_id = values.trip_id !== undefined ? (values.trip_id || null) : (before ? before.trip_id ?? null : null);
    if (trip_id) {
      const ts = await getDoc(doc(db, 'trips', trip_id));
      if (!ts.exists() || ts.data().deleted_at) throw fail('Trip not found.');
      if (ts.data().truck_id !== values.truck_id) throw fail('That trip belongs to another truck.');
    }
    const fields = {
      truck_id: values.truck_id, truck_no: truck.truck_no, trip_id, driver_id, driver_name,
      entry_date: values.entry_date, fuel_type: values.fuel_type, item: txt(values.item, 60),
      quantity, rate, amount: Math.round(quantity * rate * 100) / 100, odometer_km,
      source: values.source === 'outside' ? 'outside' : 'own_tank',
      vendor: txt(values.vendor, 80), slip_no: txt(values.slip_no, 30), remarks: txt(values.remarks, 500),
    };
    const batch = writeBatch(db);
    if (id) {
      const ref = doc(db, 'fuel_entries', id);
      const snap = await getDoc(ref);
      if (!snap.exists() || snap.data().deleted_at) throw fail('Entry not found.');
      if (before.truck_id !== fields.truck_id) throw fail('The truck of an entry cannot be changed. Remove it and add a new one.');
      batch.update(ref, { ...fields, ...editStamps() });
      audit(batch, `fuel_entries/${id}`, 'UPDATE', before, { ...before, ...fields });
      const res = await commit(batch);
      return { data: { ...before, ...fields }, error: null, queued: res.queued };
    }
    const ref = doc(coll('fuel_entries'));
    batch.set(ref, { ...fields, ...newStamps() });
    audit(batch, `fuel_entries/${ref.id}`, 'INSERT', null, fields);
    const res = await commit(batch);
    return { data: { id: ref.id, ...fields, deleted_at: null }, error: null, queued: res.queued };
  }

  async function removeFuelImpl(id) {
    const ref = doc(db, 'fuel_entries', id);
    const snap = await getDoc(ref);
    if (!snap.exists()) throw fail('Entry not found.');
    const batch = writeBatch(db);
    batch.update(ref, deleteStamps());
    audit(batch, `fuel_entries/${id}`, 'SOFT_DELETE', rowOf(snap), null);
    const res = await commit(batch);
    return { data: [{ id }], error: null, queued: res.queued };
  }

  // ---------------------------------------------------------------- tyres, tubes and flaps
  const tyreEvent = (t, event, date, extra = {}) => ({
    tyre_id: t.id, tyre_serial: t.serial_no, item_kind: t.kind, event, event_date: date,
    truck_id: null, truck_no: null, position: null, odometer_km: null, cost: null, vendor: null, note: null, ...extra,
  });
  const offTruck = { truck_id: null, truck_no: null, position: null, fitted_on: null, fit_km: null };

  async function listTyresImpl() {
    const rows = live(await rowsWhere('tyres'));
    return { data: rows.sort((a, b) => a.kind.localeCompare(b.kind) || a.serial_no.localeCompare(b.serial_no)), error: null };
  }
  async function getTyreImpl(id) {
    const snap = await getDoc(doc(db, 'tyres', id));
    if (!snap.exists() || snap.data().deleted_at) throw fail('Not found.');
    const events = live(await rowsWhere('tyre_events', ['tyre_id', '==', id]))
      .sort((a, b) => a.event_date.localeCompare(b.event_date) || String(a.created_at).localeCompare(String(b.created_at)));
    return { data: { tyre: rowOf(snap), events }, error: null };
  }
  async function listTyreEventsImpl(from, to) {
    const rows = live(await rowsWhere('tyre_events', ['event_date', '>=', from], ['event_date', '<=', to]));
    return { data: rows.sort((a, b) => b.event_date.localeCompare(a.event_date) || String(b.created_at).localeCompare(String(a.created_at))), error: null };
  }

  async function saveTyreImpl(values, id) {
    const fields = cleanTyre(values);
    const same = live(await rowsWhere('tyres', ['serial_no', '==', fields.serial_no])).find((t) => t.kind === fields.kind && t.id !== id);
    if (same) throw fail(`${fields.serial_no} is already recorded.`);
    const batch = writeBatch(db);
    if (id) {
      const ref = doc(db, 'tyres', id);
      const snap = await getDoc(ref);
      if (!snap.exists() || snap.data().deleted_at) throw fail('Not found.');
      const before = rowOf(snap);
      if (before.kind !== fields.kind) throw fail('Tyre, tube or flap cannot be changed. Remove it and add a new one.');
      batch.update(ref, { ...fields, ...editStamps() });
      audit(batch, `tyres/${id}`, 'UPDATE', before, { ...before, ...fields });
      const res = await commit(batch);
      return { data: { ...before, ...fields }, error: null, queued: res.queued };
    }
    const ref = doc(coll('tyres'));
    const row = { ...fields, ...newState() };
    batch.set(ref, { ...row, ...newStamps() });
    batch.set(doc(coll('tyre_events')), {
      ...tyreEvent({ id: ref.id, serial_no: fields.serial_no, kind: fields.kind }, 'BOUGHT', fields.purchase_date || todayIST(), { cost: fields.cost, vendor: fields.vendor }),
      ...newStamps(),
    });
    audit(batch, `tyres/${ref.id}`, 'INSERT', null, row);
    const res = await commit(batch);
    return { data: { id: ref.id, ...row, deleted_at: null }, error: null, queued: res.queued };
  }

  // One change to a tyre together with the history line that records it, in a single batch.
  async function tyreAction(id, build) {
    const ref = doc(db, 'tyres', id);
    const snap = await getDoc(ref);
    if (!snap.exists() || snap.data().deleted_at) throw fail('Not found.');
    const before = rowOf(snap);
    const { patch, event } = await build(before);
    const batch = writeBatch(db);
    batch.update(ref, { ...patch, ...editStamps() });
    batch.set(doc(coll('tyre_events')), { ...event, ...newStamps() });
    audit(batch, `tyres/${id}`, 'UPDATE', before, { ...before, ...patch });
    const res = await commit(batch);
    return { data: { ...before, ...patch }, error: null, queued: res.queued };
  }
  const here = (t) => (t.status === 'fitted' ? { truck_id: t.truck_id, truck_no: t.truck_no, position: t.position } : {});
  function checkOdometer(t, v) {
    if (v.odometer_km != null && t.fit_km != null && v.odometer_km < t.fit_km) throw fail('The odometer is lower than when it was fitted.');
    if (t.fitted_on && v.date < t.fitted_on) throw fail('The date is before it was fitted.');
  }

  async function fitTyreImpl(id, values) {
    const v = cleanFit(values);
    const tsnap = await getDoc(doc(db, 'trucks', v.truck_id));
    if (!tsnap.exists() || tsnap.data().deleted_at) throw fail('Truck not found.');
    const truck = rowOf(tsnap);
    return tyreAction(id, async (t) => {
      const p = problemWith(t, 'fit'); if (p) throw fail(p);
      if (t.purchase_date && v.date < t.purchase_date) throw fail('It cannot be fitted before it was bought.');
      const clash = live(await rowsWhere('tyres', ['truck_id', '==', v.truck_id]))
        .find((x) => x.id !== id && x.status === 'fitted' && x.kind === t.kind && x.position === v.position);
      if (clash) throw fail(`${clash.serial_no} is already at ${v.position} on ${truck.truck_no}. Remove it first.`);
      return {
        patch: { status: 'fitted', truck_id: truck.id, truck_no: truck.truck_no, position: v.position, fitted_on: v.date, fit_km: v.odometer_km },
        event: tyreEvent(t, 'FIT', v.date, { truck_id: truck.id, truck_no: truck.truck_no, position: v.position, odometer_km: v.odometer_km }),
      };
    });
  }

  async function unfitTyreImpl(id, values) {
    const v = cleanMove(values);
    return tyreAction(id, async (t) => {
      const p = problemWith(t, 'unfit'); if (p) throw fail(p);
      checkOdometer(t, v);
      return {
        patch: { status: 'in_stock', ...offTruck, km_run: (t.km_run || 0) + kmSinceFit(t, v.odometer_km) },
        event: tyreEvent(t, 'REMOVE', v.date, { ...here(t), odometer_km: v.odometer_km, note: v.note }),
      };
    });
  }

  async function punctureImpl(id, values) {
    const v = cleanRepair(values);
    return tyreAction(id, async (t) => {
      const p = problemWith(t, 'puncture'); if (p) throw fail(p);
      return {
        patch: { punctures: (t.punctures || 0) + 1, repair_cost: (t.repair_cost || 0) + v.cost },
        event: tyreEvent(t, 'PUNCTURE', v.date, { ...here(t), cost: v.cost, vendor: v.vendor, note: v.note }),
      };
    });
  }

  async function resoleImpl(id, values) {
    const v = cleanRepair(values);
    return tyreAction(id, async (t) => {
      const p = problemWith(t, 'resole'); if (p) throw fail(p);
      return {
        patch: { resole_count: (t.resole_count || 0) + 1, repair_cost: (t.repair_cost || 0) + v.cost },
        event: tyreEvent(t, 'RESOLE', v.date, { cost: v.cost, vendor: v.vendor, note: v.note }),
      };
    });
  }

  async function scrapTyreImpl(id, values) {
    const v = cleanScrap(values);
    return tyreAction(id, async (t) => {
      const p = problemWith(t, 'scrap'); if (p) throw fail(p);
      if (t.status === 'fitted') checkOdometer(t, v);
      return {
        patch: { status: 'scrapped', ...offTruck, km_run: (t.km_run || 0) + (t.status === 'fitted' ? kmSinceFit(t, v.odometer_km) : 0), scrapped_on: v.date, scrap_reason: v.reason },
        event: tyreEvent(t, 'SCRAP', v.date, { ...here(t), odometer_km: v.odometer_km, note: v.reason }),
      };
    });
  }

  // Only a tyre that was just entered and has no history can be removed.
  async function removeTyreImpl(id) {
    const ref = doc(db, 'tyres', id);
    const snap = await getDoc(ref);
    if (!snap.exists() || snap.data().deleted_at) throw fail('Not found.');
    const events = live(await rowsWhere('tyre_events', ['tyre_id', '==', id]));
    if (snap.data().status !== 'in_stock' || events.some((e) => e.event !== 'BOUGHT')) throw fail('It has history, so it cannot be removed. Scrap it instead.');
    const batch = writeBatch(db);
    batch.update(ref, deleteStamps());
    for (const e of events) batch.update(doc(db, 'tyre_events', e.id), deleteStamps());
    audit(batch, `tyres/${id}`, 'SOFT_DELETE', rowOf(snap), null);
    const res = await commit(batch);
    return { data: [{ id }], error: null, queued: res.queued };
  }

  // ---------------------------------------------------------------- warehouse, parts shops, bills and payments
  async function need(col, id, what = 'Not found.') {
    const snap = await getDoc(doc(db, col, id));
    if (!snap.exists() || snap.data().deleted_at) throw fail(what);
    return rowOf(snap);
  }
  const sortBy = (rows, f) => rows.sort(f);

  async function listItemsImpl() {
    return { data: sortBy(live(await rowsWhere('items')), (a, b) => a.group.localeCompare(b.group) || a.name.localeCompare(b.name)), error: null };
  }
  async function saveItemImpl(values, id) {
    const f = cleanItem(values);
    const all = live(await rowsWhere('items'));
    if (all.some((i) => i.id !== id && i.name.toLowerCase() === f.name.toLowerCase())) throw fail(`${f.name} is already in the list.`);
    const batch = writeBatch(db);
    if (id) {
      const before = await need('items', id);
      batch.update(doc(db, 'items', id), { ...f, ...editStamps() });
      audit(batch, `items/${id}`, 'UPDATE', before, { ...before, ...f });
      const res = await commit(batch);
      return { data: { ...before, ...f }, error: null, queued: res.queued };
    }

  const moveRow = (item, kind, v, extra) => ({
    item_id: item.id, item_name: item.name, unit: item.unit, kind, move_date: v.date, qty: v.qty,
    vendor_id: null, vendor_name: null, bill_id: null, bill_no: null, rate: null, gst_pct: null, line_total: null,

  async function receiveGoodsImpl(values) {
    const v = cleanReceipt(values);
    const item = await need('items', v.item_id, 'Item not found.');
    const vendor = v.vendor_id ? await need('vendors', v.vendor_id, 'Shop not found.') : null;
    const total = lineTotal(v.qty, v.rate, v.gst_pct);
    if (v.bill_no && !(total > 0)) throw fail('Enter the rate so the bill amount can be added.');
    const batch = writeBatch(db);
    let bill_id = null;
    if (v.bill_no) {
      const existing = live(await rowsWhere('vendor_bills', ['vendor_id', '==', vendor.id])).find((b) => b.bill_no.toLowerCase() === v.bill_no.toLowerCase());
      if (existing) {
        bill_id = existing.id;
        const amount = round2(existing.amount + total);
        batch.update(doc(db, 'vendor_bills', existing.id), { amount, has_goods: true, ...editStamps() });
        audit(batch, `vendor_bills/${existing.id}`, 'UPDATE', existing, { ...existing, amount, has_goods: true });
      } else {
        const ref = doc(coll('vendor_bills'));
        bill_id = ref.id;
        const row = { vendor_id: vendor.id, vendor_name: vendor.name, bill_no: v.bill_no, bill_date: v.date, due_date: addDaysIso(v.date, vendor.credit_days ?? 30), amount: total, has_goods: true, note: null };
        batch.set(ref, { ...row, ...newStamps() });
        audit(batch, `vendor_bills/${ref.id}`, 'INSERT', null, row);
      }
    }
    const move = moveRow(item, 'RECEIPT', v, { vendor_id: vendor ? vendor.id : null, vendor_name: vendor ? vendor.name : null, bill_id, bill_no: v.bill_no, rate: v.rate, gst_pct: v.gst_pct, line_total: total });
    batch.set(doc(coll('stock_moves')), { ...move, ...newStamps() });
    const on_hand = Math.round((item.on_hand + v.qty) * 1000) / 1000;
    batch.update(doc(db, 'items', item.id), { on_hand, ...editStamps() });
    audit(batch, `items/${item.id}`, 'UPDATE', item, { ...item, on_hand });
    const res = await commit(batch);
    return { data: { ...item, on_hand }, error: null, queued: res.queued };
  }

  // Average cost per unit of what was received (before GST). Issues carry it, so a truck or job gets its parts cost.
  async function avgCost(itemId) {
    const got = live(await rowsWhere('stock_moves', ['item_id', '==', itemId])).filter((m) => m.kind === 'RECEIPT' && m.rate != null);
    const q = got.reduce((a, m) => a + m.qty, 0);
    return q > 0 ? round2(got.reduce((a, m) => a + m.qty * m.rate, 0) / q) : null;
  }

  async function issueGoodsImpl(values) {
    const v = cleanIssue(values);
    const item = await need('items', v.item_id, 'Item not found.');
    if (v.qty > item.on_hand) throw fail(`Only ${item.on_hand} ${item.unit} of ${item.name} in stock.`);
    let truck = null;
    if (v.truck_id) truck = await need('trucks', v.truck_id, 'Truck not found.');
    const job = values.job_id ? await need('job_cards', values.job_id, 'Job card not found.') : null;
    if (job && truck && job.truck_id !== truck.id) throw fail('That job card is for another truck.');
    const rate = await avgCost(item.id);
    const batch = writeBatch(db);
    batch.set(doc(coll('stock_moves')), { ...moveRow(item, 'ISSUE', v, { truck_id: truck ? truck.id : (job ? job.truck_id : null), truck_no: truck ? truck.truck_no : (job ? job.truck_no : null), rate, line_total: rate == null ? null : round2(rate * v.qty), job_id: job ? job.id : null }), ...newStamps() });
    const on_hand = Math.round((item.on_hand - v.qty) * 1000) / 1000;
    batch.update(doc(db, 'items', item.id), { on_hand, ...editStamps() });
    audit(batch, `items/${item.id}`, 'UPDATE', item, { ...item, on_hand });
    const res = await commit(batch);
    return { data: { ...item, on_hand }, error: null, queued: res.queued };
  }

  async function adjustStockImpl(values) {
    const v = cleanCount(values);
    const item = await need('items', v.item_id, 'Item not found.');
    const diff = Math.round((v.counted - item.on_hand) * 1000) / 1000;
    if (diff === 0) throw fail('The count matches the stock. Nothing to correct.');
    const batch = writeBatch(db);
    batch.set(doc(coll('stock_moves')), { ...moveRow(item, 'ADJUST', { ...v, qty: diff }, {}), ...newStamps() });
    batch.update(doc(db, 'items', item.id), { on_hand: v.counted, ...editStamps() });
    audit(batch, `items/${item.id}`, 'UPDATE', item, { ...item, on_hand: v.counted });
    const res = await commit(batch);
    return { data: { ...item, on_hand: v.counted }, error: null, queued: res.queued };
  }

  async function removeMoveImpl(id) {
    const move = await need('stock_moves', id);
    const item = await need('items', move.item_id, 'Item not found.');
    const on_hand = Math.round((item.on_hand - stockChange(move.kind, move.qty)) * 1000) / 1000;
    if (on_hand < 0) throw fail('Removing this would make the stock go below zero.');
    const batch = writeBatch(db);
    if (move.kind === 'RECEIPT' && move.bill_id) {
      const snap = await getDoc(doc(db, 'vendor_bills', move.bill_id));
      if (snap.exists() && !snap.data().deleted_at) {
        const bill = rowOf(snap);
        const amount = round2(bill.amount - (move.line_total || 0));
        if (amount > 0) {
          batch.update(doc(db, 'vendor_bills', bill.id), { amount, ...editStamps() });
          audit(batch, `vendor_bills/${bill.id}`, 'UPDATE', bill, { ...bill, amount });
        } else {
          batch.update(doc(db, 'vendor_bills', bill.id), deleteStamps());
          audit(batch, `vendor_bills/${bill.id}`, 'SOFT_DELETE', bill, null);
        }
      }
    }
    batch.update(doc(db, 'stock_moves', id), deleteStamps());
    audit(batch, `stock_moves/${id}`, 'SOFT_DELETE', move, null);
    batch.update(doc(db, 'items', item.id), { on_hand, ...editStamps() });
    const res = await commit(batch);
    return { data: [{ id }], error: null, queued: res.queued };
  }

  async function saveBillImpl(values, id) {

  // ---------------------------------------------------------------- accounting (shared service, see accounting.js)
  const accountingStore = {
    role: () => role(),
    list: async (col) => rowsWhere(col),
    get: async (col, id) => { const s = await getDoc(doc(db, col, id)); return s.exists() ? rowOf(s) : null; },
    today: () => todayIST(),
    async insert(col, row, id) {
      const batch = writeBatch(db); const ref = id ? doc(db, col, id) : doc(coll(col));
      batch.set(ref, { ...row, ...newStamps() }); audit(batch, `${col}/${ref.id}`, 'INSERT', null, row);
      await commit(batch);
      return { id: ref.id, ...row, deleted_at: null };
    },
    async update(col, id, patch, before) {
      const batch = writeBatch(db);
      batch.update(doc(db, col, id), { ...patch, ...editStamps() }); audit(batch, `${col}/${id}`, 'UPDATE', before, { ...before, ...patch });
      await commit(batch);
      return { ...before, ...patch };
    },
    async softDelete(col, id, before) {
      const batch = writeBatch(db);
      batch.update(doc(db, col, id), deleteStamps()); audit(batch, `${col}/${id}`, 'SOFT_DELETE', before, null);
      await commit(batch);
      return { id };
    },
    // Gap-free numbers: the counter and the document are written in one transaction.
    async insertNumbered(col, key, build) {
      const cref = doc(db, 'doc_counters', key); const ref = doc(coll(col));
      let row;
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(cref);
        const no = snap.exists() ? snap.data().last_no + 1 : 1;
        const stamp = { updated_at: serverTimestamp(), updated_by: uid() };
        if (snap.exists()) tx.update(cref, { last_no: no, ...stamp }); else tx.set(cref, { last_no: no, ...stamp });
        row = build(no);
        tx.set(ref, { ...row, ...newStamps() });
        audit(tx, `${col}/${ref.id}`, 'INSERT', null, row);
      });
      return { id: ref.id, ...row, deleted_at: null };
    },
    async lockedThrough() {
      const s = await getDoc(doc(db, 'period_locks', 'current'));
      if (!s.exists()) return null;
      const x = s.data(), day = x.locked_day ? String(x.locked_day) : '';
      return x.locked_through || (day.length === 8 ? `${day.slice(0, 4)}-${day.slice(4, 6)}-${day.slice(6)}` : null);
    },
  };
  const accounting = { ...createAccounting(accountingStore), ...createHr(accountingStore), ...createPlaces(accountingStore), ...createMachines(accountingStore) };
  const accountingApi = Object.fromEntries(Object.entries(accounting).map(([k, fn]) => [k, guard(async (...args) => ({ data: await fn(...args), error: null }))]));

  // ---------------------------------------------------------------- job cards (servicing and repairs)
  async function listJobsImpl(filter = {}) {
    let rows;
    if (filter.truck_id) rows = await rowsWhere('job_cards', ['truck_id', '==', filter.truck_id]);
    else if (filter.status) rows = await rowsWhere('job_cards', ['status', '==', filter.status]);
    else if (filter.kind) rows = await rowsWhere('job_cards', ['kind', '==', filter.kind]);
    else if (filter.from) rows = await rowsWhere('job_cards', ['opened_on', '>=', filter.from], ['opened_on', '<=', filter.to || '9999-12-31']);
    else rows = await rowsWhere('job_cards');
    rows = live(rows).filter((j) => (!filter.status || j.status === filter.status) && (!filter.kind || j.kind === filter.kind)
      && (!filter.from || j.opened_on >= filter.from) && (!filter.to || j.opened_on <= filter.to));
    return { data: rows.sort((a, b) => b.opened_on.localeCompare(a.opened_on)), error: null };
  }
  async function getJobImpl(id) {
    const job = await need('job_cards', id, 'Job card not found.');
    const moves = live(await rowsWhere('stock_moves', ['job_id', '==', id])).sort((a, b) => a.move_date.localeCompare(b.move_date));
    const indents = live(await rowsWhere('indents', ['job_id', '==', id])).sort((a, b) => b.seq - a.seq);
    return { data: { job, moves, indents }, error: null };
  }
  async function saveJobImpl(values, id) {
    const f = cleanJob(values);
    const truck = await need('trucks', f.truck_id, 'Truck not found.');
    const batch = writeBatch(db);
    if (id) {
      const before = await need('job_cards', id, 'Job card not found.');
      if (before.truck_id !== f.truck_id) throw fail('The truck of a job card cannot be changed. Remove it and add a new one.');
      const patch = { ...f };
      delete patch.truck_id;
      batch.update(doc(db, 'job_cards', id), { ...patch, ...editStamps() });
      audit(batch, `job_cards/${id}`, 'UPDATE', before, { ...before, ...patch });
      const res = await commit(batch);
      return { data: { ...before, ...patch }, error: null, queued: res.queued };
    }
    const ref = doc(coll('job_cards'));
    const row = { ...f, truck_no: truck.truck_no, status: 'open', closed_on: null, labour_cost: 0 };
    batch.set(ref, { ...row, ...newStamps() });
    audit(batch, `job_cards/${ref.id}`, 'INSERT', null, row);
    const res = await commit(batch);
    return { data: { id: ref.id, ...row, deleted_at: null }, error: null, queued: res.queued };

  async function closeJobImpl(id, values) {

    const before = await need('job_cards', id, 'Job card not found.');
    if (before.status !== 'open') throw fail('This job is already finished.');
    if (v.closed_on < before.opened_on) throw fail('It cannot be finished before it came in.');
    const patch = { status: 'done', closed_on: v.closed_on, labour_cost: v.labour_cost, odometer_km: v.odometer_km ?? before.odometer_km ?? null };
    const batch = writeBatch(db);
    batch.update(doc(db, 'job_cards', id), { ...patch, ...editStamps() });
    audit(batch, `job_cards/${id}`, 'UPDATE', before, { ...before, ...patch });
    const res = await commit(batch);
    return { data: { ...before, ...patch }, error: null, queued: res.queued };
  }

  // ---------------------------------------------------------------- parts indents
  async function listIndentsImpl(filter = {}) {
    let rows;
    if (filter.truck_id) rows = await rowsWhere('indents', ['truck_id', '==', filter.truck_id]);
    else if (filter.status) rows = await rowsWhere('indents', ['status', '==', filter.status]);
