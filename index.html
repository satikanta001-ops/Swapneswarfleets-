      driver_name = dsnap.data().full_name;
    }
    // Optional link to a trip of the same truck. When editing, the existing link is kept unless a new value is given.
    let before = null;
    if (id) { const bs = await getDoc(doc(db, 'fuel_entries', id)); before = bs.exists() ? rowOf(bs) : null; }
    const trip_id = values.trip_id !== undefined ? (values.trip_id || null) : (before ? before.trip_id ?? null : null);
    if (trip_id) {
      const ts = await getDoc(doc(db, 'trips', trip_id));
      if (!ts.exists() || ts.data().deleted_at) throw fail('Trip not found.');
      if (ts.data().truck_id !== values.truck_id) throw fail('That trip belongs to another truck.');
    }
    const fields = {
      truck_id: values.truck_id, truck_no: truck.truck_no, trip_id, driver_id, driver_name,
      entry_date: values.entry_date, fuel_type: values.fuel_type, item: txt(values.item, 60),
      quantity, rate, amount: Math.round(quantity * rate * 100) / 100, odometer_km,
      source: values.source === 'outside' ? 'outside' : 'own_tank',
      vendor: txt(values.vendor, 80), slip_no: txt(values.slip_no, 30), remarks: txt(values.remarks, 500),
    };
    const batch = writeBatch(db);
    if (id) {
      const ref = doc(db, 'fuel_entries', id);
      const snap = await getDoc(ref);
      if (!snap.exists() || snap.data().deleted_at) throw fail('Entry not found.');
      if (before.truck_id !== fields.truck_id) throw fail('The truck of an entry cannot be changed. Remove it and add a new one.');
      batch.update(ref, { ...fields, ...editStamps() });
      audit(batch, `fuel_entries/${id}`, 'UPDATE', before, { ...before, ...fields });
      const res = await commit(batch);
      return { data: { ...before, ...fields }, error: null, queued: res.queued };
    }
    const ref = doc(coll('fuel_entries'));
    batch.set(ref, { ...fields, ...newStamps() });
    audit(batch, `fuel_entries/${ref.id}`, 'INSERT', null, fields);
    const res = await commit(batch);
    return { data: { id: ref.id, ...fields, deleted_at: null }, error: null, queued: res.queued };
  }

  async function removeFuelImpl(id) {
    const ref = doc(db, 'fuel_entries', id);
    const snap = await getDoc(ref);
    if (!snap.exists()) throw fail('Entry not found.');
    const batch = writeBatch(db);
    batch.update(ref, deleteStamps());
    audit(batch, `fuel_entries/${id}`, 'SOFT_DELETE', rowOf(snap), null);
    const res = await commit(batch);
    return { data: [{ id }], error: null, queued: res.queued };
  }

  // ---------------------------------------------------------------- tyres, tubes and flaps
  const tyreEvent = (t, event, date, extra = {}) => ({
    tyre_id: t.id, tyre_serial: t.serial_no, item_kind: t.kind, event, event_date: date,
    truck_id: null, truck_no: null, position: null, odometer_km: null, cost: null, vendor: null, note: null, ...extra,
  });
  const offTruck = { truck_id: null, truck_no: null, position: null, fitted_on: null, fit_km: null };

  async function listTyresImpl() {
    const rows = live(await rowsWhere('tyres'));
    return { data: rows.sort((a, b) => a.kind.localeCompare(b.kind) || a.serial_no.localeCompare(b.serial_no)), error: null };
  }
  async function getTyreImpl(id) {
    const snap = await getDoc(doc(db, 'tyres', id));
    if (!snap.exists() || snap.data().deleted_at) throw fail('Not found.');
    const events = live(await rowsWhere('tyre_events', ['tyre_id', '==', id]))
      .sort((a, b) => a.event_date.localeCompare(b.event_date) || String(a.created_at).localeCompare(String(b.created_at)));
    return { data: { tyre: rowOf(snap), events }, error: null };
  }
  async function listTyreEventsImpl(from, to) {
    const rows = live(await rowsWhere('tyre_events', ['event_date', '>=', from], ['event_date', '<=', to]));
    return { data: rows.sort((a, b) => b.event_date.localeCompare(a.event_date) || String(b.created_at).localeCompare(String(a.created_at))), error: null };
  }

  async function saveTyreImpl(values, id) {
    const fields = cleanTyre(values);
    const same = live(await rowsWhere('tyres', ['serial_no', '==', fields.serial_no])).find((t) => t.kind === fields.kind && t.id !== id);
    if (same) throw fail(`${fields.serial_no} is already recorded.`);
    const batch = writeBatch(db);
    if (id) {
      const ref = doc(db, 'tyres', id);
      const snap = await getDoc(ref);
      if (!snap.exists() || snap.data().deleted_at) throw fail('Not found.');
      const before = rowOf(snap);
      if (before.kind !== fields.kind) throw fail('Tyre, tube or flap cannot be changed. Remove it and add a new one.');
      batch.update(ref, { ...fields, ...editStamps() });
      audit(batch, `tyres/${id}`, 'UPDATE', before, { ...before, ...fields });
      const res = await commit(batch);
      return { data: { ...before, ...fields }, error: null, queued: res.queued };
    }
    const ref = doc(coll('tyres'));
    const row = { ...fields, ...newState() };
    batch.set(ref, { ...row, ...newStamps() });
    batch.set(doc(coll('tyre_events')), {
      ...tyreEvent({ id: ref.id, serial_no: fields.serial_no, kind: fields.kind }, 'BOUGHT', fields.purchase_date || todayIST(), { cost: fields.cost, vendor: fields.vendor }),
      ...newStamps(),
    });
    audit(batch, `tyres/${ref.id}`, 'INSERT', null, row);
    const res = await commit(batch);
    return { data: { id: ref.id, ...row, deleted_at: null }, error: null, queued: res.queued };
  }

  // One change to a tyre together with the history line that records it, in a single batch.
  async function tyreAction(id, build) {
    const ref = doc(db, 'tyres', id);
    const snap = await getDoc(ref);
    if (!snap.exists() || snap.data().deleted_at) throw fail('Not found.');
    const before = rowOf(snap);
    const { patch, event } = await build(before);
    const batch = writeBatch(db);
    batch.update(ref, { ...patch, ...editStamps() });
    batch.set(doc(coll('tyre_events')), { ...event, ...newStamps() });
    audit(batch, `tyres/${id}`, 'UPDATE', before, { ...before, ...patch });
    const res = await commit(batch);
    return { data: { ...before, ...patch }, error: null, queued: res.queued };
  }
  const here = (t) => (t.status === 'fitted' ? { truck_id: t.truck_id, truck_no: t.truck_no, position: t.position } : {});
  function checkOdometer(t, v) {
    if (v.odometer_km != null && t.fit_km != null && v.odometer_km < t.fit_km) throw fail('The odometer is lower than when it was fitted.');
    if (t.fitted_on && v.date < t.fitted_on) throw fail('The date is before it was fitted.');
  }

  async function fitTyreImpl(id, values) {
    const v = cleanFit(values);
    const tsnap = await getDoc(doc(db, 'trucks', v.truck_id));
    if (!tsnap.exists() || tsnap.data().deleted_at) throw fail('Truck not found.');
    const truck = rowOf(tsnap);
    return tyreAction(id, async (t) => {
      const p = problemWith(t, 'fit'); if (p) throw fail(p);
      if (t.purchase_date && v.date < t.purchase_date) throw fail('It cannot be fitted before it was bought.');
      const clash = live(await rowsWhere('tyres', ['truck_id', '==', v.truck_id]))
        .find((x) => x.id !== id && x.status === 'fitted' && x.kind === t.kind && x.position === v.position);
      if (clash) throw fail(`${clash.serial_no} is already at ${v.position} on ${truck.truck_no}. Remove it first.`);
      return {
        patch: { status: 'fitted', truck_id: truck.id, truck_no: truck.truck_no, position: v.position, fitted_on: v.date, fit_km: v.odometer_km },
        event: tyreEvent(t, 'FIT', v.date, { truck_id: truck.id, truck_no: truck.truck_no, position: v.position, odometer_km: v.odometer_km }),
      };
    });
  }

  async function unfitTyreImpl(id, values) {
    const v = cleanMove(values);
    return tyreAction(id, async (t) => {
      const p = problemWith(t, 'unfit'); if (p) throw fail(p);
      checkOdometer(t, v);
      return {
        patch: { status: 'in_stock', ...offTruck, km_run: (t.km_run || 0) + kmSinceFit(t, v.odometer_km) },
        event: tyreEvent(t, 'REMOVE', v.date, { ...here(t), odometer_km: v.odometer_km, note: v.note }),
      };
    });
  }

  async function punctureImpl(id, values) {
    const v = cleanRepair(values);
    return tyreAction(id, async (t) => {
      const p = problemWith(t, 'puncture'); if (p) throw fail(p);
      return {
        patch: { punctures: (t.punctures || 0) + 1, repair_cost: (t.repair_cost || 0) + v.cost },
        event: tyreEvent(t, 'PUNCTURE', v.date, { ...here(t), cost: v.cost, vendor: v.vendor, note: v.note }),
      };
    });
  }

  async function resoleImpl(id, values) {
    const v = cleanRepair(values);
    return tyreAction(id, async (t) => {
      const p = problemWith(t, 'resole'); if (p) throw fail(p);
      return {
        patch: { resole_count: (t.resole_count || 0) + 1, repair_cost: (t.repair_cost || 0) + v.cost },
        event: tyreEvent(t, 'RESOLE', v.date, { cost: v.cost, vendor: v.vendor, note: v.note }),
      };
    });
  }

  async function scrapTyreImpl(id, values) {
    const v = cleanScrap(values);
    return tyreAction(id, async (t) => {
      const p = problemWith(t, 'scrap'); if (p) throw fail(p);
      if (t.status === 'fitted') checkOdometer(t, v);
      return {
        patch: { status: 'scrapped', ...offTruck, km_run: (t.km_run || 0) + (t.status === 'fitted' ? kmSinceFit(t, v.odometer_km) : 0), scrapped_on: v.date, scrap_reason: v.reason },
        event: tyreEvent(t, 'SCRAP', v.date, { ...here(t), odometer_km: v.odometer_km, note: v.reason }),
      };
    });
  }

  // Only a tyre that was just entered and has no history can be removed.
  async function removeTyreImpl(id) {
    const ref = doc(db, 'tyres', id);
    const snap = await getDoc(ref);
    if (!snap.exists() || snap.data().deleted_at) throw fail('Not found.');
    const events = live(await rowsWhere('tyre_events', ['tyre_id', '==', id]));
    if (snap.data().status !== 'in_stock' || events.some((e) => e.event !== 'BOUGHT')) throw fail('It has history, so it cannot be removed. Scrap it instead.');
    const batch = writeBatch(db);
    batch.update(ref, deleteStamps());
    for (const e of events) batch.update(doc(db, 'tyre_events', e.id), deleteStamps());
    audit(batch, `tyres/${id}`, 'SOFT_DELETE', rowOf(snap), null);
    const res = await commit(batch);
    return { data: [{ id }], error: null, queued: res.queued };
  }

  // ---------------------------------------------------------------- trips, cash advances and expenses
  const EXPENSE_KINDS = ['Toll', 'Food', 'Repair', 'Police', 'Loading and unloading', 'Weighbridge', 'Other'];
  const numOrNull = (v, what) => {
    if (v === null || v === undefined || v === '') return null;
    const n = Number(v);
    if (!(n >= 0)) throw fail(`${what} is not valid.`);
    return n;
  };
  const isDate = (v) => /^\d{4}-\d{2}-\d{2}$/.test(v || '');

  // Trips that started in the range, plus every trip still running.
  async function listTripsImpl(from, to) {
    const inRange = live(await rowsWhere('trips', ['start_date', '>=', from], ['start_date', '<=', to]));
    const running = live(await rowsWhere('trips', ['status', '==', 'running']));
    const seen = new Set(inRange.map((t) => t.id));
    const rows = [...inRange, ...running.filter((t) => !seen.has(t.id))];
    return { data: rows.sort((a, b) => b.start_date.localeCompare(a.start_date)), error: null };
  }

  // Cash and diesel per trip: { tripId: { advance, expense, diesel_amount, diesel_litres } }
  async function tripTotalsImpl(ids) {
    const out = {};
    for (const id of ids) out[id] = { advance: 0, expense: 0, diesel_amount: 0, diesel_litres: 0 };
    for (let i = 0; i < ids.length; i += 10) {
      const chunk = ids.slice(i, i + 10);
      for (const e of live(await rowsWhere('trip_entries', ['trip_id', 'in', chunk]))) {
        out[e.trip_id][e.kind === 'ADVANCE' ? 'advance' : 'expense'] += e.amount;
      }
      for (const f of live(await rowsWhere('fuel_entries', ['trip_id', 'in', chunk]))) {
        if (f.fuel_type === 'DIESEL') { out[f.trip_id].diesel_amount += f.amount; out[f.trip_id].diesel_litres += f.quantity; }
      }
    }
    return { data: out, error: null };
  }

  async function getTripImpl(id) {
    const snap = await getDoc(doc(db, 'trips', id));
    if (!snap.exists() || snap.data().deleted_at) throw fail('Trip not found.');
    const entries = live(await rowsWhere('trip_entries', ['trip_id', '==', id])).sort((a, b) => a.entry_date.localeCompare(b.entry_date));
    const fuel = live(await rowsWhere('fuel_entries', ['trip_id', '==', id])).sort((a, b) => a.entry_date.localeCompare(b.entry_date));
    return { data: { trip: rowOf(snap), entries, fuel }, error: null };
  }

  async function saveTripImpl(values, id) {
    const to_place = txt(values.to_place, 60);
    if (!to_place) throw fail('Enter the destination.');
    if (!isDate(values.start_date)) throw fail('Choose the start date.');
    const end_date = values.end_date || null;
    if (end_date && (!isDate(end_date) || end_date < values.start_date)) throw fail('The end date cannot be before the start date.');
    const km = numOrNull(values.km, 'The distance');
    const load_tons = numOrNull(values.load_tons, 'The load');
    const freight = numOrNull(values.freight, 'The freight');

    const tsnap = await getDoc(doc(db, 'trucks', values.truck_id));
    if (!tsnap.exists() || tsnap.data().deleted_at) throw fail('Truck not found.');
    const truck = rowOf(tsnap);
    let before = null;
    if (id) {
      const bs = await getDoc(doc(db, 'trips', id));
      if (!bs.exists() || bs.data().deleted_at) throw fail('Trip not found.');
      before = rowOf(bs);
      if (before.truck_id !== values.truck_id) throw fail('The truck of a trip cannot be changed. Remove the trip and add it again.');
    } else if (truck.status === 'sold') throw fail('That truck is sold.');
    if (!end_date) {
      const others = live(await rowsWhere('trips', ['truck_id', '==', values.truck_id])).filter((t) => t.status === 'running' && t.id !== id);
      if (others.length) throw fail(`${truck.truck_no} already has a running trip to ${others[0].to_place}. Complete it first.`);
    }
    let driver_id = values.driver_id || (before ? before.driver_id : truck.driver_id) || null;
    let driver_name = null;
    if (driver_id && before && driver_id === before.driver_id) driver_name = before.driver_name;
    else if (driver_id && driver_id === truck.driver_id) driver_name = truck.driver_name || null;
    else if (driver_id) {
      const dsnap = await getDoc(doc(db, 'drivers', driver_id));
      if (!dsnap.exists() || dsnap.data().deleted_at) throw fail('Driver not found.');
      driver_name = dsnap.data().full_name;
    }
    const fields = {
      truck_id: values.truck_id, truck_no: truck.truck_no, driver_id, driver_name,
      from_place: txt(values.from_place, 60), to_place, start_date: values.start_date, end_date,
      km, load_tons, freight, status: end_date ? 'completed' : 'running',
      settled_on: end_date && before ? before.settled_on ?? null : null,
      notes: txt(values.notes, 500),
    };
    const batch = writeBatch(db);
    if (before) {
      batch.update(doc(db, 'trips', id), { ...fields, ...editStamps() });
      audit(batch, `trips/${id}`, 'UPDATE', before, { ...before, ...fields });
      const res = await commit(batch);
      return { data: { ...before, ...fields }, error: null, queued: res.queued };
    }
    const ref = doc(coll('trips'));
    batch.set(ref, { ...fields, ...newStamps() });
    audit(batch, `trips/${ref.id}`, 'INSERT', null, fields);
    const res = await commit(batch);
    return { data: { id: ref.id, ...fields, deleted_at: null }, error: null, queued: res.queued };
  }

  async function removeTripImpl(id) {
    const { data } = await getTripImpl(id);
    if (data.entries.length || data.fuel.length) throw fail('Remove its cash entries and unlink its diesel first.');
    const batch = writeBatch(db);
    batch.update(doc(db, 'trips', id), deleteStamps());
    audit(batch, `trips/${id}`, 'SOFT_DELETE', data.trip, null);
    const res = await commit(batch);
    return { data: [{ id }], error: null, queued: res.queued };
  }

  // Settle a completed trip (the cash is squared with the driver), or reopen the settlement.
  async function settleTripImpl(id, settle) {
    const ref = doc(db, 'trips', id);
    const snap = await getDoc(ref);
    if (!snap.exists() || snap.data().deleted_at) throw fail('Trip not found.');
    const before = rowOf(snap);
    if (settle && before.status !== 'completed') throw fail('Complete the trip before settling it.');
    const settled_on = settle ? todayIST() : null;
    const batch = writeBatch(db);
    batch.update(ref, { settled_on, ...editStamps() });
    audit(batch, `trips/${id}`, 'UPDATE', before, { ...before, settled_on });
    const res = await commit(batch);
    return { data: { ...before, settled_on }, error: null, queued: res.queued };
  }

  async function saveTripEntryImpl(values, id) {
    if (!['ADVANCE', 'EXPENSE'].includes(values.kind)) throw fail('Choose advance or expense.');
    const amount = Number(values.amount);
    if (!(amount > 0 && amount <= 10000000)) throw fail('Enter the amount in rupees.');
    if (!isDate(values.entry_date)) throw fail('Choose a date.');
    const tsnap = await getDoc(doc(db, 'trips', values.trip_id));
    if (!tsnap.exists() || tsnap.data().deleted_at) throw fail('Trip not found.');
    if (tsnap.data().settled_on) throw fail('This trip is settled. Reopen the settlement to change its cash.');
    const fields = {
      trip_id: values.trip_id, kind: values.kind, entry_date: values.entry_date, amount,
      category: values.kind === 'EXPENSE' ? txt(values.category, 30) : null, note: txt(values.note, 200),
    };
    const batch = writeBatch(db);
    if (id) {
      const ref = doc(db, 'trip_entries', id);
      const snap = await getDoc(ref);
      if (!snap.exists() || snap.data().deleted_at) throw fail('Entry not found.');
      const before = rowOf(snap);
      if (before.trip_id !== fields.trip_id || before.kind !== fields.kind) throw fail('The trip and type of an entry cannot be changed.');
      batch.update(ref, { ...fields, ...editStamps() });
      audit(batch, `trip_entries/${id}`, 'UPDATE', before, { ...before, ...fields });
      const res = await commit(batch);
      return { data: { ...before, ...fields }, error: null, queued: res.queued };
    }
    const ref = doc(coll('trip_entries'));
    batch.set(ref, { ...fields, ...newStamps() });
    audit(batch, `trip_entries/${ref.id}`, 'INSERT', null, fields);
    const res = await commit(batch);
    return { data: { id: ref.id, ...fields, deleted_at: null }, error: null, queued: res.queued };
  }

  async function removeTripEntryImpl(id) {
    const ref = doc(db, 'trip_entries', id);
    const snap = await getDoc(ref);
    if (!snap.exists()) throw fail('Entry not found.');
    const before = rowOf(snap);
    const ts = await getDoc(doc(db, 'trips', before.trip_id));
    if (ts.exists() && ts.data().settled_on) throw fail('This trip is settled. Reopen the settlement to change its cash.');
    const batch = writeBatch(db);
    batch.update(ref, deleteStamps());
    audit(batch, `trip_entries/${id}`, 'SOFT_DELETE', before, null);
    const res = await commit(batch);
    return { data: [{ id }], error: null, queued: res.queued };
  }

  // ---------------------------------------------------------------- vehicle documents
  const docsForTruck = async (truckId) => live(await rowsWhere('vehicle_documents', ['truck_id', '==', truckId]));

  async function saveDocumentImpl(values, id) {
    const fields = pick(values, DOC_FIELDS);
    if (fields.issued_on && fields.expires_on && fields.expires_on < fields.issued_on) {
      throw fail('violates check constraint "vehicle_documents_check"');
    }
    if (!DOC_TYPES.some((t) => t.code === fields.doc_type)) throw fail('Choose a document type.');
    const truckRef = doc(db, 'trucks', values.truck_id);
    const tsnap = await getDoc(truckRef);
    if (!tsnap.exists() || tsnap.data().deleted_at) throw fail('Truck not found.');
    const truck = rowOf(tsnap);

    const existing = await docsForTruck(values.truck_id);
    const ref = id ? doc(db, 'vehicle_documents', id) : doc(coll('vehicle_documents'));
    const before = id ? existing.find((r) => r.id === id) : null;
    if (id && !before) throw fail('Document entry not found.');

    // A scan or photo may come with the entry: values.file = { name, mime, bytes, data } (data is base64).
    // values.remove_file = true takes the file off the entry.
    const file = values.file || null;
    if (file) checkFile(file);
    const hadFile = !!(before && before.has_file);
    const hasFile = file ? true : (values.remove_file ? false : hadFile);
    const fileName = file ? String(file.name || 'document').slice(0, 120) : (hasFile ? before.file_name ?? null : null);
    fields.has_file = hasFile;
    fields.file_name = fileName;

    const others = existing.filter((r) => r.id !== ref.id && r.doc_type === fields.doc_type);
    const mine = { id: ref.id, ...fields, created_at: before ? before.created_at : null };
    const docs_latest = { ...(truck.docs_latest || {}) };
    const latest = latestEntry([...others, mine]);
    if (latest) docs_latest[fields.doc_type] = latest; else delete docs_latest[fields.doc_type];

    const batch = writeBatch(db);
    if (id) {
      batch.update(ref, { ...fields, ...editStamps() });
      audit(batch, `vehicle_documents/${ref.id}`, 'UPDATE', { ...before, truck_id: values.truck_id }, { ...fields, truck_id: values.truck_id });
    } else {
      batch.set(ref, { truck_id: values.truck_id, ...fields, ...newStamps() });
      audit(batch, `vehicle_documents/${ref.id}`, 'INSERT', null, { truck_id: values.truck_id, ...fields });
    }
    if (file || (values.remove_file && hadFile)) {
      const fref = doc(db, 'document_files', ref.id);
      const fsnap = await getDoc(fref);
      if (file) {
        const body = { document_id: ref.id, truck_id: values.truck_id, name: fileName, mime: file.mime, bytes: file.bytes, data: file.data };
        if (fsnap.exists()) batch.update(fref, { ...body, deleted_at: null, ...editStamps() });
        else batch.set(fref, { ...body, ...newStamps() });
      } else if (fsnap.exists()) {
        batch.update(fref, deleteStamps());
      }
    }
    batch.update(truckRef, { docs_latest, ...editStamps() });
    const res = await commit(batch);
    return { data: { id: ref.id, truck_id: values.truck_id, ...fields }, error: null, queued: res.queued };
  }

  async function removeDocumentImpl(id) {
    const ref = doc(db, 'vehicle_documents', id);
    const snap = await getDoc(ref);
    if (!snap.exists()) throw fail('Document entry not found.');
    const row = rowOf(snap);
    const truckRef = doc(db, 'trucks', row.truck_id);
    const truck = rowOf(await getDoc(truckRef));
    const rest = (await docsForTruck(row.truck_id)).filter((r) => r.id !== id && r.doc_type === row.doc_type);
    const docs_latest = { ...(truck.docs_latest || {}) };
    const latest = latestEntry(rest);
    if (latest) docs_latest[row.doc_type] = latest; else delete docs_latest[row.doc_type];

    const batch = writeBatch(db);
    batch.update(ref, deleteStamps());
    batch.update(truckRef, { docs_latest, ...editStamps() });
    audit(batch, `vehicle_documents/${id}`, 'SOFT_DELETE', row, null);
    const res = await commit(batch);
    return { data: [{ id }], error: null, queued: res.queued };
  }

  // ---------------------------------------------------------------- drivers
  async function allDrivers() {
    const rows = role() === 'driver'
      ? await rowsWhere('drivers', ['profile_id', '==', uid()])
      : await rowsWhere('drivers', ['deleted_at', '==', null]);
    return live(rows).sort((a, b) => a.full_name.localeCompare(b.full_name));
  }

  async function saveDriverImpl(values, id) {
    if (values.aadhaar_last4 && !/^[0-9]{4}$/.test(values.aadhaar_last4)) throw fail('violates check constraint "drivers_aadhaar_last4_check"');
    if (values.dl_no) {
      const same = live(await rowsWhere('drivers', ['dl_no', '==', values.dl_no])).filter((r) => r.id !== id);
      if (same.length) throw fail('duplicate key value violates unique constraint "drivers_dl_no_uq"');
    }
    const fields = pick(values, DRIVER_FIELDS);
    // Scans: values.files = { KIND: { name, mime, bytes, data } }, values.remove_files = [KIND, ...]
    const newFiles = values.files || {};
    const removeKinds = values.remove_files || [];
    const validKinds = DRIVER_FILE_KINDS.map((k) => k.code);
    for (const [kind, file] of Object.entries(newFiles)) {
      if (!validKinds.includes(kind)) throw fail('Unknown document slot.');
      checkFile(file);
    }
    if (removeKinds.some((k) => !validKinds.includes(k))) throw fail('Unknown document slot.');
    const touched = Object.keys(newFiles).length + removeKinds.length > 0;

    const batch = writeBatch(db);
    const ref = id ? doc(db, 'drivers', id) : doc(coll('drivers'));
    let before = null;
    if (id) {
      const snap = await getDoc(ref);
      if (!snap.exists()) throw fail('Driver not found.');
      before = rowOf(snap);
    }
    if (touched) {
      const files = { ...((before && before.files) || {}) };
      for (const [kind, file] of Object.entries(newFiles)) {
        const fref = doc(db, 'driver_files', `${ref.id}_${kind}`);
        const body = { driver_id: ref.id, kind, name: String(file.name || 'document').slice(0, 120), mime: file.mime, bytes: file.bytes, data: file.data };
        if ((await getDoc(fref)).exists()) batch.update(fref, { ...body, deleted_at: null, ...editStamps() });
        else batch.set(fref, { ...body, ...newStamps() });
        files[kind] = body.name;
      }
      for (const kind of removeKinds) {
        if (newFiles[kind]) continue;
        const fref = doc(db, 'driver_files', `${ref.id}_${kind}`);
        if ((await getDoc(fref)).exists()) batch.update(fref, deleteStamps());
        delete files[kind];
      }
      fields.files = files;
    }
    if (id) {
      batch.update(ref, { ...fields, ...editStamps() });
      audit(batch, `drivers/${id}`, 'UPDATE', before, { ...before, ...fields });
      // A renamed driver keeps showing correctly on his truck.
      if (fields.full_name && fields.full_name !== before.full_name) {
        for (const t of live(await rowsWhere('trucks', ['driver_id', '==', id]))) {
          batch.update(doc(db, 'trucks', t.id), { driver_name: fields.full_name, ...editStamps() });
        }
      }
      const res = await commit(batch);
      return { data: { ...before, ...fields }, error: null, queued: res.queued };
    }
    batch.set(ref, { profile_id: null, ...fields, ...newStamps() });
    audit(batch, `drivers/${ref.id}`, 'INSERT', null, fields);
    const res = await commit(batch);
    return { data: { id: ref.id, profile_id: null, ...fields }, error: null, queued: res.queued };
  }

  async function removeDriverImpl(id) {
    const ref = doc(db, 'drivers', id);
    const snap = await getDoc(ref);
    if (!snap.exists()) throw fail('Driver not found.');
    const batch = writeBatch(db);
    batch.update(ref, deleteStamps());
    audit(batch, `drivers/${id}`, 'SOFT_DELETE', rowOf(snap), null);
    const res = await commit(batch);
    return { data: [{ id }], error: null, queued: res.queued };
  }

  // ---------------------------------------------------------------- attendance
  async function attendanceOn(date) {
    const rows = role() === 'driver'
      ? await rowsWhere('driver_attendance', ['profile_id', '==', uid()], ['att_date', '==', date])
      : await rowsWhere('driver_attendance', ['att_date', '==', date]);
    return live(rows);
  }

  // Adds the operations for one attendance row to a batch.
  async function stageAttendance(batch, row) {
    const id = attId(row.driver_id, row.att_date);
    const ref = doc(db, 'driver_attendance', id);
    const snap = await getDoc(ref);
    const fields = { status: row.status, truck_id: row.truck_id ?? null, remarks: row.remarks ?? null };
    if (snap.exists()) {
      const before = rowOf(snap);
      const extra = row.profile_id !== undefined ? { profile_id: row.profile_id } : {};
      batch.update(ref, { ...fields, ...extra, deleted_at: null, ...editStamps() });
      audit(batch, `driver_attendance/${id}`, 'UPDATE', before, { ...before, ...fields, ...extra });
    } else {
      const data = { driver_id: row.driver_id, profile_id: row.profile_id ?? null, att_date: row.att_date, att_day: dayNumber(row.att_date), ...fields };
      batch.set(ref, { ...data, ...newStamps() });
      audit(batch, `driver_attendance/${id}`, 'INSERT', null, data);
    }
    return { id, driver_id: row.driver_id, att_date: row.att_date, status: row.status };
  }

  // ---------------------------------------------------------------- people (owner screen)
  async function createUserImpl({ full_name, login, password, role: newRole, phone, driver_id }) {
    if (role() !== 'admin') throw fail('Only the admin can add people.');
    if (!full_name || !login || !password) throw fail('Enter a name, a login and a password.');
    if (String(password).length < 8) throw fail('The password needs at least 8 characters.');
    const email = loginEmail(login);
    // A second app instance creates the login so the owner stays signed in.
    const second = initializeApp(cfg.firebase, 'second-' + Date.now());
    let newUid;
    try {
      const secondAuth = getAuth(second);
      const cred = await createUserWithEmailAndPassword(secondAuth, email, password);
      newUid = cred.user.uid;
      await fbSignOut(secondAuth);
    } finally {
      await deleteApp(second);
    }
    try {
      const batch = writeBatch(db);
      const profile = { full_name, email, phone: phone || null, role: newRole, active: true };
      batch.set(doc(db, 'profiles', newUid), { ...profile, ...newStamps() });
      audit(batch, `profiles/${newUid}`, 'INSERT', null, profile);
      if (driver_id) {
        batch.update(doc(db, 'drivers', driver_id), { profile_id: newUid, ...editStamps() });
        audit(batch, `drivers/${driver_id}`, 'UPDATE', null, { profile_id: newUid });
      }
      await batch.commit();
    } catch (e) {
      throw fail('The login was created but the profile was not saved (' + (e.message || e.code) + '). '
        + 'Delete this login in the Firebase console under Authentication, then add the person again.');
    }
    return { data: { id: newUid, ...{ full_name, email, role: newRole, active: true } }, error: null };
  }

  // ---------------------------------------------------------------- one-time admin setup
  // Writes the admin's profile and the marker record in one batch. The rules allow this only
  // for admin@user.fleet.local and only while the marker does not exist yet.
  async function claimAdminIfNeeded() {
    const id = auth.currentUser.uid;
    const existing = await getDoc(doc(db, 'profiles', id));
    if (existing.exists()) return true;
    try {
      const batch = writeBatch(db);
      batch.set(doc(db, 'profiles', id), { full_name: 'Admin', email: ADMIN_EMAIL, phone: null, role: 'admin', active: true, ...newStamps() });
      batch.set(doc(db, 'system', 'admin_setup'), { uid: id, at: serverTimestamp() });
      await batch.commit();
      return true;
    } catch (e) {
      return false;
    }
  }

  async function firstTimeAdmin(email, password) {
    try {
      await createUserWithEmailAndPassword(auth, email, password);
    } catch (e) {
      return null;                       // already exists with another password: normal wrong-password message
    }
    if (await claimAdminIfNeeded()) return { error: null, defaultPassword: true, firstTime: true };
    try { await auth.currentUser.delete(); } catch (e) { /* best effort */ }
    await fbSignOut(auth);
    return { error: { message: 'The admin account was already set up. Ask the admin for the password.' } };
  }

  // ---------------------------------------------------------------- the API
  return {
    onBackgroundError(cb) { errorListeners.push(cb); },
    onQueued(cb) { queuedListeners.push(cb); },

    // --- session ---
    async getSession() { await authReady; return auth.currentUser ? { user: auth.currentUser } : null; },
    onAuthChange(cb) { authListeners.push(cb); },
    async signIn(login, password) {
      const email = loginEmail(login);
      const bad = ['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-email'];
      try {
        await signInWithEmailAndPassword(auth, email, password);
        if (email === ADMIN_EMAIL) await claimAdminIfNeeded();
        return { error: null, defaultPassword: email === ADMIN_EMAIL && password === DEFAULT_ADMIN_PASSWORD };
      } catch (e) {
        // First ever use: the admin login does not exist yet, so create it once.
        if (email === ADMIN_EMAIL && password === DEFAULT_ADMIN_PASSWORD && bad.includes(e.code)) {
          const r = await firstTimeAdmin(email, password);
          if (r) return r;
        }
        if (bad.includes(e.code)) return { error: { message: 'Invalid login credentials' } };
        if (e.code === 'auth/too-many-requests') return { error: { message: 'Too many attempts. Wait a few minutes and try again.' } };
        return { error: e };
      }
    },
    async signOut() { me = null; await fbSignOut(auth); },
    async getProfile() {

    truckHistory: guard(truckHistoryImpl),

    driverTrucksOn: guard(driverTrucksOnImpl),
    listFuel: guard(listFuelImpl),

    docStatus: guard(async ({ truckId } = {}) => {

    }),
    listDocumentTypes: async () => ({ data: DOC_TYPES, error: null }),
    listDocuments: guard(async (truckId) => {

    removeDocument: guard(removeDocumentImpl),
    // The scan or photo of one document entry: { name, mime, bytes, data (base64) }.
    getDocumentFile: guard(async (documentId) => {

      if (!snap.exists() || snap.data().deleted_at) throw fail('No file is attached to this entry.');
      const d = snap.data();

    removeDriver: guard(removeDriverImpl),
    // One scan of a driver: { name, mime, bytes, data (base64) }.
    getDriverFile: guard(async (driverId, kind) => {
      const snap = await getDoc(doc(db, 'driver_files', `${driverId}_${kind}`));
      if (!snap.exists() || snap.data().deleted_at) throw fail('No file is attached here.');

      return { data: { name: d.name, mime: d.mime, bytes: d.bytes, data: d.data }, error: null };
    }),

    // --- attendance ---
    attendanceFor: guard(async (date) => ({ data: await attendanceOn(date), error: null })),
    setAttendance: guard(async (row) => {
      const batch = writeBatch(db);
      const data = await stageAttendance(batch, row);
      const res = await commit(batch);
      return { data, error: null, queued: res.queued };
    }),
    setAttendanceBulk: guard(async (rows) => {
      let noWait = false;
      for (let i = 0; i < rows.length; i += CHUNK) {
        const batch = writeBatch(db);
        for (const row of rows.slice(i, i + CHUNK)) await stageAttendance(batch, row);
        const res = await commit(batch, { noWait });
        if (res.queued) noWait = true;
      }
      return { data: rows, error: null, queued: noWait };
    }),
    attendanceRange: guard(async (from, to) => {
      let rows;
      if (role() === 'driver') {
        rows = (await rowsWhere('driver_attendance', ['profile_id', '==', uid()])).filter((r) => r.att_date >= from && r.att_date <= to);

    nextDocNo: guard(async (prefix) => {
      if (!/^[A-Z]{2,6}$/.test(prefix)) throw fail('Invalid document prefix: ' + prefix);
      const fy = finYear(todayIST());
      const ref = doc(db, 'doc_counters', `${prefix}_${fy}`);
      const no = await runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        const next = snap.exists() ? snap.data().last_no + 1 : 1;
        const stamp = { updated_at: serverTimestamp(), updated_by: uid() };
        if (snap.exists()) tx.update(ref, { last_no: next, ...stamp });
        else tx.set(ref, { last_no: next, ...stamp });
        return next;
      });
      return { data: `${prefix}/${fy}/${String(no).padStart(5, '0')}`, error: null };

    // --- people (owner) ---
    listUsers: guard(async () => {
      const rows = live(await rowsWhere('profiles'));

    }),
    createUser: guard(createUserImpl),
    updateUser: guard(async (id, values) => {
      const ref = doc(db, 'profiles', id);
      const snap = await getDoc(ref);
      if (!snap.exists()) throw fail('Person not found.');
      const before = rowOf(snap);
      const fields = { full_name: values.full_name ?? before.full_name, phone: values.phone ?? before.phone ?? null, role: values.role ?? before.role, active: values.active ?? before.active };
      const batch = writeBatch(db);
      batch.update(ref, { ...fields, ...editStamps() });
      audit(batch, `profiles/${id}`, 'UPDATE', before, { ...before, ...fields });
      await batch.commit();
      return { data: { ...before, ...fields }, error: null };
    }),
    changePassword: guard(async (newPassword) => {
      if (!auth.currentUser) throw fail('You are signed out. Sign in again.', 'app/signed-out');

      try {
        await updatePassword(auth.currentUser, newPassword);
      } catch (e) {
        if (e.code === 'auth/requires-recent-login') throw fail('For safety, sign out, sign in again, then change the password straight away.');
        throw e;
      }
      return { data: true, error: null };
    }),
    resetPassword: guard(async (login) => {
      await sendPasswordResetEmail(auth, loginEmail(login));
      return { data: true, error: null };
    }),

    // --- Security check (owner): tries things that must be refused and reports what happened ---
    async selfTest() {
      const results = [];
      const stamps = () => ({ created_at: serverTimestamp(), created_by: uid(), updated_at: serverTimestamp(), updated_by: uid(), deleted_at: null });
      const goodTruck = { truck_no: 'ZZ99ZZ9999', make_model: null, vehicle_class: 'domestic', capacity_tons: null, ownership: 'owned', status: 'active', notes: null, docs_latest: {} };

      async function mustBeRefused(name, run) {
        try {
          await Promise.race([run(), wait(8000).then(() => { throw Object.assign(new Error('timeout'), { code: 'timeout' }); })]);
          results.push({ name, ok: false, detail: 'It was allowed. The rules are too open. Tell the developer.' });
        } catch (e) {
          if (e.code === 'permission-denied') results.push({ name, ok: true, detail: 'Refused, as it should be.' });
          else results.push({ name, ok: null, detail: 'Could not check (' + (e.code || e.message) + '). Check the internet and try again.' });
        }
      }

      await mustBeRefused('Deleting a truck is refused', () => deleteDoc(doc(db, 'trucks', 'security-check')));
      await mustBeRefused('Changing the audit log is refused', () => updateDoc(doc(db, 'audit_log', 'security-check'), { by: 'x' }));
      await mustBeRefused('Deleting from the audit log is refused', () => deleteDoc(doc(db, 'audit_log', 'security-check')));
      await mustBeRefused('A fake audit entry in someone else\'s name is refused', () =>
        setDoc(doc(db, 'audit_log', 'security-check-fake'), { at: serverTimestamp(), by: 'someone-else', by_name: 'x', path: 'x', action: 'UPDATE', before: null, after: null }));
      await mustBeRefused('A truck saved with someone else\'s name on it is refused', () =>
        setDoc(doc(db, 'trucks', 'security-check-forged'), { ...goodTruck, ...stamps(), created_by: 'someone-else' }));
      await mustBeRefused('A truck with a bad registration number is refused', () =>
        setDoc(doc(db, 'trucks', 'security-check-bad'), { ...goodTruck, truck_no: 'x', ...stamps() }));
      await mustBeRefused('A collection the app does not use is closed', () => setDoc(doc(db, 'anything_else', 'x'), { a: 1 }));

      try {
        const lock = await getDoc(doc(db, 'period_locks', 'current'));
        const day = lock.exists() ? lock.data().locked_day : 0;
        if (day > 0) {
          const iso = String(day).replace(/^(\d{4})(\d{2})(\d{2})$/, '$1-$2-$3');
          await mustBeRefused('Attendance inside the locked period is refused', () =>
            setDoc(doc(db, 'driver_attendance', attId('security-check', iso)), {
              driver_id: 'security-check', profile_id: null, att_date: iso, att_day: day, status: 'present', truck_id: null, remarks: null, ...stamps(),
            }));
        } else {
          results.push({ name: 'Attendance inside the locked period is refused', ok: null, detail: 'No period is locked yet, so there is nothing to check.' });
        }
      } catch (e) {
        results.push({ name: 'Attendance inside the locked period is refused', ok: null, detail: 'Could not check (' + (e.code || e.message) + ').' });
      }
      return results;
    },
  };
}

function finYear(iso) {
  const y = Number(iso.slice(0, 4));
  const m = Number(iso.slice(5, 7));
  const start = m >= 4 ? y : y - 1;
  return `${start}-${String((start + 1) % 100).padStart(2, '0')}`;
}

// Turns database errors into sentences a workshop supervisor can act on.
function friendlyError(err) {
  const code = err && err.code;
  if (code === 'permission-denied') return 'You do not have permission to do this.';
  if (code === 'unavailable' || code === 'auth/network-request-failed') return 'No connection. Check your internet and try again.';
  if (code === 'auth/email-already-in-use') return 'This email or phone number already has a login.';
  if (code === 'auth/invalid-email') return 'Enter a valid email address, or a phone number with at least 8 digits.';
  if (code === 'auth/weak-password') return 'The password is too weak. Use at least 8 characters.';
  const m = (err && err.message) || String(err || '');
  if (/Period closed/i.test(m)) return m.replace(/^.*?(Period closed)/i, '$1');
  if (/duplicate key|unique/i.test(m)) {
    if (/trucks_truck_no/i.test(m)) return 'A truck with this registration number already exists.';
    if (/drivers_dl_no/i.test(m)) return 'A driver with this licence number already exists.';
    if (/driver_attendance/i.test(m)) return 'Attendance for this driver and date is already recorded.';
    return 'This entry already exists.';
  }
  if (/row-level security|permission denied/i.test(m)) return 'You do not have permission to do this.';
  if (/check constraint/i.test(m)) {
    if (/truck_no/i.test(m)) return 'Registration number must be 6 to 12 letters and digits, for example OD05AB1234.';
    if (/aadhaar/i.test(m)) return 'Enter only the last 4 digits of the Aadhaar number.';
    if (/expires_on|issued_on/i.test(m)) return 'The expiry date cannot be before the issue date.';
    return 'One of the values is not allowed. Check the form and try again.';
  }
  if (/Failed to fetch|NetworkError|network/i.test(m)) return 'No connection. Check your internet and try again.';
  return m || 'Something went wrong. Try again.';
}

  { value: 'present', label: 'Present' }, { value: 'absent', label: 'Absent' },
  { value: 'leave', label: 'Leave' }, { value: 'half_day', label: 'Half day' },
];

async function attendanceView(ctx) {
  const today = todayIST();
  let date = today;

  const dateInput = h('input', { type: 'date', max: today, value: date, 'aria-label': 'Date' });
  const summary = h('p', { class: 'sub', 'aria-live': 'polite' });
  const list = h('ul', { class: 'list' });
  const markAll = h('button', { class: 'btn' }, 'Mark unmarked as present');
  const prev = h('button', { class: 'btn', 'aria-label': 'Previous day' }, 'Previous');
  const next = h('button', { class: 'btn', 'aria-label': 'Next day' }, 'Next');

  const dres = await ctx.api.listDrivers();
  if (dres.error) throw dres.error;
  const drivers = dres.data.filter((d) => d.status !== 'left');
  let marks = new Map();   // driver_id -> status
  let trucks = {};         // driver_id -> { truck_id, truck_no } on the chosen date

  async function load() {
    list.replaceChildren(h('li', { class: 'spinner' }, 'Loading…'));
    const [res, tr] = await Promise.all([ctx.api.attendanceFor(date), ctx.api.driverTrucksOn(date)]);
    trucks = tr.error ? {} : tr.data;
    if (res.error) { list.replaceChildren(h('li', { class: 'form-error' }, friendlyError(res.error))); return; }
    marks = new Map(res.data.map((a) => [a.driver_id, a.status]));
    draw();
  }

  function draw() {
    const counts = { present: 0, absent: 0, leave: 0, half_day: 0 };
    for (const d of drivers) { const s = marks.get(d.id); if (s) counts[s] += 1; }
    const unmarked = drivers.length - [...drivers].filter((d) => marks.has(d.id)).length;
    summary.textContent = `${fmtDay(date)}: ${counts.present} present, ${counts.half_day} half day, ${counts.leave} on leave, ${counts.absent} absent, ${unmarked} not marked.`;
    markAll.hidden = !ctx.canWrite || unmarked === 0;
    next.disabled = date >= today;

    if (!drivers.length) { list.replaceChildren(h('li', null, emptyState('No drivers yet', 'Add drivers first, then mark their attendance here.'))); return; }

    list.replaceChildren(...drivers.map((d) => {
      const current = marks.get(d.id);
      const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Attendance for ' + d.full_name },
        OPTIONS.map((o) => h('button', {
          type: 'button', 'data-status': o.value, 'aria-pressed': String(current === o.value), disabled: !ctx.canWrite,
          onclick: () => mark(d, o.value),
        }, o.label)));
      return h('li', { class: 'row att-row' },
        h('div', { class: 'grow' }, h('div', { class: 'title' }, d.full_name),
          trucks[d.id] ? h('div', { class: 'att-truck' }, plate(trucks[d.id].truck_no)) : h('div', { class: 'detail' }, 'No truck assigned'),
          d.status === 'on_leave' ? h('div', { class: 'detail' }, 'Marked on leave in the driver list') : null),
        seg);
    }));
  }

  async function mark(d, status) {
    const before = marks.get(d.id);
    if (before === status) return;
    marks.set(d.id, status);
    draw();
    const res = await ctx.api.setAttendance({ driver_id: d.id, profile_id: d.profile_id ?? null, att_date: date, status, truck_id: trucks[d.id] ? trucks[d.id].truck_id : null });
    if (res.error) {
      if (before) marks.set(d.id, before); else marks.delete(d.id);
      draw();
      toast(friendlyError(res.error), 'bad');
    }
  }

  markAll.addEventListener('click', async () => {
    const rows = drivers.filter((d) => !marks.has(d.id)).map((d) => ({ driver_id: d.id, profile_id: d.profile_id ?? null, att_date: date, status: 'present', truck_id: trucks[d.id] ? trucks[d.id].truck_id : null }));
    markAll.disabled = true;
    const res = await ctx.api.setAttendanceBulk(rows);
    markAll.disabled = false;
    if (res.error) { toast(friendlyError(res.error), 'bad'); return; }
    for (const r of rows) marks.set(r.driver_id, 'present');
    draw();
    toast(plural(rows.length, 'driver') + ' marked present');
  });

  function setDate(v) {
    if (!v || v > today) return;
    date = v;
    dateInput.value = v;
    load();
  }
  dateInput.addEventListener('change', () => setDate(dateInput.value));
  prev.addEventListener('click', () => setDate(addDays(date, -1)));
  next.addEventListener('click', () => setDate(addDays(date, 1)));

  await load();
  return h('div', { class: 'stack' },
    h('div', { class: 'page-head' }, h('div', null, h('h1', null, 'Attendance'), summary)),
    h('div', { class: 'toolbar datebar' }, prev, dateInput, next),
    markAll,
    list);
}

return { attendanceView };
})();

  const office = ['admin', 'owner', 'manager', 'accountant'].includes(ctx.profile.role);

  const expired = status.filter((r) => r.status === 'expired').sort((a, b) => a.days_left - b.days_left);
  const soon = status.filter((r) => r.status === 'due_soon').sort((a, b) => a.days_left - b.days_left);
  const missing = status.filter((r) => r.status === 'missing').sort((a, b) => a.truck_no.localeCompare(b.truck_no));

  const today = todayIST();
  const licences = drivers
    .filter((d) => d.dl_expiry && d.status !== 'left' && daysBetween(today, d.dl_expiry) <= 30)
    .map((d) => ({ ...d, days_left: daysBetween(today, d.dl_expiry) }))
    .sort((a, b) => a.days_left - b.days_left);

  const nothing = !expired.length && !soon.length && !missing.length && !licences.length;

  const byStatus = {};
  for (const t of trucks) byStatus[t.status] = (byStatus[t.status] || 0) + 1;
  const label = { active: 'active', idle: 'idle', under_repair: 'under repair', sold: 'sold' };

  const parts = [];

  if (missing.length) parts.push(`${missing.length} not recorded`);

  if (!trucks.length) {
    return h('div', { class: 'stack' },
      h('div', { class: 'page-head' }, h('h1', null, 'Welcome')),

        ctx.canWrite ? h('a', { class: 'btn primary', href: '#/trucks' }, 'Go to trucks') : null));
  }

  return h('div', { class: 'stack' },
    h('div', { class: 'page-head' },
      h('div', null,
        h('h1', null, nothing ? 'All documents are up to date' : 'Documents that need action'),
        h('p', { class: 'sub' }, [parts.length ? parts.join(', ') + '. ' : '', fleetLine].join('')))),
    group('Expired', expired, docRow),

    group('Driving licences', licences, (d) => h('li', null,
      h('a', { class: 'row', href: '#/drivers' },
        h('div', { class: 'grow' }, h('div', { class: 'title' }, d.full_name), h('div', { class: 'detail' }, 'Licence ' + (d.dl_no || '') + ', ' + fmtDate(d.dl_expiry))),
        d.days_left < 0
          ? h('span', { class: 'chip bad' }, `Expired ${plural(-d.days_left, 'day')} ago`)
          : h('span', { class: 'chip warn' }, d.days_left === 0 ? 'Expires today' : `Expires in ${plural(d.days_left, 'day')}`)))),
    group('Not recorded', missing, docRow));
}

const __m_files = (() => {
// Scans and photos of documents: make them small enough to keep, and show them again.
// Photos are shrunk in the browser (longest side 1600 px, JPEG). PDFs are kept as they are, up to a small size.
const { h } = __m_ui;
const MAX_RAW_BYTES = 600000;           // keeps the stored text under the 1 MB record limit

function toBase64(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
    fr.onerror = () => reject(new Error('The file could not be read.'));
    fr.readAsDataURL(blob);
  });
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This photo type cannot be read. Take the photo again as a normal picture (JPEG), or choose another file.')); };
    img.src = url;
  });
}

const canvasBlob = (canvas, quality) => new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', quality));

// Returns { name, mime, bytes, data } ready to be saved, or throws an Error with a plain message.
async function prepareFile(file) {
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  const baseName = (file.name || 'document').replace(/\.[^.]+$/, '').slice(0, 100) || 'document';
  if (isPdf) {
    if (file.size > MAX_RAW_BYTES) {
      throw new Error(`This PDF is ${Math.round(file.size / 1024)} KB. The limit is ${Math.round(MAX_RAW_BYTES / 1024)} KB. Take a photo of the document instead, or make the PDF smaller.`);
    }
    return { name: baseName + '.pdf', mime: 'application/pdf', bytes: file.size, data: await toBase64(file) };
  }
  if (!/^image\//.test(file.type)) throw new Error('Choose a photo or a PDF.');
  const img = await loadImage(file);
  let scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  for (let attempt = 0; attempt < 8; attempt += 1) {
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';                         // transparent areas become white, not black
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const blob = await canvasBlob(canvas, attempt < 3 ? 0.78 : 0.6);
    if (blob && blob.size <= MAX_RAW_BYTES) {
      return { name: baseName + '.jpg', mime: 'image/jpeg', bytes: blob.size, data: await toBase64(blob) };
    }
    scale *= 0.8;
  }
  throw new Error('This photo is too large to keep, even after shrinking. Try a clearer, closer photo of one page.');
}

// Shows a stored scan or photo in a window.
// fetcher is a function that returns the api result for that file: () => api.getDocumentFile(id)
async function viewStoredFile(fetcher, title) {
  const res = await fetcher();
  if (res.error) throw res.error;
  const f = res.data;
  const bytes = Uint8Array.from(atob(f.data), (c) => c.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes], { type: f.mime }));
  const dlg = h('dialog', { 'aria-labelledby': 'dlg-title', class: 'file-view' });
  const close = () => dlg.close();
  dlg.append(h('div', { class: 'file-box' },
    h('h2', { id: 'dlg-title' }, title || f.name),
    f.mime === 'application/pdf'
      ? h('p', { class: 'muted' }, 'This is a PDF. Open it to read it.')
      : h('img', { class: 'file-img', src: url, alt: title || f.name }),
    h('div', { class: 'actions' },
      h('a', { class: 'btn', href: url, target: '_blank', rel: 'noopener' }, f.mime === 'application/pdf' ? 'Open PDF' : 'Open full size'),
      h('a', { class: 'btn', href: url, download: f.name }, 'Download'),
      h('button', { type: 'button', class: 'btn primary', onclick: close }, 'Close'))));
  dlg.addEventListener('close', () => { dlg.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); });
  document.body.append(dlg);
  dlg.showModal();
}

return { MAX_RAW_BYTES, prepareFile, viewStoredFile };
})();

];
const TYPE_LABEL = Object.fromEntries(TYPES.map((t) => [t.value, t.label]));
const SOURCES = [{ value: 'own_tank', label: 'Own tank' }, { value: 'outside', label: 'Outside pump or shop' }];
const WRITERS = ['admin', 'owner', 'manager', 'store_keeper'];

const num = (n, d = 1) => Number(n).toLocaleString('en-IN', { maximumFractionDigits: d });
const inr = (n) => '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 0 });

function check(res) { if (res.error) throw res.error; return res.data; }

// Mileage of each diesel fill: kilometres since the truck's previous fill with a reading, divided by the litres of this fill
// (works when the tank is filled up each time). Only fills in the loaded month are used.
function mileageOf(entries) {
  const out = new Map();
  const byTruck = new Map();
  for (const e of entries) {
    if (e.fuel_type !== 'DIESEL' || e.odometer_km == null) continue;
    if (!byTruck.has(e.truck_id)) byTruck.set(e.truck_id, []);
    byTruck.get(e.truck_id).push(e);
  }
  for (const rows of byTruck.values()) {
    rows.sort((a, b) => a.entry_date.localeCompare(b.entry_date) || a.odometer_km - b.odometer_km);
    for (let i = 1; i < rows.length; i++) {
      const km = rows[i].odometer_km - rows[i - 1].odometer_km;
      if (km > 0 && rows[i].quantity > 0) out.set(rows[i].id, { km, kmpl: km / rows[i].quantity });
    }
  }
  return out;
}

    TYPES.map((t) => h('option', { value: t.value }, t.label)));

    entries = res.data;

    next.disabled = month >= today.slice(0, 7);
    draw();

  function draw() {

      g.amount += e.amount;

    const q = search.value.trim().toUpperCase().replace(/\s+/g, '');

      if (st === 'unsettled' && !(t.status === 'completed' && !t.settled_on)) return false;
      if (st === 'settled' && !t.settled_on) return false;
      if (!q) return true;
      return (t.truck_no + (t.to_place || '') + (t.from_place || '')).toUpperCase().replace(/\s+/g, '').includes(q);

    list.replaceChildren(...shown.map((t) => {

  async function add() {

    });

  const setMonth = (v) => { if (!v || v > today.slice(0, 7)) return; month = v; monthInput.value = v; load(); };

  prev.addEventListener('click', () => setMonth(shiftMonth(month, -1)));

// ------------------------------------------------------------------ one trip
async function tripDetailView(ctx, id) {
  const data = check(await ctx.api.getTrip(id));
  const { trip, entries, fuel } = data;
  const advances = entries.filter((e) => e.kind === 'ADVANCE');
  const expenses = entries.filter((e) => e.kind === 'EXPENSE');
  const x = {
    advance: advances.reduce((a, e) => a + e.amount, 0),
    expense: expenses.reduce((a, e) => a + e.amount, 0),
    diesel_amount: fuel.filter((f) => f.fuel_type === 'DIESEL').reduce((a, f) => a + f.amount, 0),
    diesel_litres: fuel.filter((f) => f.fuel_type === 'DIESEL').reduce((a, f) => a + f.quantity, 0),
  };
  const balance = cashBalance(x);
  const locked = !!trip.settled_on;
  const canWrite = ctx.canWrite;
  const today = todayIST();

  const trucks = check(await ctx.api.listTrucks());
  const drivers = check(await ctx.api.listDrivers()).filter((d) => d.status === 'active');

  async function edit(complete) {
    const values = { ...trip };
    if (complete) values.end_date = today;
    const saved = await openForm({
      title: complete ? 'Complete trip' : 'Edit trip', fields: tripFields(ctx, trucks, drivers, trip), values, submitLabel: complete ? 'Complete trip' : 'Save trip',
      extra: complete ? null : { label: 'Remove trip', onClick: async () => {
        const yes = await confirmDialog({ title: 'Remove this trip?', message: 'Use this only for a wrong trip. It stays in the audit record.', confirmLabel: 'Remove trip' });
        if (!yes) return { error: 'Not removed.' };
        const r = await ctx.api.removeTrip(id);
        if (r.error) return { error: friendlyError(r.error) };
      } },
      onSubmit: async (v) => { const r = await ctx.api.saveTrip(v, id); if (r.error) return { error: friendlyError(r.error) }; },
    });
    if (saved === 'extra') { toast('Trip removed'); ctx.nav('/trips'); } else if (saved) { toast('Trip saved'); ctx.rerender(); }
  }

  async function entryForm(kind, existing) {
    const isExp = kind === 'EXPENSE';
    const saved = await openForm({
      title: (existing ? 'Edit ' : 'Add ') + (isExp ? 'expense' : 'cash advance'), submitLabel: 'Save',
      fields: [
        { name: 'entry_date', label: 'Date', type: 'date', required: true },
        { name: 'amount', label: 'Amount (₹)', type: 'number', step: '1', min: '1', inputmode: 'numeric', required: true },
        ...(isExp ? [{ name: 'category', label: 'What for', type: 'select', required: true, options: EXPENSE_KINDS.map((k) => ({ value: k, label: k })) }] : []),
        { name: 'note', label: 'Note', maxlength: 200 },
      ],
      values: existing || { entry_date: today, category: 'Toll' },
      extra: existing ? { label: 'Remove', onClick: async () => {
        const r = await ctx.api.removeTripEntry(existing.id);
        if (r.error) return { error: friendlyError(r.error) };
      } } : null,
      onSubmit: async (v) => { const r = await ctx.api.saveTripEntry({ ...v, trip_id: id, kind }, existing && existing.id); if (r.error) return { error: friendlyError(r.error) }; },
    });
    if (saved) { toast(saved === 'extra' ? 'Removed' : 'Saved'); ctx.rerender(); }
  }

  async function addDiesel() {
    const saved = await openForm({
      title: 'Add diesel for this trip', submitLabel: 'Save diesel',
      fields: [
        { name: 'entry_date', label: 'Date', type: 'date', required: true },
        { name: 'quantity', label: 'Litres', type: 'number', step: '0.1', min: '0.1', inputmode: 'decimal', required: true },
        { name: 'rate', label: 'Rate per litre (₹)', type: 'number', step: '0.01', min: '0', inputmode: 'decimal', required: true },
        { name: 'odometer_km', label: 'Odometer (km)', type: 'number', step: '1', min: '0', inputmode: 'numeric' },
        { name: 'source', label: 'Where from', type: 'select', required: true, options: [{ value: 'own_tank', label: 'Own tank' }, { value: 'outside', label: 'Outside pump' }] },
        { name: 'vendor', label: 'Pump name', maxlength: 80 },
      ],
      values: { entry_date: trip.start_date > today ? trip.start_date : today, source: 'own_tank' },
      onSubmit: async (v) => {
        const r = await ctx.api.saveFuel({ ...v, truck_id: trip.truck_id, fuel_type: 'DIESEL', trip_id: id, driver_id: trip.driver_id });
        if (r.error) return { error: friendlyError(r.error) };
      },

  async function settle(on) {
    if (on) {

  return h('div', { class: 'stack' },
    h('div', null, h('a', { class: 'back', href: '#/trips' }, 'Back to trips'),

      h('dl', { class: 'kv' },
        h('dt', null, 'Driver'), h('dd', null, trip.driver_name || 'Not set'),
        h('dt', null, 'Dates'), h('dd', null, fmtDate(trip.start_date) + (trip.end_date ? ' to ' + fmtDate(trip.end_date) : ' (running)')),
        h('dt', null, 'Distance'), h('dd', null, trip.km != null ? num(trip.km, 0) + ' km' : 'Not set'),
        h('dt', null, 'Load'), h('dd', null, trip.load_tons != null ? num(trip.load_tons) + ' t' : 'Not set'),
        trip.notes ? [h('dt', null, 'Notes'), h('dd', null, trip.notes)] : null)),

    h('section', { class: 'panel' }, h('h2', null, 'Diesel for this trip'),
      fuel.length ? h('ul', { class: 'list' }, fuel.map((f) => h('li', null, h('div', { class: 'row' },
        h('div', { class: 'grow' }, h('div', { class: 'title' }, `${f.fuel_type === 'DIESEL' ? 'Diesel' : f.fuel_type === 'UREA' ? 'Urea' : 'Lube'}: ${num(f.quantity)} L`),
          h('div', { class: 'detail' }, [fmtDate(f.entry_date), f.source === 'outside' ? f.vendor || 'Outside pump' : 'Own tank'].join(', '))),
        h('strong', null, inr(f.amount))))))
        : h('p', { class: 'muted' }, 'No diesel linked to this trip yet.'),
      canWrite && !locked ? h('div', { style: 'margin-top:12px' }, h('button', { class: 'btn small', onclick: addDiesel }, 'Add diesel')) : null),

    h('section', { class: 'panel' }, h('h2', null, 'Cash advance and expenses'),

        h('button', { class: 'btn small', onclick: () => entryForm('EXPENSE') }, 'Add expense')) : null),

    h('section', { class: 'panel' }, h('h2', null, 'Settlement'),
      h('dl', { class: 'kv' },
        h('dt', null, 'Cash advance given'), h('dd', null, inr(x.advance)),
        h('dt', null, 'Driver expenses'), h('dd', null, inr(x.expense)),
        h('dt', null, 'Balance'), h('dd', null, h('strong', null, balanceText)),
        trip.settled_on ? [h('dt', null, 'Settled on'), h('dd', null, fmtDate(trip.settled_on))] : null),
      canWrite && trip.status === 'completed'
        ? h('div', { style: 'margin-top:12px' }, trip.settled_on
          ? h('button', { class: 'btn small', onclick: () => settle(false) }, 'Reopen settlement')

        : (trip.status === 'running' ? h('p', { class: 'muted' }, 'Complete the trip to settle it.') : null)),

    h('section', { class: 'panel' }, h('h2', null, 'Income and cost'),
      h('dl', { class: 'kv' },
        h('dt', null, 'Freight earned'), h('dd', null, trip.freight != null ? inr(trip.freight) : 'Not set'),
        h('dt', null, `Diesel (${num(x.diesel_litres)} L)`), h('dd', null, inr(x.diesel_amount)),
        h('dt', null, 'Driver expenses'), h('dd', null, inr(x.expense)),
        h('dt', null, 'After costs'), h('dd', null, h('strong', null, inr(tripNet(trip, x)))),
        x.diesel_litres && trip.km ? [h('dt', null, 'Diesel per km'), h('dd', null, `${num(trip.km / x.diesel_litres, 2)} km/l`)] : null)));
}

return { cashBalance, tripNet, tripsView, tripDetailView };

// What can be done to an item now.
function actionsFor(t, forms, writable) {
  if (!writable || t.status === 'scrapped') return [];
  const out = [];
  if (t.status === 'in_stock') out.push(['Fit on truck', () => forms.fit(t)]);
  if (t.status === 'fitted') out.push(['Remove from truck', () => forms.unfit(t)]);
  if (t.kind !== 'FLAP') out.push(['Puncture repair', () => forms.puncture(t)]);
  if (t.kind === 'TYRE' && t.status === 'in_stock') out.push(['Resole', () => forms.resole(t)]);
  out.push(['Scrap', () => forms.scrap(t)]);
  return out;
}

function eventList(events) {
  if (!events.length) return h('p', { class: 'muted' }, 'Nothing recorded yet.');
  return h('ul', { class: 'history' }, events.map((e) => h('li', null,

}

async function boot() {

    return renderMessage('Could not start the app', friendlyError(e), [h('button', { class: 'btn primary', onclick: () => location.reload() }, 'Try again')]);

  renderMessage('Waiting for approval',
    'Your login works, but the owner has not switched on your account yet. Ask the owner to activate it, then reload this page.',
    [h('button', { class: 'btn primary', onclick: () => location.reload() }, 'Reload'),
      h('button', { class: 'btn', onclick: signOut }, 'Sign out')]);
}

function renderLogin() {
  const error = h('div', { class: 'form-error', role: 'alert', hidden: true });
  const email = h('input', { id: 'email', type: 'text', required: true, autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false' });
  const password = h('input', { id: 'password', type: 'password', required: true, autocomplete: 'current-password' });
  const submit = h('button', { class: 'btn primary', type: 'submit' }, 'Sign in');
  const form = h('form', { class: 'stack' },
    h('h1', null, appName),
    error,
    h('div', { class: 'field' }, h('label', { for: 'email' }, 'User name, email or phone'), email),
    h('div', { class: 'field' }, h('label', { for: 'password' }, 'Password'), password),
    submit);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    error.hidden = true;
    submit.disabled = true;
    submit.textContent = 'Signing in…';
    const { error: err, defaultPassword } = await api.signIn(email.value.trim(), password.value);
    if (err) {
      error.textContent = /invalid login/i.test(err.message) ? 'Email or password is wrong.' : friendlyError(err);
      error.hidden = false;
      submit.disabled = false;
      submit.textContent = 'Sign in';
      return;
    }
    if (defaultPassword) toast('You are using the starting password. Open Settings and change it now.', 'bad');
    start();
  });
  root.replaceChildren(h('div', { class: 'auth' }, h('div', { class: 'panel' }, form)));
  email.focus();
}

async function signOut() {
  await api.signOut();
  profile = null;
  start();
}

function renderShell() {
  const items = ROUTES.filter((r) => r.label && r.roles.includes(profile.role));
  // Pages that are planned but not built show in the side menu on a PC only.
  const planned = MODULES.filter((m) => m.status !== 'built' && m.roles.includes(profile.role));
  navEl = h('nav', { class: 'nav', 'aria-label': 'Main' },
    items.map((r) => h('a', { href: '#' + r.path, 'data-path': r.path, class: r.pcOnly ? 'pc-only' : null }, icon(r.icon), r.label)),
    planned.length ? h('div', { class: 'nav-heading' }, 'Coming later') : null,
    planned.map((m) => h('a', { class: 'planned', href: '#/m/' + m.id, 'data-path': '/m/' + m.id },
      h('span', { class: 'modno' }, m.no), m.title)));

  const banner = h('div', { class: 'banner', role: 'status', hidden: true });
  const syncBanner = () => {
    if (demoMode) { banner.textContent = 'Demo mode. This is sample data and nothing is saved.'; banner.hidden = false; }
    else if (!navigator.onLine) { banner.textContent = 'You are offline. Changes cannot be saved until you reconnect.'; banner.hidden = false; }
    else banner.hidden = true;
  };
  window.addEventListener('online', syncBanner);
  window.addEventListener('offline', syncBanner);
  syncBanner();

  view = h('div', { id: 'view' });
  root.replaceChildren(h('div', { class: 'shell' },
    h('header', { class: 'topbar' },
      h('span', { class: 'brand' }, appName),
      h('div', { class: 'who' },
        h('span', null, `${profile.full_name}, ${ROLE_LABEL[profile.role] || profile.role}`),
        h('button', { class: 'btn small', onclick: signOut }, demoMode ? 'Leave demo' : 'Sign out'))),
    navEl,
    h('main', { class: 'main', id: 'main', tabindex: '-1' }, banner, view)));
}

// ------------------------------------------------------------------ router
function find(path) {
  for (const r of ROUTES) {
    const m = r.match.exec(path);
    if (m) return { route: r, params: m.slice(1) };
  }
  return null;
}

async function route(keepScroll) {
  if (!profile || !view) return;
  const path = location.hash.replace(/^#/, '') || '/';
  const found = find(path);
  if (!found || !found.route.roles.includes(profile.role)) { location.hash = '#/'; return; }

  const token = ++routeToken;
  for (const a of navEl.querySelectorAll('a')) {
    const p = a.dataset.path;
    const on = p === '/' ? path === '/' : path === p || path.startsWith(p + '/');
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }

  const ctx = {
    api, profile,
    canWrite: ['admin', 'owner', 'manager'].includes(profile.role),
    nav: (p) => { location.hash = '#' + p; },
    rerender: () => route(true),
  };
  const y = window.scrollY;
  if (!keepScroll) view.replaceChildren(h('div', { class: 'spinner' }, 'Loading…'));
  try {
    const node = await found.route.render(ctx, ...found.params);
    if (token !== routeToken) return;
    view.replaceChildren(node);
    document.title = (found.route.label ? found.route.label + ' - ' : '') + appName;
  } catch (e) {
    if (token !== routeToken) return;
    console.error(e);
    view.replaceChildren(h('div', { class: 'stack' },
      h('div', { class: 'form-error', role: 'alert' }, friendlyError(e)),
      h('div', null, h('button', { class: 'btn', onclick: () => route() }, 'Try again'))));
  }
  window.scrollTo(0, keepScroll ? y : 0);
}

// ------------------------------------------------------------------ offline shell
function registerServiceWorker() {
  return; // single-file build has no service worker
  if (demoMode || !('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  navigator.serviceWorker.register('sw.js').catch(() => toast('Offline mode could not be set up.', 'bad'));
}

})();
  </script>
</body>
</html>
