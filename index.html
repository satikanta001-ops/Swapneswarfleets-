  async function createIndentImpl(values) {
    if (!INDENT_WRITERS.includes(role())) throw fail('You cannot raise an indent.', 'permission-denied');
    const v = cleanIndent(values);
    const truck = await need('trucks', v.truck_id, 'Truck not found.');
    if (v.job_id) { const j = await need('job_cards', v.job_id, 'Job card not found.'); if (j.truck_id !== truck.id) throw fail('That job card is for another truck.'); }
    const lines = [];
    for (const l of v.lines) { const it = await need('items', l.item_id, 'Item not found.'); lines.push({ item_id: it.id, item_name: it.name, unit: it.unit, qty: l.qty }); }
    const today = todayIST();
    const fy = financialYear(today);
    const cref = doc(db, 'doc_counters', `IND_${fy}`);
    const ref = doc(coll('indents'));
    let row;
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(cref);
      const no = snap.exists() ? snap.data().last_no + 1 : 1;
      const stamp = { updated_at: serverTimestamp(), updated_by: uid() };
      if (snap.exists()) tx.update(cref, { last_no: no, ...stamp }); else tx.set(cref, { last_no: no, ...stamp });
      row = { number: `IND/${fy}/${String(no).padStart(5, '0')}`, seq: no, fy, truck_id: truck.id, truck_no: truck.truck_no, job_id: v.job_id, requested_on: today,
        requested_by_name: me ? me.full_name : null, status: 'requested', lines, note: v.note, approved_on: null, approved_by_name: null, issued_on: null, total_cost: null, reject_reason: null };
      tx.set(ref, { ...row, ...newStamps() });
      audit(tx, `indents/${ref.id}`, 'INSERT', null, row);
    });
    return { data: { id: ref.id, ...row, deleted_at: null }, error: null };
  }
  async function moveIndent(id, from, patch, who) {
    const before = await need('indents', id, 'Indent not found.');
    if (!from.includes(before.status)) throw fail(`This indent is ${before.status}, so that cannot be done.`);
    const batch = writeBatch(db);
    batch.update(doc(db, 'indents', id), { ...patch, ...editStamps() });
    audit(batch, `indents/${id}`, 'UPDATE', before, { ...before, ...patch });
    const res = await commit(batch);
    return { data: { ...before, ...patch }, error: null, queued: res.queued };
  }
  const needApprover = () => { if (!INDENT_APPROVERS.includes(role())) throw fail('Only a manager or the owner can do this.', 'permission-denied'); };
  async function approveIndentImpl(id) {
    needApprover();
    return moveIndent(id, ['requested'], { status: 'approved', approved_on: todayIST(), approved_by_name: me ? me.full_name : null });
  }
  async function rejectIndentImpl(id, reason) {
    needApprover();
    const r = String(reason || '').trim().slice(0, 200);
    if (!r) throw fail('Write the reason.');
    return moveIndent(id, ['requested'], { status: 'rejected', reject_reason: r, approved_by_name: me ? me.full_name : null });
  }
  async function cancelIndentImpl(id) {
    needApprover();
    return moveIndent(id, ['requested', 'approved'], { status: 'cancelled' });
  }
  async function issueIndentImpl(id) {
    if (!['admin', 'owner', 'manager', 'store_keeper'].includes(role())) throw fail('Only the store keeper can issue.', 'permission-denied');
    const ind = await need('indents', id, 'Indent not found.');
    if (ind.status !== 'approved') throw fail('Only an approved indent can be issued.');
    const today = todayIST();
    const batch = writeBatch(db);
    let total = 0;
    const issued = [];
    for (const l of ind.lines) {
      const item = await need('items', l.item_id, 'Item not found.');
      if (l.qty > item.on_hand) throw fail(`Only ${item.on_hand} ${item.unit} of ${item.name} in stock. Receive more first.`);
      const rate = await avgCost(item.id);
      const line_total = rate == null ? null : round2(rate * l.qty);
      total = round2(total + (line_total || 0));
      batch.set(doc(coll('stock_moves')), { ...moveRow(item, 'ISSUE', { date: today, qty: l.qty, note: ind.number }, { truck_id: ind.truck_id, truck_no: ind.truck_no, rate, line_total, job_id: ind.job_id, indent_id: id }), ...newStamps() });
      const on_hand = Math.round((item.on_hand - l.qty) * 1000) / 1000;
      batch.update(doc(db, 'items', item.id), { on_hand, ...editStamps() });
      audit(batch, `items/${item.id}`, 'UPDATE', item, { ...item, on_hand });
      issued.push(item.id);
    }
    const patch = { status: 'issued', issued_on: today, total_cost: total };
    batch.update(doc(db, 'indents', id), { ...patch, ...editStamps() });
    audit(batch, `indents/${id}`, 'UPDATE', ind, { ...ind, ...patch });
    const res = await commit(batch);
    return { data: { ...ind, ...patch }, error: null, queued: res.queued };
  }

  // ---------------------------------------------------------------- trips, cash advances and expenses
  const EXPENSE_KINDS = ['Toll', 'Food', 'Repair', 'Police', 'Loading and unloading', 'Weighbridge', 'Other'];
  const numOrNull = (v, what) => {
    if (v === null || v === undefined || v === '') return null;
    const n = Number(v);
    if (!(n >= 0)) throw fail(`${what} is not valid.`);
    return n;
  };
  const isDate = (v) => /^\d{4}-\d{2}-\d{2}$/.test(v || '');

  // Trips that started in the range, plus every trip still running.
  async function listTripsImpl(from, to) {
    const inRange = live(await rowsWhere('trips', ['start_date', '>=', from], ['start_date', '<=', to]));
    const running = live(await rowsWhere('trips', ['status', '==', 'running']));
    const seen = new Set(inRange.map((t) => t.id));
    const rows = [...inRange, ...running.filter((t) => !seen.has(t.id))];
    return { data: rows.sort((a, b) => b.start_date.localeCompare(a.start_date)), error: null };
  }

  // Cash and diesel per trip: { tripId: { advance, expense, diesel_amount, diesel_litres } }
  async function tripTotalsImpl(ids) {
    const out = {};
    for (const id of ids) out[id] = { advance: 0, expense: 0, diesel_amount: 0, diesel_litres: 0 };
    for (let i = 0; i < ids.length; i += 10) {
      const chunk = ids.slice(i, i + 10);
      for (const e of live(await rowsWhere('trip_entries', ['trip_id', 'in', chunk]))) {
        out[e.trip_id][e.kind === 'ADVANCE' ? 'advance' : 'expense'] += e.amount;
      }
      for (const f of live(await rowsWhere('fuel_entries', ['trip_id', 'in', chunk]))) {
        if (f.fuel_type === 'DIESEL') { out[f.trip_id].diesel_amount += f.amount; out[f.trip_id].diesel_litres += f.quantity; }
      }
    }
    return { data: out, error: null };
  }

  async function getTripImpl(id) {
    const snap = await getDoc(doc(db, 'trips', id));
    if (!snap.exists() || snap.data().deleted_at) throw fail('Trip not found.');
    const entries = live(await rowsWhere('trip_entries', ['trip_id', '==', id])).sort((a, b) => a.entry_date.localeCompare(b.entry_date));
    const fuel = live(await rowsWhere('fuel_entries', ['trip_id', '==', id])).sort((a, b) => a.entry_date.localeCompare(b.entry_date));
    return { data: { trip: rowOf(snap), entries, fuel }, error: null };
  }

  async function saveTripImpl(values, id) {
    const to_place = txt(values.to_place, 60);
    if (!to_place) throw fail('Enter the destination.');
    if (!isDate(values.start_date)) throw fail('Choose the start date.');
    const end_date = values.end_date || null;
    if (end_date && (!isDate(end_date) || end_date < values.start_date)) throw fail('The end date cannot be before the start date.');
    const km = numOrNull(values.km, 'The distance');
    const load_tons = numOrNull(values.load_tons, 'The load');
    const freight = numOrNull(values.freight, 'The freight');
    const diesel_advance = numOrNull(values.diesel_advance, 'The diesel advance');
    const cash_advance = numOrNull(values.cash_advance, 'The cash advance');
    if ((diesel_advance ?? 0) > 10000000 || (cash_advance ?? 0) > 10000000) throw fail('That advance is too high.');

    const tsnap = await getDoc(doc(db, 'trucks', values.truck_id));
    if (!tsnap.exists() || tsnap.data().deleted_at) throw fail('Truck not found.');
    const truck = rowOf(tsnap);
    let before = null;
    if (id) {
      const bs = await getDoc(doc(db, 'trips', id));
      if (!bs.exists() || bs.data().deleted_at) throw fail('Trip not found.');
      before = rowOf(bs);
      if (before.truck_id !== values.truck_id) throw fail('The truck of a trip cannot be changed. Remove the trip and add it again.');
    } else if (truck.status === 'sold') throw fail('That truck is sold.');
    if (!end_date) {
      const others = live(await rowsWhere('trips', ['truck_id', '==', values.truck_id])).filter((t) => t.status === 'running' && t.id !== id);
      if (others.length) throw fail(`${truck.truck_no} already has a running trip to ${others[0].to_place}. Complete it first.`);
    }
    let driver_id = values.driver_id || (before ? before.driver_id : truck.driver_id) || null;
    let driver_name = null;
    if (driver_id && before && driver_id === before.driver_id) driver_name = before.driver_name;
    else if (driver_id && driver_id === truck.driver_id) driver_name = truck.driver_name || null;
    else if (driver_id) {
      const dsnap = await getDoc(doc(db, 'drivers', driver_id));
      if (!dsnap.exists() || dsnap.data().deleted_at) throw fail('Driver not found.');
      driver_name = dsnap.data().full_name;
    }
    const fields = {
      truck_id: values.truck_id, truck_no: truck.truck_no, driver_id, driver_name,
      from_place: txt(values.from_place, 60), to_place, transporter: txt(values.transporter, 60), start_date: values.start_date, end_date,
      km, load_tons, freight, diesel_advance, cash_advance, status: end_date ? 'completed' : 'running',
      settled_on: end_date && before ? before.settled_on ?? null : null,
      notes: txt(values.notes, 500),
    };
    const batch = writeBatch(db);
    if (before) {
      batch.update(doc(db, 'trips', id), { ...fields, ...editStamps() });
      audit(batch, `trips/${id}`, 'UPDATE', before, { ...before, ...fields });
      const res = await commit(batch);
      return { data: { ...before, ...fields }, error: null, queued: res.queued };
    }
    const ref = doc(coll('trips'));
    batch.set(ref, { ...fields, ...newStamps() });
    audit(batch, `trips/${ref.id}`, 'INSERT', null, fields);
    const res = await commit(batch);
    return { data: { id: ref.id, ...fields, deleted_at: null }, error: null, queued: res.queued };
  }

  async function removeTripImpl(id) {
    const { data } = await getTripImpl(id);
    if (data.entries.length || data.fuel.length) throw fail('Remove its cash entries and unlink its diesel first.');
    const batch = writeBatch(db);
    batch.update(doc(db, 'trips', id), deleteStamps());
    audit(batch, `trips/${id}`, 'SOFT_DELETE', data.trip, null);
    const res = await commit(batch);
    return { data: [{ id }], error: null, queued: res.queued };
  }

  // Settle a completed trip (the cash is squared with the driver), or reopen the settlement.
  async function settleTripImpl(id, settle) {
    const ref = doc(db, 'trips', id);
    const snap = await getDoc(ref);
    if (!snap.exists() || snap.data().deleted_at) throw fail('Trip not found.');
    const before = rowOf(snap);
    if (settle && before.status !== 'completed') throw fail('Complete the trip before settling it.');
    const settled_on = settle ? todayIST() : null;
    const batch = writeBatch(db);
    batch.update(ref, { settled_on, ...editStamps() });
    audit(batch, `trips/${id}`, 'UPDATE', before, { ...before, settled_on });
    const res = await commit(batch);
    return { data: { ...before, settled_on }, error: null, queued: res.queued };
  }

  async function saveTripEntryImpl(values, id) {
    if (!['ADVANCE', 'EXPENSE'].includes(values.kind)) throw fail('Choose advance or expense.');
    const amount = Number(values.amount);
    if (!(amount > 0 && amount <= 10000000)) throw fail('Enter the amount in rupees.');
    if (!isDate(values.entry_date)) throw fail('Choose a date.');
    const tsnap = await getDoc(doc(db, 'trips', values.trip_id));
    if (!tsnap.exists() || tsnap.data().deleted_at) throw fail('Trip not found.');
    if (tsnap.data().settled_on) throw fail('This trip is settled. Reopen the settlement to change its cash.');
    const fields = {
      trip_id: values.trip_id, kind: values.kind, entry_date: values.entry_date, amount,
      category: values.kind === 'EXPENSE' ? txt(values.category, 30) : null, note: txt(values.note, 200),
    };
    const batch = writeBatch(db);
    if (id) {
      const ref = doc(db, 'trip_entries', id);
      const snap = await getDoc(ref);
      if (!snap.exists() || snap.data().deleted_at) throw fail('Entry not found.');
      const before = rowOf(snap);
      if (before.trip_id !== fields.trip_id || before.kind !== fields.kind) throw fail('The trip and type of an entry cannot be changed.');
      batch.update(ref, { ...fields, ...editStamps() });
      audit(batch, `trip_entries/${id}`, 'UPDATE', before, { ...before, ...fields });
      const res = await commit(batch);
      return { data: { ...before, ...fields }, error: null, queued: res.queued };
    }
    const ref = doc(coll('trip_entries'));
    batch.set(ref, { ...fields, ...newStamps() });
    audit(batch, `trip_entries/${ref.id}`, 'INSERT', null, fields);
    const res = await commit(batch);
    return { data: { id: ref.id, ...fields, deleted_at: null }, error: null, queued: res.queued };
  }

  async function removeTripEntryImpl(id) {
    const ref = doc(db, 'trip_entries', id);
    const snap = await getDoc(ref);
    if (!snap.exists()) throw fail('Entry not found.');
    const before = rowOf(snap);
    const ts = await getDoc(doc(db, 'trips', before.trip_id));
    if (ts.exists() && ts.data().settled_on) throw fail('This trip is settled. Reopen the settlement to change its cash.');
    const batch = writeBatch(db);
    batch.update(ref, deleteStamps());
    audit(batch, `trip_entries/${id}`, 'SOFT_DELETE', before, null);
    const res = await commit(batch);
    return { data: [{ id }], error: null, queued: res.queued };
  }

  // ---------------------------------------------------------------- vehicle documents
  const docsForTruck = async (truckId) => live(await rowsWhere('vehicle_documents', ['truck_id', '==', truckId]));

  async function saveDocumentImpl(values, id) {
    const fields = pick(values, DOC_FIELDS);
    if (fields.issued_on && fields.expires_on && fields.expires_on < fields.issued_on) {
      throw fail('violates check constraint "vehicle_documents_check"');
    }
    if (!DOC_TYPES.some((t) => t.code === fields.doc_type)) throw fail('Choose a document type.');
    const truckRef = doc(db, 'trucks', values.truck_id);
    const tsnap = await getDoc(truckRef);
    if (!tsnap.exists() || tsnap.data().deleted_at) throw fail('Truck not found.');
    const truck = rowOf(tsnap);

    const existing = await docsForTruck(values.truck_id);
    const ref = id ? doc(db, 'vehicle_documents', id) : doc(coll('vehicle_documents'));
    const before = id ? existing.find((r) => r.id === id) : null;
    if (id && !before) throw fail('Document entry not found.');

    // A scan or photo may come with the entry: values.file = { name, mime, bytes, data } (data is base64).
    // values.remove_file = true takes the file off the entry.
    const file = values.file || null;
    if (file) checkFile(file);
    const hadFile = !!(before && before.has_file);
    const hasFile = file ? true : (values.remove_file ? false : hadFile);
    const fileName = file ? String(file.name || 'document').slice(0, 120) : (hasFile ? before.file_name ?? null : null);
    fields.has_file = hasFile;
    fields.file_name = fileName;

    const others = existing.filter((r) => r.id !== ref.id && r.doc_type === fields.doc_type);
    const mine = { id: ref.id, ...fields, created_at: before ? before.created_at : null };
    const docs_latest = { ...(truck.docs_latest || {}) };
    const latest = latestEntry([...others, mine]);
    if (latest) docs_latest[fields.doc_type] = latest; else delete docs_latest[fields.doc_type];

    const batch = writeBatch(db);
    if (id) {
      batch.update(ref, { ...fields, ...editStamps() });
      audit(batch, `vehicle_documents/${ref.id}`, 'UPDATE', { ...before, truck_id: values.truck_id }, { ...fields, truck_id: values.truck_id });
    } else {
      batch.set(ref, { truck_id: values.truck_id, ...fields, ...newStamps() });
      audit(batch, `vehicle_documents/${ref.id}`, 'INSERT', null, { truck_id: values.truck_id, ...fields });
    }
    if (file || (values.remove_file && hadFile)) {
      const fref = doc(db, 'document_files', ref.id);
      const fsnap = await getDoc(fref);
      if (file) {
        const body = { document_id: ref.id, truck_id: values.truck_id, name: fileName, mime: file.mime, bytes: file.bytes, data: file.data };
        if (fsnap.exists()) batch.update(fref, { ...body, deleted_at: null, ...editStamps() });
        else batch.set(fref, { ...body, ...newStamps() });
      } else if (fsnap.exists()) {
        batch.update(fref, deleteStamps());
      }
    }
    batch.update(truckRef, { docs_latest, ...editStamps() });
    const res = await commit(batch);
    return { data: { id: ref.id, truck_id: values.truck_id, ...fields }, error: null, queued: res.queued };
  }

  async function removeDocumentImpl(id) {
    const ref = doc(db, 'vehicle_documents', id);
    const snap = await getDoc(ref);
    if (!snap.exists()) throw fail('Document entry not found.');
    const row = rowOf(snap);
    const truckRef = doc(db, 'trucks', row.truck_id);
    const truck = rowOf(await getDoc(truckRef));
    const rest = (await docsForTruck(row.truck_id)).filter((r) => r.id !== id && r.doc_type === row.doc_type);
    const docs_latest = { ...(truck.docs_latest || {}) };
    const latest = latestEntry(rest);
    if (latest) docs_latest[row.doc_type] = latest; else delete docs_latest[row.doc_type];

    const batch = writeBatch(db);
    batch.update(ref, deleteStamps());
    batch.update(truckRef, { docs_latest, ...editStamps() });
    audit(batch, `vehicle_documents/${id}`, 'SOFT_DELETE', row, null);
    const res = await commit(batch);
    return { data: [{ id }], error: null, queued: res.queued };
  }

  // ---------------------------------------------------------------- drivers
  async function allDrivers() {
    const rows = role() === 'driver'
      ? await rowsWhere('drivers', ['profile_id', '==', uid()])
      : await rowsWhere('drivers', ['deleted_at', '==', null]);
    return live(rows).sort((a, b) => a.full_name.localeCompare(b.full_name));
  }

  // The read rule for scans looks inside the document, so asking about one that does not exist yet is
  // refused by the database. A refusal here therefore means "not there yet".
  async function scanExists(ref) {
    try { return (await getDoc(ref)).exists(); } catch (e) {
      if (e && e.code === 'permission-denied') return false;
      throw e;
    }
  }

  async function saveDriverImpl(values, id) {
    if (values.aadhaar_last4 && !/^[0-9]{4}$/.test(values.aadhaar_last4)) throw fail('violates check constraint "drivers_aadhaar_last4_check"');
    if (values.dl_no) {
      const same = live(await rowsWhere('drivers', ['dl_no', '==', values.dl_no])).filter((r) => r.id !== id);
      if (same.length) throw fail('duplicate key value violates unique constraint "drivers_dl_no_uq"');
    }
    const fields = pick(values, DRIVER_FIELDS);
    // Scans: values.files = { KIND: { name, mime, bytes, data } }, values.remove_files = [KIND, ...]
    const newFiles = values.files || {};
    const removeKinds = values.remove_files || [];
    const validKinds = DRIVER_FILE_KINDS.map((k) => k.code);
    for (const [kind, file] of Object.entries(newFiles)) {
      if (!validKinds.includes(kind)) throw fail('Unknown document slot.');
      checkFile(file);
    }
    if (removeKinds.some((k) => !validKinds.includes(k))) throw fail('Unknown document slot.');
    const touched = Object.keys(newFiles).length + removeKinds.length > 0;

    const batch = writeBatch(db);
    const ref = id ? doc(db, 'drivers', id) : doc(coll('drivers'));
    let before = null;
    if (id) {
      const snap = await getDoc(ref);
      if (!snap.exists()) throw fail('Driver not found.');
      before = rowOf(snap);
    }
    if (touched) {
      const files = { ...((before && before.files) || {}) };
      for (const [kind, file] of Object.entries(newFiles)) {
        const fref = doc(db, 'driver_files', `${ref.id}_${kind}`);
        const body = { driver_id: ref.id, kind, name: String(file.name || 'document').slice(0, 120), mime: file.mime, bytes: file.bytes, data: file.data };
        if (await scanExists(fref)) batch.update(fref, { ...body, deleted_at: null, ...editStamps() });
        else batch.set(fref, { ...body, ...newStamps() });
        files[kind] = body.name;
      }
      for (const kind of removeKinds) {
        if (newFiles[kind]) continue;
        const fref = doc(db, 'driver_files', `${ref.id}_${kind}`);
        if (await scanExists(fref)) batch.update(fref, deleteStamps());
        delete files[kind];
      }
      fields.files = files;
    }
    if (id) {
      batch.update(ref, { ...fields, ...editStamps() });
      audit(batch, `drivers/${id}`, 'UPDATE', before, { ...before, ...fields });
      // A renamed driver keeps showing correctly on his truck.
      if (fields.full_name && fields.full_name !== before.full_name) {
        for (const t of live(await rowsWhere('trucks', ['driver_id', '==', id]))) {
          batch.update(doc(db, 'trucks', t.id), { driver_name: fields.full_name, ...editStamps() });
        }
      }
      const res = await commit(batch);
      return { data: { ...before, ...fields }, error: null, queued: res.queued };
    }
    batch.set(ref, { profile_id: null, ...fields, ...newStamps() });
    audit(batch, `drivers/${ref.id}`, 'INSERT', null, fields);
    const res = await commit(batch);
    return { data: { id: ref.id, profile_id: null, ...fields }, error: null, queued: res.queued };
  }

  async function removeDriverImpl(id) {
    const ref = doc(db, 'drivers', id);
    const snap = await getDoc(ref);
    if (!snap.exists()) throw fail('Driver not found.');
    const batch = writeBatch(db);
    batch.update(ref, deleteStamps());
    audit(batch, `drivers/${id}`, 'SOFT_DELETE', rowOf(snap), null);
    const res = await commit(batch);
    return { data: [{ id }], error: null, queued: res.queued };
  }

  // ---------------------------------------------------------------- attendance
  async function attendanceOn(date) {
    const rows = role() === 'driver'
      ? await rowsWhere('driver_attendance', ['profile_id', '==', uid()], ['att_date', '==', date])
      : await rowsWhere('driver_attendance', ['att_date', '==', date]);
    return live(rows);
  }

  // Adds the operations for one attendance row to a batch.
  async function stageAttendance(batch, row) {
    const id = attId(row.driver_id, row.att_date);
    const ref = doc(db, 'driver_attendance', id);
    const snap = await getDoc(ref);
    const fields = { status: row.status, truck_id: row.truck_id ?? null, remarks: row.remarks ?? null };
    if (snap.exists()) {
      const before = rowOf(snap);
      const extra = row.profile_id !== undefined ? { profile_id: row.profile_id } : {};
      batch.update(ref, { ...fields, ...extra, deleted_at: null, ...editStamps() });
      audit(batch, `driver_attendance/${id}`, 'UPDATE', before, { ...before, ...fields, ...extra });
    } else {
      const data = { driver_id: row.driver_id, profile_id: row.profile_id ?? null, att_date: row.att_date, att_day: dayNumber(row.att_date), ...fields };
      batch.set(ref, { ...data, ...newStamps() });
      audit(batch, `driver_attendance/${id}`, 'INSERT', null, data);
    }
    return { id, driver_id: row.driver_id, att_date: row.att_date, status: row.status };
  }

  // ---------------------------------------------------------------- people (owner screen)
  async function createUserImpl({ full_name, login, password, role: newRole, phone, driver_id }) {
    if (role() !== 'admin') throw fail('Only the admin can add people.');
    if (!full_name || !login || !password) throw fail('Enter a name, a login and a password.');
    if (String(password).length < 8) throw fail('The password needs at least 8 characters.');
    const email = loginEmail(login);
    // A second app instance creates the login so the owner stays signed in.
    const second = initializeApp(cfg.firebase, 'second-' + Date.now());
    let newUid;
    try {
      const secondAuth = getAuth(second);
      const cred = await createUserWithEmailAndPassword(secondAuth, email, password);
      newUid = cred.user.uid;
      await fbSignOut(secondAuth);
    } finally {
      await deleteApp(second);
    }
    try {
      const batch = writeBatch(db);
      const profile = { full_name, email, phone: phone || null, role: newRole, active: true, pages: null };
      batch.set(doc(db, 'profiles', newUid), { ...profile, ...newStamps() });
      audit(batch, `profiles/${newUid}`, 'INSERT', null, profile);
      if (driver_id) {
        batch.update(doc(db, 'drivers', driver_id), { profile_id: newUid, ...editStamps() });
        audit(batch, `drivers/${driver_id}`, 'UPDATE', null, { profile_id: newUid });
      }
      await batch.commit();
    } catch (e) {
      throw fail('The login was created but the profile was not saved (' + (e.message || e.code) + '). '
        + 'Delete this login in the Firebase console under Authentication, then add the person again.');
    }
    return { data: { id: newUid, ...{ full_name, email, role: newRole, active: true } }, error: null };
  }

  // ---------------------------------------------------------------- one-time admin setup
  // Writes the admin's profile and the marker record in one batch. The rules allow this only
  // for admin@user.fleet.local and only while the marker does not exist yet.
  async function claimAdminIfNeeded() {
    const id = auth.currentUser.uid;

        try {
          await Promise.race([run(), wait(8000).then(() => { throw Object.assign(new Error('timeout'), { code: 'timeout' }); })]);

        }
      }

      await mustBeRefused('Deleting a truck is refused', () => deleteDoc(doc(db, 'trucks', 'security-check')));
      await mustBeRefused('Changing the audit log is refused', () => updateDoc(doc(db, 'audit_log', 'security-check'), { by: 'x' }));
      await mustBeRefused('Deleting from the audit log is refused', () => deleteDoc(doc(db, 'audit_log', 'security-check')));
      await mustBeRefused('A fake audit entry in someone else\'s name is refused', () =>
        setDoc(doc(db, 'audit_log', 'security-check-fake'), { at: serverTimestamp(), by: 'someone-else', by_name: 'x', path: 'x', action: 'UPDATE', before: null, after: null }));
      await mustBeRefused('A truck saved with someone else\'s name on it is refused', () =>
        setDoc(doc(db, 'trucks', 'security-check-forged'), { ...goodTruck, ...stamps(), created_by: 'someone-else' }));
      await mustBeRefused('A truck with a bad registration number is refused', () =>
        setDoc(doc(db, 'trucks', 'security-check-bad'), { ...goodTruck, truck_no: 'x', ...stamps() }));
      await mustBeRefused('A collection the app does not use is closed', () => setDoc(doc(db, 'anything_else', 'x'), { a: 1 }));

      try {
        const lock = await getDoc(doc(db, 'period_locks', 'current'));
        const day = lock.exists() ? lock.data().locked_day : 0;
        if (day > 0) {
          const iso = String(day).replace(/^(\d{4})(\d{2})(\d{2})$/, '$1-$2-$3');
          await mustBeRefused('Attendance inside the locked period is refused', () =>
            setDoc(doc(db, 'driver_attendance', attId('security-check', iso)), {
              driver_id: 'security-check', profile_id: null, att_date: iso, att_day: day, status: 'present', truck_id: null, remarks: null, ...stamps(),
            }));
        } else {
          results.push({ name: 'Attendance inside the locked period is refused', ok: null, detail: 'No period is locked yet, so there is nothing to check.' });
        }
      } catch (e) {
        results.push({ name: 'Attendance inside the locked period is refused', ok: null, detail: 'Could not check (' + (e.code || e.message) + ').' });
      }
      return results;
    },

function finYear(iso) {
  const y = Number(iso.slice(0, 4));
  const m = Number(iso.slice(5, 7));
  const start = m >= 4 ? y : y - 1;
  return `${start}-${String((start + 1) % 100).padStart(2, '0')}`;
}

// Turns database errors into sentences a workshop supervisor can act on.
function friendlyError(err) {
  const code = err && err.code;
  if (code === 'permission-denied') {
    const m0 = (err && err.message) || '';
    if (m0 && !/insufficient permissions/i.test(m0)) return m0;     // a message the app wrote itself
    return 'You do not have permission to do this.' + (err.detail ? ` (${err.detail}.)` : '');
  }
  if (code === 'unavailable' || code === 'auth/network-request-failed') return 'No connection. Check your internet and try again.';
  if (code === 'auth/email-already-in-use') return 'This email or phone number already has a login.';
  if (code === 'auth/invalid-email') return 'Enter a valid email address, or a phone number with at least 8 digits.';
  if (code === 'auth/weak-password') return 'The password is too weak. Use at least 8 characters.';
  const m = (err && err.message) || String(err || '');
  if (/Period closed/i.test(m)) return m.replace(/^.*?(Period closed)/i, '$1');
  if (/duplicate key|unique/i.test(m)) {
    if (/trucks_truck_no/i.test(m)) return 'A truck with this registration number already exists.';
    if (/drivers_dl_no/i.test(m)) return 'A driver with this licence number already exists.';
    if (/driver_attendance/i.test(m)) return 'Attendance for this driver and date is already recorded.';
    return 'This entry already exists.';
  }
  if (/row-level security|permission denied/i.test(m)) return 'You do not have permission to do this.';
  if (/check constraint/i.test(m)) {
    if (/truck_no/i.test(m)) return 'Registration number must be 6 to 12 letters and digits, for example OD05AB1234.';
    if (/aadhaar/i.test(m)) return 'Enter only the last 4 digits of the Aadhaar number.';
    if (/expires_on|issued_on/i.test(m)) return 'The expiry date cannot be before the issue date.';
    return 'One of the values is not allowed. Check the form and try again.';
  }
  if (/Failed to fetch|NetworkError|network/i.test(m)) return 'No connection. Check your internet and try again.';
  return m || 'Something went wrong. Try again.';
}

// A read-only dialog with buttons. Each action runs after the dialog closes and returns true when the page should reload.
function infoDialog(title, body, actions = []) {
  return new Promise((resolve) => {
    let next = null;
    const dlg = h('dialog', { 'aria-labelledby': 'dlg-title', class: 'info' });
    dlg.append(h('form', { method: 'dialog' }, h('h2', { id: 'dlg-title' }, title), body,
      h('div', { class: 'actions wrap' },
        actions.filter(Boolean).map((a) => h('button', { type: 'button', class: 'btn' + (a.primary ? ' primary' : ''), onclick: () => { next = a.run; dlg.close(); } }, a.label)),
        h('button', { type: 'submit', class: 'btn' }, 'Close'))));
    dlg.addEventListener('close', async () => { dlg.remove(); resolve(next ? !!(await next()) : false); });
    document.body.append(dlg); dlg.showModal();
  });
}

// Saves a CSV file that opens in Excel.
function downloadCsv(name, rows) {
  const url = URL.createObjectURL(new Blob([toCsv(rows)], { type: 'text/csv;charset=utf-8' }));
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

    const unmarked = drivers.length - [...drivers].filter((d) => marks.has(d.id)).length;

    const rows = drivers.filter((d) => !marks.has(d.id)).map((d) => ({ driver_id: d.id, profile_id: d.profile_id ?? null, att_date: date, status: 'present', truck_id: trucks[d.id] ? trucks[d.id].truck_id : null }));

    h('div', { class: 'page-head' }, h('div', null, h('h1', null, 'Attendance'), summary)),
    h('div', { class: 'toolbar datebar' }, prev, dateInput, next),

const __m_files = (() => {
// Scans and photos of documents: make them small enough to keep, and show them again.
// Photos are shrunk in the browser (longest side 1600 px, JPEG). PDFs are kept as they are, up to a small size.
const { h } = __m_ui;
const MAX_RAW_BYTES = 600000;           // keeps the stored text under the 1 MB record limit

function toBase64(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
    fr.onerror = () => reject(new Error('The file could not be read.'));
    fr.readAsDataURL(blob);
  });
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This photo type cannot be read. Take the photo again as a normal picture (JPEG), or choose another file.')); };
    img.src = url;
  });
}

const canvasBlob = (canvas, quality) => new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', quality));

// Returns { name, mime, bytes, data } ready to be saved, or throws an Error with a plain message.
async function prepareFile(file) {
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  const baseName = (file.name || 'document').replace(/\.[^.]+$/, '').slice(0, 100) || 'document';
  if (isPdf) {
    if (file.size > MAX_RAW_BYTES) {
      throw new Error(`This PDF is ${Math.round(file.size / 1024)} KB. The limit is ${Math.round(MAX_RAW_BYTES / 1024)} KB. Take a photo of the document instead, or make the PDF smaller.`);
    }
    return { name: baseName + '.pdf', mime: 'application/pdf', bytes: file.size, data: await toBase64(file) };
  }
  if (!/^image\//.test(file.type)) throw new Error('Choose a photo or a PDF.');
  const img = await loadImage(file);
  let scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  for (let attempt = 0; attempt < 8; attempt += 1) {
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';                         // transparent areas become white, not black
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const blob = await canvasBlob(canvas, attempt < 3 ? 0.78 : 0.6);
    if (blob && blob.size <= MAX_RAW_BYTES) {
      return { name: baseName + '.jpg', mime: 'image/jpeg', bytes: blob.size, data: await toBase64(blob) };
    }
    scale *= 0.8;
  }
  throw new Error('This photo is too large to keep, even after shrinking. Try a clearer, closer photo of one page.');
}

// Shows a stored scan or photo in a window.
// fetcher is a function that returns the api result for that file: () => api.getDocumentFile(id)
async function viewStoredFile(fetcher, title) {
  const res = await fetcher();
  if (res.error) throw res.error;
  const f = res.data;
  const bytes = Uint8Array.from(atob(f.data), (c) => c.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes], { type: f.mime }));
  const dlg = h('dialog', { 'aria-labelledby': 'dlg-title', class: 'file-view' });
  const close = () => dlg.close();
  dlg.append(h('div', { class: 'file-box' },
    h('h2', { id: 'dlg-title' }, title || f.name),
    f.mime === 'application/pdf'
      ? h('p', { class: 'muted' }, 'This is a PDF. Open it to read it.')
      : h('img', { class: 'file-img', src: url, alt: title || f.name }),
    h('div', { class: 'actions' },
      h('a', { class: 'btn', href: url, target: '_blank', rel: 'noopener' }, f.mime === 'application/pdf' ? 'Open PDF' : 'Open full size'),
      h('a', { class: 'btn', href: url, download: f.name }, 'Download'),
      h('button', { type: 'button', class: 'btn primary', onclick: close }, 'Close'))));
  dlg.addEventListener('close', () => { dlg.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); });
  document.body.append(dlg);
  dlg.showModal();
}

return { MAX_RAW_BYTES, prepareFile, viewStoredFile };
})();

const __m_picker = (() => {
const { h } = __m_ui;
// A box you can type in that also drops down a list to choose from. It works on a phone and on a computer.
// options: [{ value, label, key }]. Typing a serial or truck number (the key), or any part of the label that fits only one
// option, picks it. `value` is null until the text fits exactly one option.
const norm = (s) => String(s ?? '').toUpperCase().replace(/[\s-]+/g, '');

function searchPick({ id, placeholder, options = [], onChange, autocapitalize = 'characters' }) {
  let opts = options;
  let current = null;
  const input = h('input', { id, type: 'text', list: 'dl-' + id, placeholder, autocomplete: 'off', autocapitalize, 'aria-label': placeholder });
  const dl = h('datalist', { id: 'dl-' + id });
  const draw = () => dl.replaceChildren(...opts.map((o) => h('option', { value: o.label })));
  draw();

  function find() {
    const q = norm(input.value);
    if (!q) return null;
    const exact = opts.find((o) => norm(o.label) === q) || opts.find((o) => norm(o.key) === q);
    if (exact) return exact;
    const part = opts.filter((o) => norm(o.label).includes(q) || norm(o.key).includes(q));
    return part.length === 1 ? part[0] : null;
  }
  function update(fill) {
    const hit = find();
    const v = hit ? hit.value : null;
    if (fill && hit) input.value = hit.label;
    if (v !== current) { current = v; if (onChange) onChange(hit); }
  }
  input.addEventListener('input', () => update(false));
  input.addEventListener('change', () => update(true));

  return {
    el: h('div', { class: 'picker' }, input, dl),
    input,
    get value() { return current; },
    set(value) {
      const o = opts.find((x) => x.value === value);
      input.value = o ? o.label : '';
      current = o ? o.value : null;
      if (onChange) onChange(o || null);
    },
    setOptions(next) {
      opts = next; draw();
      const o = opts.find((x) => x.value === current);
      if (!o) { current = null; input.value = ''; if (onChange) onChange(null); }
    },
    clear() { input.value = ''; current = null; if (onChange) onChange(null); },
  };
}

return { searchPick };
})();

const __m_logo = (() => {
// The Swapneswar Roadlines mark: a line-art truck. `animated` makes the wheels turn and the road run,
// and is used while a page is loading. Colours come from CSS so it works on the dark top bar and on light pages.

<path d="M10 82V26a5 5 0 0 1 5-5h128a5 5 0 0 1 5 5v56"/>
<path d="M20 36h108M20 50h108M20 64h108" stroke-width="2.5" opacity=".55"/>
<path d="M148 34h32a8 8 0 0 1 6.5 3.4l17 24a8 8 0 0 1 1.5 4.6V82"/>
<path d="M160 44h20l12 17h-32z" stroke-width="3"/>
<path d="M10 82h26M64 82h92M184 82h20"/>
<path d="M196 66h8" stroke-width="3"/>
</g>`;
const WHEEL = (x) => `<g class="wheel"><circle cx="${x}" cy="84" r="12" fill="#1e2a33" stroke="#f5c400" stroke-width="4"/><path d="M${x} 76v16M${x - 8} 84h16" stroke="#f5c400" stroke-width="2.5" stroke-linecap="round"/></g>`;

// ---------------------------------------------------------------- one job card
async function jobDetailView(ctx, id) {
  const role = ctx.profile.role;
  const writable = JOB_WRITERS.includes(role), canIssue = STORE_WRITERS.includes(role), canIndent = INDENT_WRITERS.includes(role);
  const today = todayIST();
  const res = await ctx.api.getJob(id);
  const back = h('a', { class: 'back', href: '#/maintenance' }, 'Back to maintenance');
  if (res.error) return h('div', { class: 'stack' }, back, emptyState('Job card not found', friendlyError(res.error)));
  const { job, moves, indents } = res.data;
  const parts = moves.reduce((a, m) => a + (m.line_total || 0), 0);
  const redo = () => ctx.rerender();
  const act = async (fn, msg) => { const r = await fn(); if (r.error) { toast(friendlyError(r.error), 'bad'); return; } toast(msg); redo(); };

  async function finish() {
    const saved = await openForm({ title: 'Finish job', submitLabel: 'Finish', values: { closed_on: today, odometer_km: job.odometer_km },
      fields: [{ name: 'closed_on', label: 'Finished on', type: 'date', required: true, max: today }, { name: 'labour_cost', label: 'Labour cost (₹)', type: 'number', step: '1', min: '0', inputmode: 'decimal', hint: 'Mechanic or outside workshop charges. Parts are counted from the warehouse.' },
        { name: 'odometer_km', label: 'Odometer (km)', type: 'number', step: '1', min: '0', inputmode: 'numeric' }],
      onSubmit: call((v) => ctx.api.closeJob(id, v)) });
    if (saved) { toast('Job finished'); redo(); }
  }
  async function addPart() {
    const items = check(await ctx.api.listItems());
    const saved = await openForm({ title: 'Issue a part to this job', submitLabel: 'Issue', values: { date: today },
      fields: [{ name: 'item_id', label: 'Item', type: 'select', required: true, options: [{ value: '', label: 'Choose an item' }, ...items.map((i) => ({ value: i.id, label: `${i.name} (${num(i.on_hand)} ${i.unit})` }))] },
        { name: 'qty', label: 'Quantity', type: 'number', step: '0.001', min: '0.001', inputmode: 'decimal', required: true }, { name: 'date', label: 'Date', type: 'date', required: true, max: today }],
      onSubmit: call((v) => ctx.api.issueGoods({ ...v, truck_id: job.truck_id, job_id: id })) });
    if (saved) { toast('Part issued'); redo(); }
  }

  return h('div', { class: 'stack' }, back,
    h('div', { class: 'page-head' }, h('div', { class: 'stack-sm' }, h('h1', null, `${JOB_LABEL[job.kind]}`), h('div', { class: 'cluster' }, plate(job.truck_no, true), h('span', { class: 'chip ' + (job.status === 'open' ? 'warn' : 'good') }, job.status === 'open' ? 'Open' : 'Finished')))),
    h('section', { class: 'panel' }, h('dl', { class: 'facts' },
      h('div', null, h('dt', null, 'Work'), h('dd', null, job.description)),
      h('div', null, h('dt', null, 'Came in'), h('dd', null, fmtDate(job.opened_on))),
      job.closed_on ? h('div', null, h('dt', null, 'Finished'), h('dd', null, fmtDate(job.closed_on))) : null,
      h('div', null, h('dt', null, 'Days in workshop'), h('dd', null, String(downDays(job, today)))),
      job.odometer_km != null ? h('div', null, h('dt', null, 'Odometer'), h('dd', null, num(job.odometer_km, 0) + ' km')) : null,
      job.mechanic ? h('div', null, h('dt', null, 'Showroom'), h('dd', null, job.mechanic)) : null,
      job.vendor ? h('div', null, h('dt', null, 'Outside workshop'), h('dd', null, job.vendor)) : null,
      h('div', null, h('dt', null, 'Parts from stock'), h('dd', null, inr(parts))),
      h('div', null, h('dt', null, 'Labour'), h('dd', null, inr(job.labour_cost || 0))),
      h('div', null, h('dt', null, 'Total cost'), h('dd', null, inr(parts + (job.labour_cost || 0)))))),
    h('div', { class: 'row-actions left' },
      writable && job.status === 'open' ? h('button', { class: 'btn primary', onclick: finish }, 'Finish job') : null,
      writable && job.status === 'done' ? h('button', { class: 'btn', onclick: () => act(() => ctx.api.reopenJob(id), 'Job reopened') }, 'Reopen') : null,
      canIssue && job.status === 'open' ? h('button', { class: 'btn', onclick: addPart }, 'Issue a part') : null,
      canIndent && job.status === 'open' ? h('button', { class: 'btn', onclick: async () => { if (await indentForm(ctx, { truckId: job.truck_id, jobId: id })) redo(); } }, 'Raise indent') : null,
      writable ? h('button', { class: 'btn', onclick: async () => { if (await jobForm(ctx, { job })) redo(); } }, 'Edit') : null,
      writable ? h('button', { class: 'btn', onclick: async () => {
        if (!(await confirmDialog({ title: 'Remove this job card?', message: 'Only a card with no parts issued or requested can be removed.', confirmLabel: 'Remove' }))) return;
        const r = await ctx.api.removeJob(id); if (r.error) { toast(friendlyError(r.error), 'bad'); return; } toast('Removed'); location.hash = '#/maintenance';
      } }, 'Remove') : null),
    h('section', { class: 'stack-sm' }, h('h2', null, 'Parts issued'), moves.length ? h('ul', { class: 'history' }, moves.map((m) => h('li', null, h('strong', null, `${m.item_name} x ${num(m.qty)} ${m.unit}`), h('span', { class: 'muted' }, [fmtDate(m.move_date), m.line_total != null ? inr(m.line_total) : null, m.note].filter(Boolean).join(' · '))))) : h('p', { class: 'muted' }, 'None yet.')),
    h('section', { class: 'stack-sm' }, h('h2', null, 'Indents'), indents.length ? h('ul', { class: 'history' }, indents.map((i) => h('li', null, h('strong', null, i.number), h('span', { class: 'muted' }, INDENT_STATUS[i.status])))) : h('p', { class: 'muted' }, 'None yet.')));
}

return { jobForm, maintenanceView, jobDetailView };

      i.on_hand <= 0 && i.reorder_level > 0 ? h('span', { class: 'chip bad' }, 'Out') : low(i) ? h('span', { class: 'chip warn' }, 'Low') : null,
      h('strong', null, `${num(i.on_hand)} ${i.unit}`)))));
    if (!shown.length) list.replaceChildren(h('li', null, emptyState(items.length ? 'No items match' : 'No items yet', writable && !items.length ? 'Add the first item.' : '')));
    feed.replaceChildren(...recent.slice(0, 30).map((m) => h('li', null, h('div', { class: 'row' },
      h('div', { class: 'grow' }, h('div', { class: 'title' }, `${MOVE_LABEL[m.kind]}: ${m.item_name}`),
        h('div', { class: 'detail' }, [fmtDate(m.move_date), m.vendor_name, m.truck_no, m.note].filter(Boolean).join(' · '))),
      h('strong', null, `${m.kind === 'ISSUE' ? '-' : m.qty > 0 ? '+' : ''}${num(m.qty)} ${m.unit}`)))));
    if (!recent.length) feed.replaceChildren(h('li', null, emptyState('Nothing moved in 30 days', '')));
  }

  const refresh = async (p) => { if (await p) await load(); };
  group.addEventListener('change', draw);
  search.addEventListener('input', draw);
  await load();
  return h('div', { class: 'stack' },
    h('div', { class: 'page-head' }, h('div', null, h('h1', null, 'Warehouse'), count)),
    writable ? h('div', { class: 'row-actions left' },
      h('button', { class: 'btn primary', onclick: () => refresh(forms.receive()) }, 'Receive goods'),
      h('button', { class: 'btn', onclick: () => refresh(forms.issue()) }, 'Issue goods'),
      h('button', { class: 'btn', onclick: () => refresh(forms.count()) }, 'Count stock'),
      h('button', { class: 'btn', onclick: () => refresh(forms.itemForm()) }, 'Add item')) : null,
    tiles, h('div', { class: 'toolbar' }, search, group), list,
    h('section', { class: 'stack-sm' }, h('h2', null, 'Last 30 days'), feed));
}

return { warehouseView };
})();

// ---- main.js ----
(() => {
const { loadApi, demoMode, friendlyError, ROLE_LABEL } = __m_api;
const { logo } = __m_logo;
const { h, icon, toast } = __m_ui;
const { dashboardView } = __m_dashboard;
const { trucksView, truckDetailView } = __m_trucks;
const { driversView } = __m_drivers;
const { attendanceView } = __m_attendance;
const { fuelView } = __m_fuel;
const { tripsView, tripDetailView } = __m_tripsview;
const { tyresView } = __m_tyres;
const { canOpenPage } = __m_access;
const { warehouseView } = __m_warehouse;
const { creditorsView, creditorDetailView } = __m_creditors;
const { maintenanceView, jobDetailView } = __m_maintenance;
const { indentsView } = __m_indents;
const { tyreShopView } = __m_tyreshop;
const { cashbookView } = __m_cashbook;
const { expensesView } = __m_expenses;
const { receivablesView, receivableDetailView } = __m_receivables;
const { gstView } = __m_gst;
const { staffView, staffDetailView } = __m_hrstaff;
const { staffAttendanceView } = __m_hrattendance;
const { payrollView } = __m_payroll;

const { MODULES } = __m_modules;
const cfg = window.FLEET_CONFIG || {};
const appName = cfg.appName || 'Swapneswar Roadlines';
const root = document.getElementById('app');
const BUILD = '28 Nov 12:51'; // replaced with the build time by tools/build_single.py

const OFFICE = ['admin', 'owner', 'manager', 'accountant'];
const SHOP = ['store_keeper', 'mechanic'];
const ALL = ['admin', 'owner', 'manager', 'accountant', 'store_keeper', 'mechanic', 'driver'];

// One table drives both the menu and the route guard.
const ROUTES = [
  { path: '/', label: 'Home', icon: 'home', roles: ALL, match: /^\/$/, render: (ctx) => dashboardView(ctx) },
  { path: '/trucks', page: 'trucks', label: 'Trucks', icon: 'truck', roles: [...OFFICE, ...SHOP], match: /^\/trucks$/, render: (ctx) => trucksView(ctx) },
  { path: '/trucks/:id', page: 'trucks', roles: [...OFFICE, ...SHOP], match: /^\/trucks\/([\w-]+)$/, render: (ctx, id) => truckDetailView(ctx, id) },
  { path: '/drivers', page: 'drivers', label: 'Drivers', icon: 'user', roles: OFFICE, match: /^\/drivers$/, render: (ctx) => driversView(ctx) },
  { path: '/attendance', page: 'attendance', label: 'Attendance', icon: 'calendar', roles: OFFICE, match: /^\/attendance$/, render: (ctx) => attendanceView(ctx) },
  { path: '/fuel', page: 'fuel', label: 'Fuel', icon: 'fuel', roles: [...OFFICE, 'store_keeper'], match: /^\/fuel$/, render: (ctx) => fuelView(ctx) },
  { path: '/trips', page: 'trips', label: 'Trips', icon: 'route', roles: OFFICE, match: /^\/trips$/, render: (ctx) => tripsView(ctx) },
  { path: '/trips/:id', page: 'trips', roles: OFFICE, match: /^\/trips\/([\w-]+)$/, render: (ctx, id) => tripDetailView(ctx, id) },
  { path: '/tyres', page: 'tyres', label: 'Tyres', icon: 'tyre', roles: [...OFFICE, ...SHOP], match: /^\/tyres$/, render: (ctx) => tyresView(ctx) },
  { path: '/tyreshop', page: 'tyreshop', label: 'Tyre shop', icon: 'wrench', roles: [...OFFICE, ...SHOP], match: /^\/tyreshop$/, render: (ctx) => tyreShopView(ctx) },
  { path: '/warehouse', page: 'warehouse', label: 'Warehouse', icon: 'box', roles: [...OFFICE, 'store_keeper'], match: /^\/warehouse$/, render: (ctx) => warehouseView(ctx) },
  { path: '/creditors', page: 'creditors', label: 'Creditors', icon: 'rupee', roles: OFFICE, match: /^\/creditors$/, render: (ctx) => creditorsView(ctx) },
  { path: '/creditors/:id', page: 'creditors', roles: OFFICE, match: /^\/creditors\/([\w-]+)$/, render: (ctx, id) => creditorDetailView(ctx, id) },
  { path: '/maintenance', page: 'maintenance', label: 'Maintenance', icon: 'clipboard', roles: [...OFFICE, ...SHOP], match: /^\/maintenance$/, render: (ctx) => maintenanceView(ctx) },
  { path: '/maintenance/:id', page: 'maintenance', roles: [...OFFICE, ...SHOP], match: /^\/maintenance\/([\w-]+)$/, render: (ctx, id) => jobDetailView(ctx, id) },
  { path: '/indents', page: 'indents', label: 'Indents', icon: 'list', roles: [...OFFICE, ...SHOP], match: /^\/indents$/, render: (ctx) => indentsView(ctx) },
  { path: '/earthmovers', page: 'earthmovers', label: 'Earth movers', icon: 'truck', roles: ['admin', 'owner', 'manager'], match: /^\/earthmovers$/, render: (ctx) => machinesView('earth')(ctx) },
  { path: '/earthmovers/:id', page: 'earthmovers', roles: ['admin', 'owner', 'manager'], match: /^\/earthmovers\/([\w-]+)$/, render: (ctx, id) => machineDetailView('earth')(ctx, id) },
  { path: '/personal', page: 'personal', label: 'Personal vehicles', icon: 'truck', roles: ['admin', 'owner'], match: /^\/personal$/, render: (ctx) => machinesView('personal')(ctx) },
  { path: '/personal/:id', page: 'personal', roles: ['admin', 'owner'], match: /^\/personal\/([\w-]+)$/, render: (ctx, id) => machineDetailView('personal')(ctx, id) },
  { path: '/places', page: 'places', label: 'Places and lists', icon: 'tag', roles: ['admin', 'owner'], match: /^\/places$/, render: (ctx) => placesView(ctx) },
  { path: '/cashbook', page: 'cashbook', label: 'Cash book', icon: 'book', roles: ['admin', 'owner', 'accountant'], match: /^\/cashbook$/, render: (ctx) => cashbookView(ctx) },
  { path: '/expenses', page: 'expenses', label: 'Expenses', icon: 'tag', roles: OFFICE, match: /^\/expenses$/, render: (ctx) => expensesView(ctx) },
  { path: '/receivables', page: 'receivables', label: 'Customers', icon: 'receipt', roles: ['admin', 'owner', 'accountant'], match: /^\/receivables$/, render: (ctx) => receivablesView(ctx) },
  { path: '/receivables/:id', page: 'receivables', roles: ['admin', 'owner', 'accountant'], match: /^\/receivables\/([\w-]+)$/, render: (ctx, id) => receivableDetailView(ctx, id) },
  { path: '/gst', page: 'gst', label: 'GST', icon: 'percent', roles: ['admin', 'owner', 'accountant'], match: /^\/gst$/, render: (ctx) => gstView(ctx) },
  { path: '/staff', page: 'staff', label: 'Staff', icon: 'users', roles: ['admin', 'owner', 'accountant'], match: /^\/staff$/, render: (ctx) => staffView(ctx) },
  { path: '/staff/:id', page: 'staff', roles: ['admin', 'owner', 'accountant'], match: /^\/staff\/([\w-]+)$/, render: (ctx, id) => staffDetailView(ctx, id) },
  { path: '/staffatt', page: 'staffatt', label: 'Staff days', icon: 'calendar', roles: ['admin', 'owner', 'accountant'], match: /^\/staffatt$/, render: (ctx) => staffAttendanceView(ctx) },
  { path: '/payroll', page: 'payroll', label: 'Salary', icon: 'rupee', roles: ['admin', 'owner', 'accountant'], match: /^\/payroll$/, render: (ctx) => payrollView(ctx) },
  { path: '/staffadv', page: 'staffadv', label: 'Advances', icon: 'receipt', roles: ['admin', 'owner', 'accountant'], match: /^\/staffadv$/, render: (ctx) => advancesView(ctx) },
  { path: '/modules', label: 'All pages', icon: 'grid', roles: ['admin'], match: /^\/modules$/, render: (ctx) => modulesView(ctx) },
  { path: '/settings', label: 'Settings', icon: 'users', pcOnly: true, roles: ['admin'], match: /^\/settings$/, render: (ctx) => usersView(ctx) },
  { path: '/m/:id', roles: ['admin'], match: /^\/m\/([\w-]+)$/, render: (ctx, id) => moduleStubView(ctx, id) },
];

let api = null;
let profile = null;
let view = null;
// The side menu is grouped by department. A group with one visible page is shown as a plain link.
const GROUPS = [
  { id: 'fleet', label: 'Fleet', icon: 'truck', paths: ['/trucks', '/earthmovers', '/personal', '/drivers', '/attendance', '/fuel', '/trips', '/places'] },
  { id: 'workshop', label: 'Workshop', icon: 'wrench', paths: ['/maintenance', '/tyres', '/tyreshop', '/indents'] },
  { id: 'stores', label: 'Stores', icon: 'box', paths: ['/warehouse', '/creditors'] },
  { id: 'accounts', label: 'Accounts', icon: 'rupee', paths: ['/cashbook', '/expenses', '/receivables', '/gst'] },
  { id: 'hr', label: 'HR', icon: 'users', paths: ['/staff', '/staffatt', '/payroll', '/staffadv'] },
];
const isWide = () => window.matchMedia('(min-width: 900px)').matches;
const closeGroups = (except) => { for (const d of navEl.querySelectorAll('details.nav-group')) if (d !== except) d.open = false; };
let navEl = null;
let routeToken = 0;

boot();

async function boot() {
  document.title = appName;
  let loaded;
  try {
    loaded = await loadApi();
  } catch (e) {
    return renderMessage('Could not start the app', friendlyError(e), [h('button', { class: 'btn primary', onclick: () => location.reload() }, 'Try again')]);
  }
  if (!loaded.ready) return renderSetup();
  api = loaded.api;
  if (api.onBackgroundError) api.onBackgroundError((e) => toast(friendlyError(e), 'bad'));
  if (api.onQueued) api.onQueued(() => toast('No signal. Saved on this phone, it will upload when you are online.'));
  api.onAuthChange((session) => { if (!session && profile) { profile = null; start(); } });
  window.addEventListener('hashchange', () => route());
  await start();
}

async function start() {
  const session = await api.getSession();
  if (!session) return renderLogin();
  try {
    profile = await api.getProfile();
  } catch (e) {
    return renderMessage('Could not load your account', friendlyError(e), [h('button', { class: 'btn primary', onclick: () => location.reload() }, 'Try again')]);
  }
  if (!profile || !profile.active) return renderPending();
  renderShell();
  if (api.ensureSetup) api.ensureSetup();
  registerServiceWorker();
  route();
}

// ------------------------------------------------------------------ screens
function renderMessage(title, text, actions) {
  root.replaceChildren(h('div', { class: 'auth' }, h('div', { class: 'panel' }, h('h1', null, title), h('p', null, text), h('div', { class: 'cluster' }, actions || []))));
}

function renderSetup() {
  renderMessage('Connect a database to start',
    'This copy of the app is not connected to Firebase yet. Add your Firebase settings to config.js, then reload. The README has the steps.',
    [h('a', { class: 'btn primary', href: '?demo' }, 'Try the demo with sample data')]);
}

function renderPending() {
  renderMessage('Waiting for approval',
    'Your login works, but the owner has not switched on your account yet. Ask the owner to activate it, then reload this page.',
    [h('button', { class: 'btn primary', onclick: () => location.reload() }, 'Reload'),
      h('button', { class: 'btn', onclick: signOut }, 'Sign out')]);
}

function renderLogin() {
  const error = h('div', { class: 'form-error', role: 'alert', hidden: true });
  const email = h('input', { id: 'email', type: 'text', required: true, autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false' });
  const password = h('input', { id: 'password', type: 'password', required: true, autocomplete: 'current-password' });
  const submit = h('button', { class: 'btn primary', type: 'submit' }, 'Sign in');
  const form = h('form', { class: 'stack' },
    h('div', { class: 'login-logo' }, logo(true)),
    h('h1', null, appName),
    error,
    h('div', { class: 'field' }, h('label', { for: 'email' }, 'User name, email or phone'), email),
    h('div', { class: 'field' }, h('label', { for: 'password' }, 'Password'), password),
    submit);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    error.hidden = true;
    submit.disabled = true;
    submit.textContent = 'Signing in…';
    const { error: err, defaultPassword } = await api.signIn(email.value.trim(), password.value);
    if (err) {
      error.textContent = /invalid login/i.test(err.message) ? 'Email or password is wrong.' : friendlyError(err);
      error.hidden = false;
      submit.disabled = false;
      submit.textContent = 'Sign in';
      return;
    }
    if (defaultPassword) toast('You are using the starting password. Open Settings and change it now.', 'bad');
    start();
  });
  root.replaceChildren(h('div', { class: 'auth' }, h('div', { class: 'panel' }, form)));
  email.focus();
}

async function signOut() {
  await api.signOut();
  profile = null;
  start();
}

function renderShell() {
  const items = ROUTES.filter((r) => r.label && r.roles.includes(profile.role) && canOpenPage(profile, r.page));
  // Pages that are planned but not built show in the side menu on a PC only.
  const planned = MODULES.filter((m) => m.status !== 'built' && m.roles.includes(profile.role));
  const link = (r) => h('a', { href: '#' + r.path, 'data-path': r.path, class: r.pcOnly ? 'pc-only' : null }, icon(r.icon), r.label);
  const grouped = new Set(GROUPS.flatMap((g) => g.paths));
  const parts = [items.filter((r) => r.path === '/').map(link)];
  for (const g of GROUPS) {
    const mine = g.paths.map((p) => items.find((r) => r.path === p)).filter(Boolean);
    if (mine.length === 1) parts.push(link(mine[0]));
    else if (mine.length) {
      const saved = (() => { try { return JSON.parse(localStorage.getItem('fleet.nav') || '[]'); } catch { return []; } })();
      const det = h('details', { class: 'nav-group', 'data-group': g.id, open: isWide() && saved.includes(g.id) },
        h('summary', null, icon(g.icon), h('span', null, g.label), icon('chev')), h('div', { class: 'group-links' }, mine.map(link)));
      det.addEventListener('toggle', () => {
        if (!isWide()) { if (det.open) closeGroups(det); return; }
        try { localStorage.setItem('fleet.nav', JSON.stringify([...navEl.querySelectorAll('details.nav-group[open]')].map((d) => d.dataset.group))); } catch { /* storage may be blocked */ }
      });
      parts.push(det);
    }
  }
  parts.push(items.filter((r) => r.path !== '/' && !grouped.has(r.path)).map(link));
  navEl = h('nav', { class: 'nav', 'aria-label': 'Main' }, parts,
    planned.length ? h('div', { class: 'nav-heading' }, 'Coming later') : null,
    planned.map((m) => h('a', { class: 'planned', href: '#/m/' + m.id, 'data-path': '/m/' + m.id },
      h('span', { class: 'modno' }, m.no), m.title)));
  // On a phone a group opens as a small panel; tap anywhere else to close it.
  document.addEventListener('click', (e) => { if (navEl && !isWide() && !e.target.closest('.nav-group')) closeGroups(); });

  const banner = h('div', { class: 'banner', role: 'status', hidden: true });
  const syncBanner = () => {
    if (demoMode) { banner.textContent = 'Demo mode. This is sample data and nothing is saved.'; banner.hidden = false; }
    else if (!navigator.onLine) { banner.textContent = 'You are offline. Changes cannot be saved until you reconnect.'; banner.hidden = false; }
    else banner.hidden = true;
  };
  window.addEventListener('online', syncBanner);
  window.addEventListener('offline', syncBanner);
  syncBanner();

  view = h('div', { id: 'view' });
  root.replaceChildren(h('div', { class: 'shell' },
    h('header', { class: 'topbar' },
      h('span', { class: 'brand' }, logo(true), h('span', { class: 'name' }, appName)),
      h('div', { class: 'who' },
        h('span', null, `${profile.full_name}, ${ROLE_LABEL[profile.role] || profile.role}`),
        h('button', { class: 'btn small', onclick: signOut }, demoMode ? 'Leave demo' : 'Sign out'))),
    navEl,
    h('main', { class: 'main', id: 'main', tabindex: '-1' }, banner, view, h('p', { class: 'build' }, 'Version ' + BUILD))));
}

// ------------------------------------------------------------------ router
function find(path) {
  for (const r of ROUTES) {
    const m = r.match.exec(path);
    if (m) return { route: r, params: m.slice(1) };
  }
  return null;
}

async function route(keepScroll) {
  if (!profile || !view) return;
  const path = location.hash.replace(/^#/, '') || '/';
  const found = find(path);
  if (!found || !found.route.roles.includes(profile.role) || !canOpenPage(profile, found.route.page)) { location.hash = '#/'; return; }

  const token = ++routeToken;
  for (const a of navEl.querySelectorAll('a')) {
    const p = a.dataset.path;
    const on = p === '/' ? path === '/' : path === p || path.startsWith(p + '/');
    if (on) { a.setAttribute('aria-current', 'page'); if (a.scrollIntoView && !a.closest('details')) a.scrollIntoView({ block: 'nearest', inline: 'center' }); } else a.removeAttribute('aria-current');
  }
  for (const d of navEl.querySelectorAll('details.nav-group')) {
    const here = !!d.querySelector('a[aria-current="page"]');
    d.classList.toggle('current', here);
    if (isWide()) { if (here) d.open = true; } else { d.open = false; if (here && d.scrollIntoView) d.scrollIntoView({ block: 'nearest', inline: 'center' }); }
  }

  const ctx = {
    api, profile,
    canWrite: ['admin', 'owner', 'manager'].includes(profile.role),
    nav: (p) => { location.hash = '#' + p; },
    rerender: () => route(true),
  };
  const y = window.scrollY;
  if (!keepScroll) view.replaceChildren(h('div', { class: 'spinner' }, logo(true), 'Loading…'));
  try {
    const node = await found.route.render(ctx, ...found.params);
    if (token !== routeToken) return;
    view.replaceChildren(node);
    document.title = (found.route.label ? found.route.label + ' - ' : '') + appName;
  } catch (e) {
    if (token !== routeToken) return;
    console.error(e);
    view.replaceChildren(h('div', { class: 'stack' },
      h('div', { class: 'form-error', role: 'alert' }, friendlyError(e)),
      h('div', null, h('button', { class: 'btn', onclick: () => route() }, 'Try again'))));
  }
  window.scrollTo(0, keepScroll ? y : 0);
}

// ------------------------------------------------------------------ offline shell
function registerServiceWorker() {
  return; // single-file build has no service worker
  if (demoMode || !('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  navigator.serviceWorker.register('sw.js').catch(() => toast('Offline mode could not be set up.', 'bad'));
}

})();
  </script>
