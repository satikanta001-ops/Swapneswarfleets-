  <style>
/* Fleet ERP - styles
   Built for phones used outdoors: high contrast, big tap targets, no dark
   theme. The one loud element is the number plate; everything else is quiet. */

:root {
  --ground: #e9ecef;
  --surface: #ffffff;
  --ink: #1e2a33;
  --ink-soft: #52606b;
  --line: #cbd3da;
  --plate: #f5c400;
  --plate-ink: #14191f;
  --bad: #a8221a;
  --bad-bg: #fbe6e3;
  --warn: #6b4500;
  --warn-bg: #fdf0c4;
  --good: #176b3f;
  --good-bg: #e0f1e7;
  --focus: #0b57d0;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Oriya", "Noto Sans Devanagari", sans-serif;
  --nav-h: 64px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font: 16px/1.5 var(--font);
  color: var(--ink);
  background: var(--ground);
}
h1, h2, h3 { line-height: 1.2; margin: 0; font-weight: 750; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.shell { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
  background: var(--ink); color: #fff;
}
.brand { font-weight: 800; font-size: 1.05rem; letter-spacing: .01em; }
.who { display: flex; align-items: center; gap: 10px; font-size: .9rem; min-width: 0; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
.topbar .btn { min-height: 36px; padding: 4px 12px; background: transparent; color: #fff; border-color: #6c7a86; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface); border-top: 1px solid var(--line);
}
.nav a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  text-decoration: none; font-size: .78rem; font-weight: 600; color: var(--ink-soft);
  border-top: 4px solid transparent;
}
.nav a svg { width: 24px; height: 24px; }
.nav a[aria-current="page"] { color: var(--ink); border-top-color: var(--plate); }

.main { padding: 20px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom)); max-width: 980px; width: 100%; margin: 0 auto; }
.main:focus { outline: none; }

@media (min-width: 900px) {
  .shell { grid-template-columns: 220px 1fr; grid-template-rows: auto 1fr; }
  .topbar { grid-column: 1 / -1; }
  .nav {
    position: static; grid-row: 2; grid-column: 1; height: auto; padding: 16px 12px;
    display: flex; flex-direction: column; gap: 4px; border-top: 0; border-right: 1px solid var(--line);
    align-self: stretch;
  }
  .nav a { flex-direction: row; justify-content: flex-start; gap: 12px; font-size: 1rem; padding: 10px 12px; border-top: 0; border-left: 4px solid transparent; border-radius: 6px; }
  .nav a[aria-current="page"] { background: var(--ground); border-left-color: var(--plate); }
  .main { grid-row: 2; grid-column: 2; padding-bottom: 48px; margin: 0; }
  .who span { max-width: 300px; }
}

/* ---------- page furniture ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.page-head .sub { color: var(--ink-soft); margin-top: 4px; }
.stack { display: grid; gap: 16px; }
.stack-sm { display: grid; gap: 8px; }
.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.muted { color: var(--ink-soft); }
.back { display: inline-block; margin-bottom: 12px; color: var(--ink-soft); text-decoration: none; font-weight: 600; }
.back:hover { text-decoration: underline; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.panel > h2 { margin-bottom: 12px; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 28px 16px; text-align: center; color: var(--ink-soft); }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; font-size: 1.05rem; }

.banner { background: var(--warn-bg); color: var(--warn); padding: 8px 16px; font-weight: 600; text-align: center; }
.main > .banner { margin-bottom: 16px; border-radius: 8px; }

/* ---------- plate: the one loud thing ---------- */
.plate {
  display: inline-block; white-space: nowrap;
  background: var(--plate); color: var(--plate-ink);
  font-weight: 800; letter-spacing: .08em; font-variant-numeric: tabular-nums;
  padding: .16em .55em; border-radius: 6px;
  border: 2px solid var(--plate-ink);
  box-shadow: inset 0 0 0 2px var(--plate), inset 0 0 0 3px rgba(20, 25, 31, .5);
}
.plate.big { font-size: 1.9rem; padding: .12em .5em; }

/* ---------- buttons and form controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 16px; border-radius: 8px;
  border: 2px solid var(--ink); background: var(--surface); color: var(--ink);
  font-weight: 700; cursor: pointer; text-decoration: none;
}
.btn:hover { background: #f3f5f7; }
.btn.primary { background: var(--ink); color: #fff; }
.btn.primary:hover { background: #2b3a46; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: .92rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.field { display: grid; gap: 4px; }
.field label { font-weight: 650; }
.field .hint { color: var(--ink-soft); font-size: .88rem; }
input[type="text"], input[type="email"], input[type="password"], input[type="tel"],
input[type="date"], input[type="number"], input[type="search"], select, textarea {
  width: 100%; min-height: 44px; padding: 8px 12px;
  border: 2px solid var(--line); border-radius: 8px; background: #fff;
}
textarea { min-height: 88px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--ink); }
.form-error { background: var(--bad-bg); color: var(--bad); padding: 10px 12px; border-radius: 8px; font-weight: 600; }
.form-grid { display: grid; gap: 14px; }
@media (min-width: 560px) { .form-grid.two { grid-template-columns: 1fr 1fr; } }

/* ---------- chips ---------- */
.chip { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .85rem; font-weight: 700; white-space: nowrap; }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); box-shadow: inset 0 0 0 1px #d9b13a; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.muted { background: #e3e7ea; color: var(--ink-soft); }

/* ---------- lists ---------- */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; text-decoration: none; color: inherit; min-height: 56px;
}
a.row:hover, button.row:hover { border-color: var(--ink); }
button.row { width: 100%; text-align: left; cursor: pointer; font: inherit; }
.row .grow { flex: 1 1 160px; min-width: 0; }
.row .title { font-weight: 700; }
.row .detail { color: var(--ink-soft); font-size: .92rem; }

.group-title { display: flex; align-items: baseline; gap: 10px; margin: 8px 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.toolbar input[type="search"] { flex: 1 1 200px; }
.toolbar select { flex: 0 1 180px; }
.toolbar.datebar { flex-wrap: nowrap; }
.toolbar.datebar input[type="date"] { flex: 1 1 auto; min-width: 0; }

/* ---------- document status table on truck page ---------- */
.doc-list { list-style: none; margin: 0; padding: 0; }
.doc-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.doc-list li:first-child { border-top: 0; padding-top: 0; }
.doc-list .what { flex: 1 1 180px; min-width: 0; }
.doc-list .what strong { display: block; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
.kv dt { color: var(--ink-soft); }
.kv dd { margin: 0; font-weight: 600; }

/* ---------- attendance ---------- */
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; }
.seg button {
  min-height: 44px; min-width: 64px; padding: 6px 10px; border: 0; background: var(--surface);
  font-weight: 700; cursor: pointer; border-left: 1px solid var(--line);
}
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.seg button[aria-pressed="true"][data-status="absent"] { background: var(--bad); }
.seg button[disabled] { cursor: default; }
.att-row { flex-wrap: wrap; }
.att-row .seg { margin-left: auto; }

/* ---------- dialog ---------- */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); color: var(--ink); box-shadow: 0 20px 60px rgba(20, 25, 31, .35); }
dialog::backdrop { background: rgba(20, 25, 31, .55); }
dialog form { display: grid; gap: 16px; padding: 20px 20px 16px; }
dialog .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
dialog .actions .spacer { margin-right: auto; }

/* ---------- auth screens ---------- */
.auth { min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
.auth .panel { width: min(420px, 100%); display: grid; gap: 16px; padding: 24px; }
.auth h1 { font-size: 1.5rem; }

/* ---------- toasts ---------- */
#toasts { position: fixed; left: 12px; right: 12px; bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom)); z-index: 60; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.toast { background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; font-weight: 600; max-width: 480px; pointer-events: auto; }
.toast.bad { background: var(--bad); }
@media (min-width: 900px) { #toasts { bottom: 16px; justify-items: end; } }

.spinner { padding: 32px 0; text-align: center; color: var(--ink-soft); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- skeleton pages ---------- */
.modno { min-width: 2.2em; font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.plain { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.source { margin: 0; padding: 12px 16px; border-left: 4px solid var(--plate); background: var(--surface); border-radius: 0 10px 10px 0; }
.source p { font-weight: 650; }
.source footer { color: var(--ink-soft); font-size: .88rem; margin-top: 4px; }
.nav .nav-heading, .nav a.planned { display: none; }

@media (min-width: 900px) {
  .nav .nav-heading { display: block; margin: 16px 12px 4px; color: var(--ink-soft); font-size: .85rem; font-weight: 700; }
  .nav a.planned { display: flex; font-size: .92rem; font-weight: 500; padding: 6px 12px; gap: 10px; }
  .nav a.planned .modno { min-width: 1.8em; }
}
@media (min-width: 1200px) {
  .main { max-width: 1120px; }
}

@media (max-width: 420px) {
  .nav a { font-size: .7rem; }
}

/* ---------- document files ---------- */
.doc-list .btns { display: flex; flex-wrap: wrap; gap: 8px; }
dialog.file-view { width: min(720px, calc(100vw - 24px)); }
.file-box { display: grid; gap: 14px; padding: 20px; }
.file-img { max-width: 100%; max-height: 60dvh; object-fit: contain; justify-self: center; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.file-box .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

.slots { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--ground); }
.slot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.slot .what { flex: 1 1 160px; min-width: 0; display: grid; }

.truck-item { display: grid; gap: 6px; }
.truck-item .assign-btn { justify-self: end; }
.driver-line { color: var(--ink-soft); }

.row-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.history { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
.history li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line, #d5dadf); }
.history li strong { min-width: 8em; }

.att-truck { margin-top: 4px; }
.att-truck .plate { font-size: .85rem; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { display: grid; gap: 2px; padding: 10px 12px; background: var(--panel, #fff); border: 1px solid var(--line, #d5dadf); border-radius: 10px; min-width: 0; }
.tile strong { font-size: 1.15rem; }
@media (max-width: 420px) { .nav a { font-size: .68rem; } .tiles { gap: 6px; } .tile { padding: 8px; } .tile strong { font-size: 1rem; } }

.doc-list .fuel-what { display: grid; gap: 4px; justify-items: start; }

.nav a.pc-only { display: none; }
@media (min-width: 900px) { .nav a.pc-only { display: flex; } }

.facts { display: grid; gap: 4px; margin: 0 0 12px; }
.facts > div { display: flex; flex-wrap: wrap; gap: 2px 12px; padding: 4px 0; border-bottom: 1px solid var(--line, #d5dadf); }
.facts dt { min-width: 9em; color: var(--ink-soft); }
.facts dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.between { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
dialog .actions.wrap .btn { flex: 0 1 auto; }
dialog h3 { margin: 12px 0 4px; font-size: 1rem; }

  </style>

  return `${n} ${Math.abs(n) === 1 ? one : (many || one + 's')}`;
}

// ---------- domain bits ----------
function plate(no, big) {
  const m = /^([A-Z]{2})(\d{1,2})([A-Z]{1,3})(\d{4})$/.exec(no || '');
  const text = m ? `${m[1]} ${m[2]} ${m[3]} ${m[4]}` : (no || '');

}

// status values come from the database view: missing | expired | due_soon | ok | no_expiry
function docChip(row) {
  switch (row.status) {
    case 'expired': return h('span', { class: 'chip bad' }, row.days_left === -1 ? 'Expired yesterday' : `Expired ${plural(-row.days_left, 'day')} ago`);
    case 'due_soon': return h('span', { class: 'chip warn' }, row.days_left === 0 ? 'Expires today' : `Expires in ${plural(row.days_left, 'day')}`);
    case 'missing': return h('span', { class: 'chip bad' }, 'Not recorded');
    case 'no_expiry': return h('span', { class: 'chip muted' }, 'No expiry date');

// ---------- dialogs ----------
// fields: [{ name, label, type, required, options, hint, maxlength, pattern, inputmode, step, min, autocomplete }]
// Resolves when the dialog closes: 'saved', 'extra' (the extra button succeeded) or false.
// onSubmit(values) returns { error } to keep it open.
function openForm({ title, fields, values = {}, submitLabel = 'Save', onSubmit, extra, intro }) {
  return new Promise((resolve) => {
    const dlg = h('dialog', { 'aria-labelledby': 'dlg-title' });
    const errorBox = h('div', { class: 'form-error', role: 'alert', hidden: true });
    const inputs = {};

    const fieldEls = fields.map((f) => {
      const id = 'f-' + f.name;
      let input;
      const cur = values[f.name] ?? f.default ?? '';
      if (f.type === 'select') {
        input = h('select', { id, name: f.name, required: f.required },
          (f.required ? [] : [h('option', { value: '' }, 'Not set')]),
          f.options.map((o) => h('option', { value: o.value, selected: String(o.value) === String(cur) }, o.label)));
      } else if (f.type === 'file') {
        input = h('input', { id, name: f.name, type: 'file', accept: f.accept || 'image/*,application/pdf', required: f.required });
      } else if (f.type === 'textarea') {
        input = h('textarea', { id, name: f.name, maxlength: f.maxlength || 500 }, cur);
      } else {
        input = h('input', {
          id, name: f.name, type: f.type || 'text', required: f.required, value: cur,
          maxlength: f.maxlength, pattern: f.pattern, inputmode: f.inputmode, step: f.step, min: f.min,
          autocomplete: f.autocomplete || 'off', autocapitalize: f.autocapitalize,
        });
      }
      inputs[f.name] = input;
      return h('div', { class: 'field' },
        h('label', { for: id }, f.label + (f.required ? '' : ' (optional)')),
        input,
        f.hint ? h('span', { class: 'hint' }, f.hint) : null);
    });

    const submit = h('button', { type: 'submit', class: 'btn primary' }, submitLabel);
    const cancel = h('button', { type: 'button', class: 'btn', onclick: () => dlg.close() }, 'Cancel');

    const form = h('form', { method: 'dialog', novalidate: false },
      h('h2', { id: 'dlg-title' }, title),
      errorBox,
      intro || null,
      h('div', { class: 'form-grid' + (fields.length > 4 ? ' two' : '') }, fieldEls),
      h('div', { class: 'actions' },
        extra ? h('button', {
          type: 'button', class: 'btn danger spacer',
          onclick: async () => {
            const res = await extra.onClick();
            if (res && res.error) showError(res.error); else dlg.close('extra');
          },
        }, extra.label) : null,
        cancel, submit));

    function showError(msg) { errorBox.textContent = msg; errorBox.hidden = false; }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.hidden = true;
      const out = {};
      for (const f of fields) {
        if (f.type === 'file') { out[f.name] = inputs[f.name].files[0] || null; continue; }
        const raw = inputs[f.name].value.trim();
        if (raw === '') out[f.name] = null;
        else if (f.type === 'number') out[f.name] = Number(raw);
        else out[f.name] = raw;
      }
      submit.disabled = true;
      submit.textContent = 'Saving…';
      try {
        const res = await onSubmit(out);
        if (res && res.error) { showError(res.error); return; }
        dlg.close('saved');
      } finally {
        submit.disabled = false;
        submit.textContent = submitLabel;
      }
    });

    dlg.append(form);
    dlg.addEventListener('close', () => {
      const rv = dlg.returnValue;
      dlg.remove();
      resolve(rv === 'saved' || rv === 'extra' ? rv : false);
    });
    document.body.append(dlg);
    dlg.showModal();
    const first = dlg.querySelector('input, select, textarea');
    if (first) first.focus();
  });
}

function confirmDialog({ title, message, confirmLabel = 'Confirm', danger = true }) {

    dlg.append(h('form', { method: 'dialog' },
      h('h2', { id: 'dlg-title' }, title),
      h('p', null, message),
      h('div', { class: 'actions' },
        h('button', { type: 'submit', value: 'no', class: 'btn' }, 'Cancel'),
        h('button', { type: 'submit', value: 'yes', class: 'btn ' + (danger ? 'danger' : 'primary') }, confirmLabel))));
    dlg.addEventListener('close', () => { const yes = dlg.returnValue === 'yes'; dlg.remove(); resolve(yes); });
    document.body.append(dlg);
    dlg.showModal();
  });
}

// A read-only popup with a Close button.
function showInfo({ title, body }) {
  return new Promise((resolve) => {
    const dlg = h('dialog', { 'aria-labelledby': 'dlg-title', class: 'info' });
    dlg.append(h('form', { method: 'dialog' },
      h('h2', { id: 'dlg-title' }, title), body,
      h('div', { class: 'actions' }, h('button', { type: 'submit', class: 'btn primary' }, 'Close'))));
    dlg.addEventListener('close', () => { dlg.remove(); resolve(); });
    document.body.append(dlg);
    dlg.showModal();
  });
}

function emptyState(title, text, action) {
  return h('div', { class: 'empty' }, h('strong', null, title), text ? h('p', null, text) : null, action || null);
}

const __m_tyrelogic = (() => {
// Shared by the real and demo backends and the screens: what a tyre, tube or flap record holds,
// the checks on it, and the figures worked out from it (age, km run, cost per km).

const KINDS = [
  { value: 'TYRE', label: 'Tyre' }, { value: 'TUBE', label: 'Tube' }, { value: 'FLAP', label: 'Flap' },
];
const KIND_LABEL = Object.fromEntries(KINDS.map((k) => [k.value, k.label]));

const POSITIONS = [
  'Front left', 'Front right',
  'Rear 1 left outer', 'Rear 1 left inner', 'Rear 1 right inner', 'Rear 1 right outer',
  'Rear 2 left outer', 'Rear 2 left inner', 'Rear 2 right inner', 'Rear 2 right outer',
  'Rear 3 left outer', 'Rear 3 left inner', 'Rear 3 right inner', 'Rear 3 right outer',
  'Stepney',
];

const STATUS_LABEL = { in_stock: 'In stock', fitted: 'On a truck', scrapped: 'Scrapped' };
const EVENT_LABEL = { BOUGHT: 'Bought', FIT: 'Fitted', REMOVE: 'Removed', PUNCTURE: 'Puncture repaired', RESOLE: 'Resoled', SCRAP: 'Scrapped' };
const TYRE_WRITERS = ['admin', 'owner', 'manager', 'store_keeper', 'mechanic'];

const tyreError = (message) => Object.assign(new Error(message), { code: 'app/error' });

const DATE = /^\d{4}-\d{2}-\d{2}$/;
const text = (v, max) => { const t = String(v ?? '').trim(); return t ? t.slice(0, max) : null; };
const numOrNull = (v, what) => {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  if (!(n >= 0)) throw tyreError(`${what} is not valid.`);
  return n;
};

function needDate(v, what = 'Date') {
  if (!DATE.test(v || '')) throw tyreError(`Choose the ${what.toLowerCase()}.`);
  return v;
}

// Checks the descriptive fields typed on the "add" or "edit" form.
function cleanTyre(values) {
  if (!KINDS.some((k) => k.value === values.kind)) throw tyreError('Choose tyre, tube or flap.');
  const serial_no = String(values.serial_no ?? '').trim().toUpperCase().replace(/\s+/g, '');
  if (!serial_no || serial_no.length > 30) throw tyreError('Enter the serial number (up to 30 letters and digits).');
  const cost = numOrNull(values.cost, 'The cost');
  if (cost !== null && cost > 10000000) throw tyreError('The cost is too high.');
  const purchase_date = values.purchase_date || null;
  if (purchase_date !== null) needDate(purchase_date, 'Purchase date');
  return {
    kind: values.kind, serial_no, brand: text(values.brand, 40), size: text(values.size, 20),
    purchase_date, vendor: text(values.vendor, 80), cost, notes: text(values.notes, 500),
  };
}

const newState = () => ({
  status: 'in_stock', truck_id: null, truck_no: null, position: null, fitted_on: null, fit_km: null,
  km_run: 0, punctures: 0, resole_count: 0, repair_cost: 0, scrapped_on: null, scrap_reason: null,
});

function cleanFit(v) {
  if (!v.truck_id) throw tyreError('Choose the truck.');
  if (!POSITIONS.includes(v.position)) throw tyreError('Choose the wheel position.');
  return { truck_id: v.truck_id, position: v.position, date: needDate(v.date), odometer_km: numOrNull(v.odometer_km, 'The odometer reading') };
}
function cleanMove(v) {
  return { date: needDate(v.date), odometer_km: numOrNull(v.odometer_km, 'The odometer reading'), note: text(v.note, 200) };
}
function cleanRepair(v) {
  return { date: needDate(v.date), cost: numOrNull(v.cost, 'The cost') ?? 0, vendor: text(v.vendor, 80), note: text(v.note, 200) };
}
function cleanScrap(v) {
  return { ...cleanMove(v), reason: text(v.reason, 200) };
}

// Kilometres run on the truck since fitting, when both readings were taken.
function kmSinceFit(tyre, odometer) {
  if (odometer == null || tyre.fit_km == null) return 0;
  const km = Number(odometer) - Number(tyre.fit_km);
  return km > 0 ? km : 0;
}

// Why a fit, removal or repair cannot be done now. Returns null when it can.
function problemWith(tyre, action) {
  if (!tyre || tyre.deleted_at) return 'Not found.';
  if (tyre.status === 'scrapped') return 'This one is scrapped.';
  if (action === 'fit' && tyre.status !== 'in_stock') return 'It is already on a truck. Remove it first.';
  if (action === 'unfit' && tyre.status !== 'fitted') return 'It is not on a truck.';
  if (action === 'resole' && tyre.status !== 'in_stock') return 'Take it off the truck before resoling.';
  if (action === 'resole' && tyre.kind !== 'TYRE') return 'Only tyres are resoled.';
  if (action === 'puncture' && tyre.kind === 'FLAP') return 'A flap cannot be punctured. Use scrap if it is torn.';
  return null;
}

// Age in days since it was fitted, else since purchase; cost of the item plus repairs; cost per km once it has run.
function tyreFigures(tyre, today) {
  const since = tyre.fitted_on || tyre.purchase_date || null;
  const ageDays = since ? Math.max(0, Math.round((Date.parse(today) - Date.parse(since)) / 86400000)) : null;
  const total = (tyre.cost || 0) + (tyre.repair_cost || 0);
  const perKm = tyre.km_run > 0 && total > 0 ? total / tyre.km_run : null;
  return { ageDays, total, perKm };
}

// Tyres on one truck, keyed by position and kind.
function onTruck(tyres, truckId) {
  return tyres.filter((t) => t.status === 'fitted' && t.truck_id === truckId);
}

return { KINDS, KIND_LABEL, POSITIONS, STATUS_LABEL, EVENT_LABEL, TYRE_WRITERS, tyreError, needDate, cleanTyre, newState, cleanFit, cleanMove, cleanRepair, cleanScrap, kmSinceFit, problemWith, tyreFigures, onTruck };
})();

      const fitted_on = addDays(today, -(90 + ((ti * 10 + pi) % 7) * 30));
      const t = addTyre('TYRE', tn++, { status: 'fitted', truck_id: truck.id, truck_no: truck.truck_no, position: POSITIONS[pi], fitted_on, fit_km: 100000 + ti * 9000 });
      addEvent(t, 'FIT', fitted_on, { truck_id: truck.id, truck_no: truck.truck_no, position: POSITIONS[pi], odometer_km: t.fit_km });
      if ((ti + pi) % 4 === 0) {
        t.punctures = 1 + (pi % 3); t.repair_cost = t.punctures * 150;
        for (let k = 0; k < t.punctures; k++) addEvent(t, 'PUNCTURE', addDays(fitted_on, 20 + k * 25), { truck_id: truck.id, truck_no: truck.truck_no, position: POSITIONS[pi], cost: 150, vendor: 'Own tyre shop' });
      }
    }
  }
  for (let i = 0; i < 12; i++) addTyre('TYRE', tn++, i < 3 ? { resole_count: 1, repair_cost: 4200, km_run: 41000 } : {});
  for (let i = 0; i < 6; i++) addTyre('TUBE', tn++);
  for (let i = 0; i < 6; i++) addTyre('FLAP', tn++);
  for (let i = 0; i < 3; i++) {
    const t = addTyre('TYRE', tn++, { status: 'scrapped', km_run: 62000 + i * 5000, scrapped_on: addDays(today, -20 - i * 9), scrap_reason: 'Sidewall cut', resole_count: 1, repair_cost: 4200 });
    addEvent(t, 'SCRAP', t.scrapped_on, { note: t.scrap_reason });

  const attendance = [];

    for (const d of drivers) {
      const r = rand();

        id: newId(), driver_id: d.id, att_date: addDays(today, -back),

  const profile = { id: 'demo-me', full_name: { admin: 'Demo Admin', owner: 'Demo Owner', manager: 'Demo Manager', accountant: 'Demo Accountant', store_keeper: 'Demo Store Keeper', mechanic: 'Demo Mechanic', driver: 'Ramesh Behera' }[myRole], role: myRole, active: true };
  const canWrite = ['admin', 'owner', 'manager'].includes(myRole);
  const people = [
    { id: 'demo-me', full_name: profile.full_name, email: 'owner@example.com', phone: null, role: myRole, active: true },
    { id: newId(), full_name: 'Demo Manager', email: 'manager@example.com', phone: null, role: 'manager', active: true },
    { id: newId(), full_name: 'Sanjay Nayak', email: '9000000002@phone.fleet.local', phone: '9000000002', role: 'driver', active: false },

  const live = (rows) => rows.filter((r) => !r.deleted_at);
  const normalise = (no) => String(no || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();

  function statusRows(truckId) {
    const out = [];
    for (const t of live(trucks)) {
      if (truckId && t.id !== truckId) continue;
      if (t.status === 'sold') continue;
      for (const ty of TYPES) {
        const mine = live(documents).filter((d) => d.truck_id === t.id && d.doc_type === ty.code)
          .sort((a, b) => (b.expires_on || '').localeCompare(a.expires_on || '') || b.created_at.localeCompare(a.created_at));
        const l = mine[0];
        const needed = ty.required && (ty.applies_to === 'all' || ty.applies_to === t.vehicle_class);
        if (!needed && !l) continue;
        const days = l && l.expires_on ? daysBetween(today, l.expires_on) : null;
        let status = 'ok';
        if (!l) status = 'missing';
        else if (days === null) status = 'no_expiry';
        else if (days < 0) status = 'expired';
        else if (days <= ty.reminder_days) status = 'due_soon';
        out.push({
          truck_id: t.id, truck_no: t.truck_no, doc_type: ty.code, doc_name: ty.name, sort_order: ty.sort_order,
          document_id: l ? l.id : null, has_file: !!(l && l.has_file), doc_no: l ? l.doc_no : null, expires_on: l ? l.expires_on : null, days_left: days, status,
        });

    }
    return out;
  }

    listTrucks: () => delay({ data: live(trucks).sort((a, b) => a.truck_no.localeCompare(b.truck_no)), error: null }),
    getTruck: (id) => ok(live(trucks).find((t) => t.id === id) || null),
    async saveTruck(values, id) {

      if (id) { Object.assign(trucks.find((t) => t.id === id), v); return ok(trucks.find((t) => t.id === id)); }

    async assignDriver(truckId, driverId) {

      const stop = (t) => { for (const r of stretches) if (r.truck_id === t.id && r.to_date === null) r.to_date = today; Object.assign(t, { driver_id: null, driver_name: null, driver_since: null }); };
      let movedFrom = null;
      if (!driverId) { stop(truck); return { data: truck, movedFrom, error: null }; }
      if (truck.driver_id === driverId) return { data: truck, error: null };

      if (!d) return fail('Driver not found.');
      if (d.status !== 'active') return fail('Only a working driver can be assigned to a truck.');
      for (const o of live(trucks)) if (o.driver_id === driverId && o.id !== truckId) { stop(o); movedFrom = o.truck_no; }
      if (truck.driver_id) stop(truck);
      Object.assign(truck, { driver_id: d.id, driver_name: d.full_name, driver_since: today });
      stretches.push({ id: newId(), truck_id: truck.id, truck_no: truck.truck_no, driver_id: d.id, driver_name: d.full_name, from_date: today, to_date: null });

    listFuel: (from, to) => ok(live(fuel).filter((f) => f.entry_date >= from && f.entry_date <= to)

    async saveFuel(values, id) {

      const quantity = Number(values.quantity);
      if (!(quantity > 0 && quantity <= 5000)) return fail('Enter the litres: more than 0 and up to 5000.');
      const rate = Number(values.rate ?? 0);

      if (id) { const e = fuel.find((f) => f.id === id); Object.assign(e, row, { trip_id: values.trip_id !== undefined ? (values.trip_id || null) : e.trip_id }); return ok(e); }

    async removeFuel(id) { if (!['admin', 'owner', 'manager', 'store_keeper'].includes(myRole)) return forbidden(); fuel.find((f) => f.id === id).deleted_at = 'now'; return ok([{ id }]); },
    // --- tyres, tubes and flaps ---
    listTyres: () => ok(live(tyres).sort((a, b) => a.kind.localeCompare(b.kind) || a.serial_no.localeCompare(b.serial_no))),

    },
    listTyreEvents: (from, to) => ok(live(tyreEvents).filter((e) => e.event_date >= from && e.event_date <= to).sort((a, b) => b.event_date.localeCompare(a.event_date))),
    async saveTyre(values, id) {
      if (!TYRE_WRITERS.includes(myRole)) return forbidden();

      if (live(tyres).some((t) => t.serial_no === f.serial_no && t.kind === f.kind && t.id !== id)) return fail(`${f.serial_no} is already recorded.`);
      if (id) {
        const t = tyres.find((x) => x.id === id);
        if (t.kind !== f.kind) return fail('Tyre, tube or flap cannot be changed. Remove it and add a new one.');
        Object.assign(t, f); return ok(t);
      }
      const t = { id: newId(), ...f, ...newState(), deleted_at: null };
      tyres.push(t);
      addEvent(t, 'BOUGHT', f.purchase_date || today, { cost: f.cost, vendor: f.vendor });
      return ok(t);
    },
    async fitTyre(id, values) {
      if (!TYRE_WRITERS.includes(myRole)) return forbidden();
      try {
        const v = cleanFit(values);
        const truck = live(trucks).find((x) => x.id === v.truck_id);
        if (!truck) return fail('Truck not found.');
        const t = tyres.find((x) => x.id === id);
        const p = problemWith(t, 'fit'); if (p) return fail(p);
        if (t.purchase_date && v.date < t.purchase_date) return fail('It cannot be fitted before it was bought.');
        const clash = live(tyres).find((x) => x.id !== id && x.status === 'fitted' && x.truck_id === truck.id && x.kind === t.kind && x.position === v.position);
        if (clash) return fail(`${clash.serial_no} is already at ${v.position} on ${truck.truck_no}. Remove it first.`);
        Object.assign(t, { status: 'fitted', truck_id: truck.id, truck_no: truck.truck_no, position: v.position, fitted_on: v.date, fit_km: v.odometer_km });
        addEvent(t, 'FIT', v.date, { truck_id: truck.id, truck_no: truck.truck_no, position: v.position, odometer_km: v.odometer_km });
        return ok(t);
      } catch (e) { return fail(e.message); }
    },
    async unfitTyre(id, values) {
      if (!TYRE_WRITERS.includes(myRole)) return forbidden();
      try {
        const v = cleanMove(values);
        const t = tyres.find((x) => x.id === id);
        const p = problemWith(t, 'unfit'); if (p) return fail(p);
        if (v.odometer_km != null && t.fit_km != null && v.odometer_km < t.fit_km) return fail('The odometer is lower than when it was fitted.');
        if (v.date < t.fitted_on) return fail('The date is before it was fitted.');
        addEvent(t, 'REMOVE', v.date, { truck_id: t.truck_id, truck_no: t.truck_no, position: t.position, odometer_km: v.odometer_km, note: v.note });
        Object.assign(t, { status: 'in_stock', truck_id: null, truck_no: null, position: null, fitted_on: null, fit_km: null, km_run: t.km_run + kmSinceFit(t, v.odometer_km) });
        return ok(t);
      } catch (e) { return fail(e.message); }
    },
    async puncture(id, values) {
      if (!TYRE_WRITERS.includes(myRole)) return forbidden();
      try {
        const v = cleanRepair(values);
        const t = tyres.find((x) => x.id === id);
        const p = problemWith(t, 'puncture'); if (p) return fail(p);
        addEvent(t, 'PUNCTURE', v.date, { ...(t.status === 'fitted' ? { truck_id: t.truck_id, truck_no: t.truck_no, position: t.position } : {}), cost: v.cost, vendor: v.vendor, note: v.note });
        t.punctures += 1; t.repair_cost += v.cost;
        return ok(t);
      } catch (e) { return fail(e.message); }
    },
    async resole(id, values) {
      if (!TYRE_WRITERS.includes(myRole)) return forbidden();
      try {
        const v = cleanRepair(values);
        const t = tyres.find((x) => x.id === id);
        const p = problemWith(t, 'resole'); if (p) return fail(p);
        addEvent(t, 'RESOLE', v.date, { cost: v.cost, vendor: v.vendor, note: v.note });
        t.resole_count += 1; t.repair_cost += v.cost;
        return ok(t);
      } catch (e) { return fail(e.message); }
    },
    async scrapTyre(id, values) {
      if (!TYRE_WRITERS.includes(myRole)) return forbidden();
      try {
        const v = cleanScrap(values);
        const t = tyres.find((x) => x.id === id);
        const p = problemWith(t, 'scrap'); if (p) return fail(p);
        if (t.status === 'fitted' && v.odometer_km != null && t.fit_km != null && v.odometer_km < t.fit_km) return fail('The odometer is lower than when it was fitted.');
        addEvent(t, 'SCRAP', v.date, { ...(t.status === 'fitted' ? { truck_id: t.truck_id, truck_no: t.truck_no, position: t.position } : {}), odometer_km: v.odometer_km, note: v.reason });
        Object.assign(t, { km_run: t.km_run + (t.status === 'fitted' ? kmSinceFit(t, v.odometer_km) : 0), status: 'scrapped', truck_id: null, truck_no: null, position: null, fitted_on: null, fit_km: null, scrapped_on: v.date, scrap_reason: v.reason });
        return ok(t);
      } catch (e) { return fail(e.message); }
    },
    async removeTyre(id) {
      if (!TYRE_WRITERS.includes(myRole)) return forbidden();
      const t = tyres.find((x) => x.id === id);
      if (!t || t.status !== 'in_stock' || live(tyreEvents).some((e) => e.tyre_id === id && e.event !== 'BOUGHT')) return fail('It has history, so it cannot be removed. Scrap it instead.');
      t.deleted_at = 'now';
      for (const e of tyreEvents) if (e.tyre_id === id) e.deleted_at = 'now';
      return ok([{ id }]);
    },
    listTrips: (from, to) => ok(live(trips).filter((t) => (t.start_date >= from && t.start_date <= to) || t.status === 'running')
      .sort((a, b) => b.start_date.localeCompare(a.start_date))),
    tripTotals: (ids) => {
      const out = {};
      for (const id of ids) {
        out[id] = { advance: 0, expense: 0, diesel_amount: 0, diesel_litres: 0 };
        for (const e of live(tripEntries)) if (e.trip_id === id) out[id][e.kind === 'ADVANCE' ? 'advance' : 'expense'] += e.amount;
        for (const f of live(fuel)) if (f.trip_id === id && f.fuel_type === 'DIESEL') { out[id].diesel_amount += f.amount; out[id].diesel_litres += f.quantity; }

    },
    getTrip: (id) => {
      const trip = live(trips).find((t) => t.id === id);
      if (!trip) return fail('Trip not found.');
      return ok({ trip, entries: live(tripEntries).filter((e) => e.trip_id === id).sort((a, b) => a.entry_date.localeCompare(b.entry_date)),
        fuel: live(fuel).filter((f) => f.trip_id === id).sort((a, b) => a.entry_date.localeCompare(b.entry_date)) });
    },
    async saveTrip(values, id) {
      if (!canWrite) return forbidden();
      const to_place = String(values.to_place || '').trim();
      if (!to_place) return fail('Enter the destination.');
      if (!values.start_date) return fail('Choose the start date.');
      const end_date = values.end_date || null;
      if (end_date && end_date < values.start_date) return fail('The end date cannot be before the start date.');
      const truck = live(trucks).find((t) => t.id === values.truck_id);
      if (!truck) return fail('Truck not found.');
      const before = id ? trips.find((t) => t.id === id) : null;
      if (before && before.truck_id !== truck.id) return fail('The truck of a trip cannot be changed. Remove the trip and add it again.');
      if (!end_date) {
        const other = live(trips).find((t) => t.truck_id === truck.id && t.status === 'running' && t.id !== id);
        if (other) return fail(`${truck.truck_no} already has a running trip to ${other.to_place}. Complete it first.`);
      }
      const driver_id = values.driver_id || (before ? before.driver_id : truck.driver_id) || null;
      const driver = driver_id ? drivers.find((d) => d.id === driver_id) : null;
      const row = { truck_id: truck.id, truck_no: truck.truck_no, driver_id, driver_name: driver ? driver.full_name : null,

        km: values.km ?? null, load_tons: values.load_tons ?? null, freight: values.freight ?? null,
        status: end_date ? 'completed' : 'running', notes: values.notes || null };
      if (before) { Object.assign(before, row, { settled_on: end_date ? before.settled_on : null }); return ok(before); }
      const t = { id: newId(), settled_on: null, deleted_at: null, ...row };
      trips.push(t);
      return ok(t);
    },
    async removeTrip(id) {
      if (!canWrite) return forbidden();
      if (live(tripEntries).some((e) => e.trip_id === id) || live(fuel).some((f) => f.trip_id === id)) return fail('Remove its cash entries and unlink its diesel first.');

    async saveTripEntry(values, id) {

      const e = tripEntries.find((x) => x.id === id);

      e.deleted_at = 'now';
      return ok([{ id }]);
    },
    truckHistory: (truckId) => ok(stretches.filter((r) => r.truck_id === truckId).sort((a, b) => b.from_date.localeCompare(a.from_date))),
    driverHistory: (driverId) => ok(stretches.filter((r) => r.driver_id === driverId).sort((a, b) => b.from_date.localeCompare(a.from_date))),
    async removeTruck(id) { if (!canWrite) return forbidden(); trucks.find((t) => t.id === id).deleted_at = 'now'; return ok([{ id }]); },

    docStatus: ({ truckId } = {}) => delay({ data: statusRows(truckId), error: null }),
    listDocumentTypes: () => ok(TYPES),
    listDocuments: (truckId) => ok(live(documents).filter((d) => d.truck_id === truckId)
      .sort((a, b) => (b.expires_on || '').localeCompare(a.expires_on || ''))),
    async saveDocument(values, id) {
      if (!canWrite) return forbidden();
      if (values.issued_on && values.expires_on && values.expires_on < values.issued_on) return fail('violates check constraint "vehicle_documents_check"');

      const row = id ? documents.find((d) => d.id === id) : { id: newId(), remarks: null, deleted_at: null, created_at: new Date().toISOString(), has_file: false, file_name: null };
      Object.assign(row, rest);

      else if (remove_file) { row.has_file = false; row.file_name = null; delete files[row.id]; }

    async getDocumentFile(id) { return files[id] ? ok(files[id]) : fail('No file is attached to this entry.'); },
    async removeDocument(id) { if (!canWrite) return forbidden(); documents.find((d) => d.id === id).deleted_at = 'now'; return ok([{ id }]); },

    async listDrivers() {
      if (!['admin', 'owner', 'manager', 'accountant'].includes(myRole)) return ok(live(drivers).filter((d) => d.profile_id === 'demo-me'));
      return delay({ data: live(drivers).sort((a, b) => a.full_name.localeCompare(b.full_name)), error: null });

    async saveDriver(values, id) {

      const { files: newFiles = {}, remove_files: removed = [], ...rest } = values;

// ---- docstatus.js ----
const __m_docstatus = (() => {
// Vehicle document types and the expiry status of each document.
// Pure functions, no browser or database needed, so they are easy to test.
//
// Each truck record keeps `docs_latest`: for every document type, the entry with
// the latest expiry ({ document_id, doc_no, expires_on }). The dashboard reads only
// the trucks, never the whole document history, which keeps it fast and cheap.

const { daysBetween } = __m_ui;
const DOC_TYPES = [
  { code: 'RC', name: 'Registration Certificate (RC)', required: true, applies_to: 'all', reminder_days: 60, sort_order: 10 },
  { code: 'INSURANCE', name: 'Insurance', required: true, applies_to: 'all', reminder_days: 30, sort_order: 20 },
  { code: 'FITNESS', name: 'Fitness Certificate', required: true, applies_to: 'all', reminder_days: 30, sort_order: 30 },
  { code: 'ROAD_TAX', name: 'Road Tax', required: true, applies_to: 'all', reminder_days: 30, sort_order: 40 },
  { code: 'PERMIT', name: 'Permit', required: true, applies_to: 'all', reminder_days: 30, sort_order: 50 },
  { code: 'PUC', name: 'Pollution (PUC)', required: true, applies_to: 'all', reminder_days: 15, sort_order: 60 },
  { code: 'NATIONAL_PERMIT', name: 'National Permit', required: true, applies_to: 'national', reminder_days: 30, sort_order: 70 },
];

// The entry with the latest expiry wins. An entry without an expiry date comes last.
// Among equal expiry dates the newest entry wins (a not-yet-saved entry has no created_at, so it counts as newest).
function latestEntry(rows) {
  const sorted = [...rows].sort((a, b) =>
    (b.expires_on || '').localeCompare(a.expires_on || '')
    || String(b.created_at || '~').localeCompare(String(a.created_at || '~')));
  const top = sorted[0];
  return top ? { document_id: top.id, doc_no: top.doc_no ?? null, expires_on: top.expires_on ?? null, has_file: top.has_file === true } : null;
}

// One row per (truck, document that is required or recorded), same shape the screens always used.
// status: missing | expired | due_soon | ok | no_expiry
function statusRows(trucks, today) {
  const out = [];
  for (const t of trucks) {
    if (t.deleted_at || t.status === 'sold') continue;
    const latest = t.docs_latest || {};
    for (const ty of DOC_TYPES) {
      const l = latest[ty.code] || null;
      const needed = ty.required && (ty.applies_to === 'all' || ty.applies_to === t.vehicle_class);
      if (!needed && !l) continue;
      const days = l && l.expires_on ? daysBetween(today, l.expires_on) : null;
      let status = 'ok';
      if (!l) status = 'missing';
      else if (days === null) status = 'no_expiry';
      else if (days < 0) status = 'expired';
      else if (days <= ty.reminder_days) status = 'due_soon';
      out.push({
        truck_id: t.id, truck_no: t.truck_no, doc_type: ty.code, doc_name: ty.name, sort_order: ty.sort_order,
        document_id: l ? l.document_id : null, has_file: !!(l && l.has_file), doc_no: l ? l.doc_no : null, expires_on: l ? l.expires_on : null,
        days_left: days, status,
      });
    }
  }
  return out;
}

return { DOC_TYPES, latestEntry, statusRows };
})();

// ---- api.firebase.js ----
const __m_api_firebase = (() => {
// Real backend: Firebase (Authentication + Firestore).
// Gives the screens the same methods as the demo backend, so no screen knows which one it is using.
//
// Rules that Firestore enforces for us are in firebase/firestore.rules.
// This file adds what rules cannot do: unique values, the audit entry written with each change,
// and the latest document per type kept on the truck.
//
// `sdk` is the Firebase web SDK (loaded in api.js). It is passed in so the tests can use a stand-in.

const { todayIST } = __m_ui;
const { DOC_TYPES, latestEntry, statusRows } = __m_docstatus;
const { DRIVER_FILE_KINDS } = __m_driverfiles;
const { cleanTyre, newState, cleanFit, cleanMove, cleanRepair, cleanScrap, kmSinceFit, problemWith } = __m_tyrelogic;
const STAMP_KEYS = new Set(['created_at', 'created_by', 'updated_at', 'updated_by', 'deleted_at', 'docs_latest']);
const TRUCK_FIELDS = ['truck_no', 'make_model', 'vehicle_class', 'capacity_tons', 'ownership', 'status', 'notes'];
const DRIVER_FIELDS = ['full_name', 'phone', 'dl_no', 'dl_expiry', 'aadhaar_last4', 'bank_account_no', 'bank_ifsc', 'join_date', 'status', 'notes'];
const DOC_FIELDS = ['doc_type', 'doc_no', 'issued_on', 'expires_on', 'remarks'];
const MAX_FILE_TEXT = 900000;          // the rules allow at most this many characters of file data
const FILE_TYPES = ['image/jpeg', 'application/pdf'];
const checkFile = (file) => {
  if (!FILE_TYPES.includes(file.mime) || !file.data || file.data.length > MAX_FILE_TEXT || !(file.bytes > 0)) {
    throw fail('This file cannot be saved. Use a photo or a PDF under 600 KB.');
  }
};
const CHUNK = 4;          // rows per batch; Firestore limits how many documents a rule may look up per request
const QUEUE_AFTER_MS = 5000;

const fail = (message, code) => Object.assign(new Error(message), { code: code || 'app/error' });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const dayNumber = (iso) => Number(String(iso).replace(/-/g, ''));
const attId = (driverId, date) => `${driverId}_${date}`;

function pick(values, fields) {
  const out = {};
  for (const f of fields) {
    const v = values[f];
    out[f] = v === undefined || v === '' ? null : v;
  }
  return out;
}

// Drivers without an email sign in with their phone number. It becomes a made-up address.
function loginEmail(input) {
  const s = String(input || '').trim();
  if (s.includes('@')) return s.toLowerCase();
  const digits = s.replace(/\D/g, '');
  if (/^[\d\s+\-()]+$/.test(s) && digits.length >= 8) return `${digits}@phone.fleet.local`;
  // A plain user name such as "admin" becomes admin@user.fleet.local
  return /^[A-Za-z0-9._-]+$/.test(s) ? `${s.toLowerCase()}@user.fleet.local` : s;
}

const ADMIN_EMAIL = 'admin@user.fleet.local';
const DEFAULT_ADMIN_PASSWORD = 'admin123';

function createFirebaseApi(cfg, sdk) {
  const {
    initializeApp, deleteApp, getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut: fbSignOut,
    createUserWithEmailAndPassword, sendPasswordResetEmail, updatePassword,
    initializeFirestore, persistentLocalCache, persistentMultipleTabManager, getFirestore,
    collection, doc, getDoc, getDocs, query, where, setDoc, updateDoc, deleteDoc, writeBatch, runTransaction, serverTimestamp,
  } = sdk;

  const app = initializeApp(cfg.firebase);
  const auth = getAuth(app);
  let db;
  try {
    // Keeps data on the phone so screens open and entries are queued when there is no signal.
    db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  } catch (e) {
    db = getFirestore(app);
  }

  let me = null;                         // the signed-in person's profile
  const authListeners = [];
  const errorListeners = [];
  const queuedListeners = [];
  const authReady = new Promise((resolve) => {
    let first = true;
    onAuthStateChanged(auth, (user) => {
      if (first) { first = false; resolve(user); return; }
      authListeners.forEach((f) => f(user ? { user } : null));
    });
  });

  const uid = () => {
    if (!auth.currentUser) throw fail('You are signed out. Sign in again.', 'app/signed-out');
    return auth.currentUser.uid;
  };
  const role = () => (me ? me.role : null);

  // ---------------------------------------------------------------- helpers
  const plain = (v) => (v && typeof v.toDate === 'function' ? v.toDate().toISOString() : v);
  function rowOf(snap) {
    const out = { id: snap.id };
    for (const [k, v] of Object.entries(snap.data({ serverTimestamps: 'estimate' }))) out[k] = plain(v);
    return out;
  }
  const live = (rows) => rows.filter((r) => !r.deleted_at);
  const coll = (name) => collection(db, name);

  async function rowsWhere(name, ...conds) {
    const q = conds.length ? query(coll(name), ...conds.map(([f, op, v]) => where(f, op, v))) : coll(name);
    const snap = await getDocs(q);
    return snap.docs.map(rowOf);
  }

  const newStamps = () => ({ created_at: serverTimestamp(), created_by: uid(), updated_at: serverTimestamp(), updated_by: uid(), deleted_at: null });
  const editStamps = () => ({ updated_at: serverTimestamp(), updated_by: uid() });
  const deleteStamps = () => ({ deleted_at: serverTimestamp(), ...editStamps() });

  function strip(o) {
    if (!o) return null;
    const out = {};
    for (const [k, v] of Object.entries(o)) if (!STAMP_KEYS.has(k) && k !== 'id') out[k] = v === undefined ? null : v;
    return out;
  }

    batch.set(doc(coll('audit_log')), {
      at: serverTimestamp(), by: uid(), by_name: me ? me.full_name : null, path, action, before: strip(before), after: strip(after),
    });

  // Sends a batch. If there is no signal it stays queued on the phone and uploads later.
  async function commit(batch, { noWait } = {}) {
    const done = batch.commit();
    if (noWait) { done.catch((e) => errorListeners.forEach((f) => f(e))); return { queued: true }; }
    const outcome = await Promise.race([done.then(() => 'sent'), wait(QUEUE_AFTER_MS).then(() => 'queued')]);
    if (outcome === 'queued') {
      done.catch((e) => errorListeners.forEach((f) => f(e)));
      queuedListeners.forEach((f) => f());
      return { queued: true };
    }
    return { queued: false };
  }

  const guard = (fn) => async (...args) => {
    try { return await fn(...args); } catch (e) { return { data: null, error: e }; }
  };

  // ---------------------------------------------------------------- trucks
  async function allTrucks() { return (await rowsWhere('trucks', ['deleted_at', '==', null])).sort((a, b) => a.truck_no.localeCompare(b.truck_no)); }

  async function saveTruckImpl(values, id) {
    const truck_no = String(values.truck_no || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
    if (!/^[A-Z0-9]{6,12}$/.test(truck_no)) throw fail('violates check constraint "trucks_truck_no_check"');
    const same = live(await rowsWhere('trucks', ['truck_no', '==', truck_no])).filter((r) => r.id !== id);
    if (same.length) throw fail('duplicate key value violates unique constraint "trucks_truck_no_uq"');

    const fields = { ...pick(values, TRUCK_FIELDS), truck_no };
    const batch = writeBatch(db);
    if (id) {
      const ref = doc(db, 'trucks', id);
      const snap = await getDoc(ref);
      if (!snap.exists() || snap.data().deleted_at) throw fail('Truck not found.');
      const before = rowOf(snap);
      batch.update(ref, { ...fields, ...editStamps() });
      audit(batch, `trucks/${id}`, 'UPDATE', before, { ...before, ...fields });
      const res = await commit(batch);
      return { data: { ...before, ...fields }, error: null, queued: res.queued };
    }
    const ref = doc(coll('trucks'));
    batch.set(ref, { ...fields, docs_latest: {}, ...newStamps() });
    audit(batch, `trucks/${ref.id}`, 'INSERT', null, fields);
    const res = await commit(batch);
    return { data: { id: ref.id, ...fields, docs_latest: {}, deleted_at: null }, error: null, queued: res.queued };
  }

  async function removeTruckImpl(id) {
    const ref = doc(db, 'trucks', id);
    const snap = await getDoc(ref);
    if (!snap.exists()) throw fail('Truck not found.');
    const batch = writeBatch(db);
    batch.update(ref, deleteStamps());
    audit(batch, `trucks/${id}`, 'SOFT_DELETE', rowOf(snap), null);

    return { data: [{ id }], error: null, queued: res.queued };
  }

  // ---------------------------------------------------------------- driver assignment
  // One driver drives one truck at a time. Assigning a driver who is on another truck moves him
  // (the other truck is cleared in the same batch). Rules cannot check this; the app does.
  // The history of who drove which truck is in the audit log (each change is an UPDATE entry).
  const NO_DRIVER = { driver_id: null, driver_name: null, driver_since: null };

  // History: one row per stretch of a driver on a truck (truck_drivers: from_date, to_date; to_date is null while it lasts).
  // Closes the open stretch of a truck. If the truck had a driver from before history existed, the stretch is added already closed.
  async function closeStretch(batch, t, today) {
    const open = live(await rowsWhere('truck_drivers', ['truck_id', '==', t.id], ['to_date', '==', null]));
    for (const o of open) batch.update(doc(db, 'truck_drivers', o.id), { to_date: today, ...editStamps() });
    if (!open.length && t.driver_id) {
      batch.set(doc(coll('truck_drivers')), {
        truck_id: t.id, truck_no: t.truck_no, driver_id: t.driver_id, driver_name: t.driver_name || '',
        from_date: t.driver_since || today, to_date: today, ...newStamps(),

  }

  async function assignDriverImpl(truckId, driverId) {
    const today = todayIST();
    const tref = doc(db, 'trucks', truckId);
    const tsnap = await getDoc(tref);
    if (!tsnap.exists() || tsnap.data().deleted_at) throw fail('Truck not found.');
    const truck = rowOf(tsnap);
    if ((truck.driver_id || null) === (driverId || null)) return { data: truck, error: null, queued: false };
    const batch = writeBatch(db);

    let movedFrom = null;
    if (driverId) {
      const dsnap = await getDoc(doc(db, 'drivers', driverId));
      if (!dsnap.exists() || dsnap.data().deleted_at) throw fail('Driver not found.');
      const driver = rowOf(dsnap);
      if (driver.status !== 'active') throw fail('Only a working driver can be assigned to a truck.');
      const others = live(await rowsWhere('trucks', ['driver_id', '==', driverId])).filter((r) => r.id !== truckId);

  const byRecent = (a, b) => (b.from_date || '').localeCompare(a.from_date || '')

  // Who drove this truck, newest first.
  async function truckHistoryImpl(truckId) {
    const rows = live(await rowsWhere('truck_drivers', ['truck_id', '==', truckId]));
    const snap = await getDoc(doc(db, 'trucks', truckId));
    const t = snap.exists() ? rowOf(snap) : null;
    if (t && !t.deleted_at && t.driver_id && !rows.some((r) => r.to_date === null)) {
      rows.push({ id: 'current', truck_id: t.id, truck_no: t.truck_no, driver_id: t.driver_id, driver_name: t.driver_name, from_date: t.driver_since, to_date: null });
    }
    return { data: rows.sort(byRecent), error: null };
  }

  // Which trucks this driver drove, newest first.
  async function driverHistoryImpl(driverId) {

    for (const t of live(await rowsWhere('trucks', ['driver_id', '==', driverId]))) {

      }

  }

  // Which truck each driver was on at a given date: { driverId: { truck_id, truck_no } }.

  // ---------------------------------------------------------------- fuel (diesel, urea, lube)
  const FUEL_TYPES = ['DIESEL', 'UREA', 'LUBE'];
  const txt = (v, max) => { const t = String(v ?? '').trim(); return t ? t.slice(0, max) : null; };

  async function listFuelImpl(from, to) {
    const rows = live(await rowsWhere('fuel_entries', ['entry_date', '>=', from], ['entry_date', '<=', to]));
    return { data: rows.sort((a, b) => b.entry_date.localeCompare(a.entry_date) || String(b.created_at).localeCompare(String(a.created_at))), error: null };
  }

  async function saveFuelImpl(values, id) {
    if (!FUEL_TYPES.includes(values.fuel_type)) throw fail('Choose diesel, urea or lube.');
    const quantity = Number(values.quantity);
    if (!(quantity > 0 && quantity <= 5000)) throw fail('Enter the litres: more than 0 and up to 5000.');
    const rate = Number(values.rate ?? 0);
    if (!(rate >= 0 && rate <= 100000)) throw fail('Enter the rate per litre.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(values.entry_date || '')) throw fail('Choose a date.');
    const odometer_km = values.odometer_km === null || values.odometer_km === undefined || values.odometer_km === '' ? null : Number(values.odometer_km);
    if (odometer_km !== null && !(odometer_km >= 0)) throw fail('The odometer reading is not valid.');

    if (!tsnap.exists() || tsnap.data().deleted_at) throw fail('Truck not found.');
    const truck = rowOf(tsnap);
    // The driver: the one chosen, else the one on the truck now.

    let driver_name = null;
    if (driver_id && driver_id === truck.driver_id) driver_name = truck.driver_name || null;
    else if (driver_id) {
      const dsnap = await getDoc(doc(db, 'drivers', driver_id));
